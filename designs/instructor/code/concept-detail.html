<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Instructor — Concept Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Instructor — Concept Detail (RPT-004 drill-down)
     Lightweight detail view opened from concept-mastery.html.
     Never fabricates mastery data — concepts with too little
     supporting evidence show an explicit "Insufficient data" state.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-secondary:#525252; --text-tertiary:#a3a3a3; --text-disabled:#d4d4d4;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f5f5f5; --border-strong:#a3a3a3;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --focus-ring:#6366f1;
    --error:#dc2626; --error-subtle:#fef2f2; --error-border:#fecaca;
    --warning:#ca8a04; --warning-subtle:#fefce8; --warning-border:#fef08a;
    --success:#15803d; --success-subtle:#f0fdf4; --success-border:#bbf7d0;
    --brand-subtle:#eef2ff; --brand-border:#c7d2fe;
    --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-xl:12px; --radius-full:999px;
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,input,select{ font-family:var(--font); }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; min-height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; overflow-y:auto; padding:32px 32px 48px; }
  .content{ max-width:820px; margin:0 auto; }

  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:var(--text-secondary); margin-bottom:16px; }
  .back-link:hover{ color:var(--action-primary); }

  .detail-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:6px; flex-wrap:wrap; }
  .detail-head h1{ margin:0 0 4px; font-size:24px; font-weight:700; letter-spacing:-.3px; }
  .detail-head .course-tag{ font-size:12px; color:var(--text-tertiary); font-weight:600; }

  .mastery-badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:5px 12px; border-radius:var(--radius-full); white-space:nowrap; }
  .mastery-badge i{ width:6px; height:6px; border-radius:50%; }
  .mastery-badge.mastered{ background:var(--success-subtle); color:var(--success); border:1px solid var(--success-border); }
  .mastery-badge.mastered i{ background:var(--success); }
  .mastery-badge.developing{ background:var(--warning-subtle); color:var(--warning); border:1px solid var(--warning-border); }
  .mastery-badge.developing i{ background:var(--warning); }
  .mastery-badge.struggling{ background:var(--error-subtle); color:var(--error); border:1px solid var(--error-border); }
  .mastery-badge.struggling i{ background:var(--error); }

  .metrics-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin:24px 0; }
  .metric-block{ display:flex; flex-direction:column; gap:4px; padding:16px 18px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); }
  .metric-lbl{ font-size:12px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.3px; }
  .metric-val{ font-size:24px; font-weight:700; color:var(--text-primary); }
  .metric-sub{ font-size:12px; color:var(--text-tertiary); }

  .card{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); margin-bottom:20px; overflow:hidden; }
  .card-head{ padding:16px 20px; border-bottom:1px solid var(--border-subtle); }
  .card-title{ font-size:14px; font-weight:700; color:var(--text-primary); margin:0; }
  .card-body{ padding:18px 20px; }

  .assessment-chip{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--text-secondary); background:var(--surface-canvas); border:1px solid var(--border-default); padding:6px 12px 6px 10px; border-radius:var(--radius-md); margin:0 8px 8px 0; }
  .assessment-chip svg{ width:14px; height:14px; color:var(--text-tertiary); }
  .assessment-chip:hover{ color:var(--action-primary); border-color:var(--brand-border); background:var(--brand-subtle); }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:12px; font-weight:500; color:var(--text-secondary); background:var(--surface-canvas); padding:10px 20px; border-bottom:1px solid var(--border-default); }
  tbody tr{ border-bottom:1px solid var(--border-subtle); cursor:pointer; }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-canvas); }
  td{ padding:11px 20px; font-size:14px; vertical-align:middle; }
  .learner-name-cell{ font-weight:600; color:var(--text-primary); }
  .learner-name-cell:hover{ color:var(--action-primary); }
  .perf-badge{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 8px; border-radius:var(--radius-full); }
  .perf-badge.mastered{ background:var(--success-subtle); color:var(--success); }
  .perf-badge.developing{ background:var(--warning-subtle); color:var(--warning); }
  .perf-badge.struggling{ background:var(--error-subtle); color:var(--error); }

  .improvement-box{ display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--success-subtle); border:1px solid var(--success-border); border-radius:var(--radius-lg); margin-bottom:20px; font-size:14px; color:#14532d; }
  .improvement-box svg{ width:18px; height:18px; flex-shrink:0; color:var(--success); }
  .improvement-box b{ font-weight:700; }

  /* Insufficient-data state */
  .insufficient-card{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); padding:40px 32px; text-align:center; }
  .insufficient-icon{ width:48px; height:48px; border-radius:50%; background:var(--surface-raised); color:var(--text-tertiary); display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .insufficient-title{ font-size:16px; font-weight:600; color:var(--text-primary); margin:0 0 8px; }
  .insufficient-desc{ font-size:14px; color:var(--text-secondary); max-width:440px; margin:0 auto; line-height:1.55; }

  .not-found-card{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); padding:48px 32px; text-align:center; }
  /* mobile: hide sidebar below 768px (same as Manager/dashboard.html) */
  @media (max-width:768px){ .shell, .shell.sidebar-collapsed{ grid-template-columns:0 1fr; } .sidebar-frame{ display:none; } }
</style>
</head>
<body>

<div class="shell">
  <iframe class="sidebar-frame" src="../component/sidebar.html?active=reports" title="Instructor Navigation"></iframe>
  <iframe class="topbar-frame" src="../component/topnavbar.html?current=Concept+Detail" title="Top Navbar"></iframe>

  <main class="main">
    <div class="content">
      <a href="concept-mastery.html" class="back-link">&larr; Back to Concept Mastery</a>
      <div id="detailRoot"></div>
    </div>
  </main>
</div>

<!-- DS Charts (UpSpace library: Line and bar chart / Pie chart / Progress circle / _Legend / Tooltip).
     Usage: UpChart.line(el, {...}) · UpChart.bar(el, {...}) · UpChart.donut(el, {...}) · UpChart.progress(el, {...}); each returns { update(opts) }. -->
<style>
  .upc{ position:relative; width:100%; font-family:"DM Sans", ui-sans-serif, system-ui, sans-serif; color:#525252; }
  .upc svg{ display:block; width:100%; overflow:visible; }
  .upc-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; margin:0 0 12px; padding:0; list-style:none; font-size:14px; line-height:20px; color:#525252; }
  .upc-legend li{ display:inline-flex; align-items:center; gap:8px; }
  .upc-legend i{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .upc-legend i.dash{ width:14px; height:0; border-radius:0; border-top:2px dashed; background:none !important; }
  .upc-axis{ font-size:12px; fill:#525252; }
  .upc-grid{ stroke:#f5f5f5; stroke-width:1; }
  .upc-tip{ position:absolute; z-index:5; pointer-events:none; min-width:120px; padding:8px 12px; background:#fff; border:1px solid #e5e5e5; border-radius:8px;
    box-shadow:0 12px 16px -4px rgba(23,23,23,.08), 0 4px 6px -2px rgba(23,23,23,.03); font-size:12px; line-height:18px; color:#525252; white-space:nowrap; transition:opacity .12s; }
  .upc-tip b{ display:block; margin-bottom:2px; font-weight:500; color:#171717; }
  .upc-tip span{ display:flex; align-items:center; gap:6px; } .upc-tip span i{ width:8px; height:8px; border-radius:50%; }
  .upc-tip span em{ margin-left:auto; padding-left:12px; font-style:normal; font-weight:500; color:#171717; font-variant-numeric:tabular-nums; }
  .upc-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .upc-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center; }
  .upc-center strong{ font-size:30px; line-height:38px; font-weight:500; color:#171717; letter-spacing:-.4px; } .upc-center small{ font-size:14px; color:#525252; }
  @media (prefers-reduced-motion: no-preference){ .upc-draw{ stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:upc-draw .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .upc-grow{ transform-box:fill-box; transform-origin:bottom; animation:upc-grow .6s cubic-bezier(.2,.7,.2,1) both; } }
  @keyframes upc-draw{ to{ stroke-dashoffset:0; } } @keyframes upc-grow{ from{ transform:scaleY(0); } }
</style>
<script>
(function(){
  if (window.UpChart) return;
  var NS = 'http://www.w3.org/2000/svg';
  // DS series palette (Line and bar chart / Pie chart), then extended legend colors from the library
  var PALETTE = ['#4f46e5', '#818cf8', '#3730a3', '#22c55e', '#3b82f6', '#ec4899'];
  var STACK = ['#4338ca', '#6366f1', '#a5b4fc', '#c7d2fe'];
  var PIE = ['#4f46e5', '#6366f1', '#818cf8', '#a5b4fc', '#c7d2fe', '#e0e7ff'];
  function el(tag, attrs, parent){ var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function h(tag, cls, parent, html){ var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; if (parent) parent.appendChild(n); return n; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function niceStep(v){ var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
  function niceMax(v){ if (v <= 0) return 1; var s = niceStep(v / 5); return Math.ceil(v / s - 1e-9) * s; }
  function fmtFn(o){ return o.format || function(v){ return (Math.round(v * 10) / 10).toLocaleString() + (o.unit || ''); }; }

  function mount(host, o, draw){
    host = typeof host === 'string' ? document.querySelector(host) : host;
    host.innerHTML = ''; host.classList.add('upc');
    var state = { o: o }, ro, last = 0;
    function render(){ var w = host.clientWidth; if (!w) return; last = w; host.innerHTML = ''; draw(host, state.o, w); }
    render();
    if (window.ResizeObserver) { ro = new ResizeObserver(function(){ if (Math.abs(host.clientWidth - last) > 2) render(); }); ro.observe(host); }
    return { update: function(n){ state.o = Object.assign({}, state.o, n, { animate: false }); render(); }, el: host };
  }
  function legend(host, items){ if (!items.length) return; var ul = h('ul', 'upc-legend', host);
    items.forEach(function(it){ h('li', '', ul, '<i class="' + (it.dash ? 'dash' : '') + '" style="background:' + it.color + ';border-color:' + it.color + '"></i>' + esc(it.name)); }); }
  function srTable(host, title, labels, series, fmt){
    var t = '<table><caption>' + esc(title || 'Chart data') + '</caption><tr><th></th>' + series.map(function(s){ return '<th>' + esc(s.name) + '</th>'; }).join('') + '</tr>';
    labels.forEach(function(l, i){ t += '<tr><th>' + esc(l) + '</th>' + series.map(function(s){ return '<td>' + (s.data[i] == null ? '—' : esc(fmt(s.data[i]))) + '</td>'; }).join('') + '</tr>'; });
    h('div', 'upc-sr', host, t + '</table>');
  }
  function tip(host){ var t = h('div', 'upc-tip', host); t.style.opacity = 0; return t; }
  function showTip(t, host, x, y, title, rows){
    t.innerHTML = '<b>' + esc(title) + '</b>' + rows.map(function(r){ return '<span><i style="background:' + r.color + '"></i>' + esc(r.name) + '<em>' + esc(r.value) + '</em></span>'; }).join('');
    t.style.opacity = 1; var w = t.offsetWidth, hw = host.clientWidth;
    t.style.left = Math.max(0, Math.min(x + 12, hw - w)) + 'px'; if (x + 12 + w > hw) t.style.left = Math.max(0, x - w - 12) + 'px';
    t.style.top = Math.max(0, y - t.offsetHeight / 2) + 'px';
  }

  // axes frame shared by line + bar: returns geometry helpers
  function frame(svg, o, w, labels, max, fmt){
    var H = o.height || 240, padL = 0, padB = o.xLabels === false ? 8 : 28, step = niceStep(max / 5);
    if (max / step > 6 || Math.abs(max / step - Math.round(max / step)) > 1e-6) step = max / 5;
    var tickVals = []; for (var v0 = 0; v0 <= max + 1e-9; v0 += step) tickVals.push(v0);
    var meas = el('text', { class: 'upc-axis' }, svg); padL = 0;
    tickVals.forEach(function(v){ meas.textContent = fmt(v); padL = Math.max(padL, meas.getComputedTextLength ? meas.getComputedTextLength() : 30); }); svg.removeChild(meas);
    padL = Math.ceil(padL) + 12; var plotW = Math.max(40, w - padL - 4), plotH = H - padB - 8;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + H); svg.setAttribute('height', H);
    tickVals.forEach(function(v){ var y = 8 + plotH - (v / max) * plotH;
      el('line', { class: 'upc-grid', x1: padL, x2: padL + plotW, y1: y, y2: y }, svg);
      var tx = el('text', { class: 'upc-axis', x: padL - 12, y: y + 4, 'text-anchor': 'end' }, svg); tx.textContent = fmt(v); });
    return { H: H, padL: padL, plotW: plotW, plotH: plotH, top: 8, y: function(v){ return 8 + plotH - (Math.max(0, v) / max) * plotH; } };
  }
  function xLabels(svg, g, labels, xAt, o){
    if (o.xLabels === false) return;
    // thin by the widest real label (+16px gap), always keep the last one, never let it collide with its neighbour
    var meas = el('text', { class: 'upc-axis' }, svg), widest = 0, last = labels.length - 1;
    labels.forEach(function(l){ meas.textContent = l; widest = Math.max(widest, meas.getComputedTextLength ? meas.getComputedTextLength() : 30); }); svg.removeChild(meas);
    var span = last > 0 ? Math.abs(xAt(1) - xAt(0)) : g.plotW, every = Math.max(1, Math.ceil((widest + 16) / span));
    var kept = [];
    labels.forEach(function(l, i){ if (i !== last && (i % every || last - i < every)) return;
      var x = xAt(i), anchor = x - widest / 2 < g.padL - 8 ? 'start' : x + widest / 2 > g.padL + g.plotW + 4 ? 'end' : 'middle';
      var t = el('text', { class: 'upc-axis', x: x, y: g.top + g.plotH + 20, 'text-anchor': anchor }, svg); t.textContent = l;
      var bb = t.getBBox ? t.getBBox() : { x: x, width: 0 }, prev = kept[kept.length - 1];
      if (prev && bb.x < prev.r + 8) { if (i === last) { svg.removeChild(prev.t); kept.pop(); } else { svg.removeChild(t); return; } }
      kept.push({ t: t, r: bb.x + bb.width }); });
  }

  function line(host, o){ return mount(host, o, function(host, o, w){
    var labels = o.labels, series = o.series, fmt = fmtFn(o);
    legend(host, series.map(function(s, i){ return { name: s.name, color: s.color || PALETTE[i % PALETTE.length], dash: s.dashed }; }).filter(function(){ return o.legend !== false; }));
    var all = []; series.forEach(function(s){ s.data.forEach(function(v){ if (v != null) all.push(v); }); });
    var max = o.max != null ? o.max : niceMax(Math.max.apply(null, all.concat([0])) );
    var svg = el('svg', { role: 'img', 'aria-label': o.title || 'Line chart' }, host), g = frame(svg, o, w, labels, max, fmt);
    var n = labels.length, xAt = function(i){ return g.padL + (n === 1 ? g.plotW / 2 : (i / (n - 1)) * g.plotW); };
    xLabels(svg, g, labels, xAt, o);
    var defs = el('defs', {}, svg);
    series.forEach(function(s, si){
      var c = s.color || PALETTE[si % PALETTE.length], pts = [];
      s.data.forEach(function(v, i){ if (v != null) pts.push([xAt(i), g.y(v)]); });
      if (!pts.length) return;
      var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      if ((o.area !== false && si === 0 && !s.dashed) || s.area) {
        var id = 'upcg' + Math.random().toString(36).slice(2, 8), lg = el('linearGradient', { id: id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        el('stop', { offset: '0%', 'stop-color': c, 'stop-opacity': .16 }, lg); el('stop', { offset: '100%', 'stop-color': c, 'stop-opacity': 0 }, lg);
        el('path', { d: d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (g.top + g.plotH) + ' L' + pts[0][0].toFixed(1) + ' ' + (g.top + g.plotH) + ' Z', fill: 'url(#' + id + ')' }, svg);
      }
      var p = el('path', { d: d, fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      if (s.dashed) p.setAttribute('stroke-dasharray', '6 6');
      else if (o.animate !== false && p.getTotalLength) { p.style.setProperty('--len', p.getTotalLength()); p.classList.add('upc-draw'); }
    });
    var cross = el('line', { x1: 0, x2: 0, y1: g.top, y2: g.top + g.plotH, stroke: '#d4d4d4', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0 }, svg);
    var dots = series.map(function(s, si){ return el('circle', { r: 5, fill: '#fff', stroke: s.color || PALETTE[si % PALETTE.length], 'stroke-width': 2, opacity: 0 }, svg); });
    var t = tip(host), hit = el('rect', { x: g.padL, y: g.top, width: g.plotW, height: g.plotH, fill: 'transparent' }, svg);
    function at(clientX){ var r = svg.getBoundingClientRect(), x = (clientX - r.left) * (w / r.width); return Math.max(0, Math.min(n - 1, Math.round(((x - g.padL) / g.plotW) * (n - 1)))); }
    hit.addEventListener('mousemove', function(e){ var i = at(e.clientX), x = xAt(i);
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
      var rows = []; series.forEach(function(s, si){ var v = s.data[i], d = dots[si];
        if (v == null) { d.setAttribute('opacity', 0); return; } d.setAttribute('cx', x); d.setAttribute('cy', g.y(v)); d.setAttribute('opacity', 1);
        rows.push({ name: s.name, color: s.color || PALETTE[si % PALETTE.length], value: fmt(v) }); });
      showTip(t, host, x * (svg.getBoundingClientRect().width / w), (host.querySelector('.upc-legend') ? host.querySelector('.upc-legend').offsetHeight + 12 : 0) + g.y(series[0].data[i] || 0), labels[i], rows); });
    hit.addEventListener('mouseleave', function(){ t.style.opacity = 0; cross.setAttribute('opacity', 0); dots.forEach(function(d){ d.setAttribute('opacity', 0); }); });
    srTable(host, o.title, labels, series, fmt);
  }); }

  function bar(host, o){ return mount(host, o, function(host, o, w){
    var labels = o.labels, series = o.series, fmt = fmtFn(o), stacked = !!o.stacked, hl = o.highlight || [];
    var colorOf = function(s, si){ return s.color || (stacked ? STACK[si % STACK.length] : PALETTE[si % PALETTE.length]); };
    if (o.legend !== false && (series.length > 1 || hl.length)) legend(host, series.map(function(s, si){ return { name: s.name, color: colorOf(s, si) }; }).concat(hl.length && o.highlightLabel ? [{ name: o.highlightLabel, color: o.highlightColor || '#dc2626' }] : []));
    var totals = labels.map(function(_, i){ return stacked ? series.reduce(function(a, s){ return a + (s.data[i] || 0); }, 0) : Math.max.apply(null, series.map(function(s){ return s.data[i] || 0; })); });
    var max = o.max != null ? o.max : niceMax(Math.max.apply(null, totals.concat([0])) );
    var svg = el('svg', { role: 'img', 'aria-label': o.title || 'Bar chart' }, host), g = frame(svg, o, w, labels, max, fmt);
    var n = labels.length, slot = g.plotW / n, groups = stacked ? 1 : series.length;
    var bw = Math.max(4, Math.min(o.barWidth || 32, (slot * .6) / groups)), gap = groups > 1 ? 4 : 0;
    var xAt = function(i){ return g.padL + slot * i + slot / 2; };
    xLabels(svg, g, labels, xAt, o);
    var t = tip(host), offTop = function(){ var l = host.querySelector('.upc-legend'); return l ? l.offsetHeight + 12 : 0; };
    labels.forEach(function(lab, i){
      var base = g.top + g.plotH, x0 = xAt(i) - (groups * bw + (groups - 1) * gap) / 2, isHl = hl.indexOf(i) >= 0;
      series.forEach(function(s, si){
        var v = s.data[i] || 0, hgt = (v / max) * g.plotH; if (hgt <= 0) return;
        var x = stacked ? xAt(i) - bw / 2 : x0 + si * (bw + gap), y = base - hgt, r = Math.min(4, bw / 2, hgt);
        var topSeg = !stacked || si === series.length - 1 || series.slice(si + 1).every(function(z){ return !(z.data[i] > 0); });
        var c = isHl && (o.highlightColor || !stacked) ? (o.highlightColor || '#dc2626') : colorOf(s, si);
        var d = topSeg ? 'M' + x + ' ' + base + ' V' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' H' + (x + bw - r) + ' Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + r) + ' V' + base + ' Z'
                       : 'M' + x + ' ' + base + ' V' + y + ' H' + (x + bw) + ' V' + base + ' Z';
        var p = el('path', { d: d, fill: c }, svg); if (o.animate !== false) { p.classList.add('upc-grow'); p.style.animationDelay = (i * 30) + 'ms'; }
        if (stacked) base = y;
      });
      if (o.valueLabels) { var tv = el('text', { class: 'upc-axis', x: xAt(i), y: g.y(totals[i]) - 6, 'text-anchor': 'middle', 'font-weight': 500, fill: isHl ? (o.highlightColor || '#dc2626') : '#171717' }, svg); tv.textContent = fmt(totals[i]); }
      var hit = el('rect', { x: g.padL + slot * i, y: g.top, width: slot, height: g.plotH, fill: 'transparent' }, svg);
      hit.addEventListener('mouseenter', function(){ hit.setAttribute('fill', 'rgba(23,23,23,.03)');
        var sc = svg.getBoundingClientRect().width / w;
        showTip(t, host, xAt(i) * sc, offTop() + g.y(totals[i]), lab, series.map(function(s, si){ return { name: s.name, color: isHl && !stacked ? (o.highlightColor || '#dc2626') : colorOf(s, si), value: fmt(s.data[i] || 0) }; })); });
      hit.addEventListener('mouseleave', function(){ hit.setAttribute('fill', 'transparent'); t.style.opacity = 0; });
    });
    srTable(host, o.title, labels, series, fmt);
  }); }

  function donut(host, o){ return mount(host, o, function(host, o, w){
    var segs = o.segments.filter(function(s){ return s.value > 0; }), total = segs.reduce(function(a, s){ return a + s.value; }, 0) || 1, fmt = fmtFn(o);
    var size = Math.min(o.size || 200, w), wrap = h('div', '', host); wrap.style.cssText = 'display:flex;align-items:center;gap:24px;flex-wrap:wrap';
    var box = h('div', '', wrap); box.style.cssText = 'position:relative;width:' + size + 'px;height:' + size + 'px;flex-shrink:0';
    var svg = el('svg', { viewBox: '0 0 100 100', role: 'img', 'aria-label': o.title || 'Donut chart' }, box), R = 40, sw = o.thickness || 16, C = 2 * Math.PI * R, off = 0;
    el('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: '#f5f5f5', 'stroke-width': sw }, svg);
    var t = tip(host);
    segs.forEach(function(s, i){ var c = s.color || PIE[i % PIE.length], len = (s.value / total) * C;
      var a = el('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: c, 'stroke-width': sw, 'stroke-dasharray': Math.max(0, len - .6) + ' ' + C, 'stroke-dashoffset': -off, transform: 'rotate(-90 50 50)' }, svg);
      a.addEventListener('mousemove', function(e){ var r = host.getBoundingClientRect(); showTip(t, host, e.clientX - r.left, e.clientY - r.top, s.label, [{ name: Math.round(s.value / total * 100) + '%', color: c, value: fmt(s.value) }]); });
      a.addEventListener('mouseleave', function(){ t.style.opacity = 0; }); off += len; });
    if (o.center) h('div', 'upc-center', box, '<strong>' + esc(o.center.value) + '</strong>' + (o.center.label ? '<small>' + esc(o.center.label) + '</small>' : ''));
    if (o.legend !== false) { var ul = h('ul', 'upc-legend', wrap); ul.style.cssText = 'flex-direction:column;margin:0';
      segs.forEach(function(s, i){ h('li', '', ul, '<i style="background:' + (s.color || PIE[i % PIE.length]) + '"></i>' + esc(s.label) + ' <span style="color:#171717;font-weight:500;margin-left:4px">' + esc(fmt(s.value)) + '</span>'); }); }
    srTable(host, o.title, segs.map(function(s){ return s.label; }), [{ name: 'Value', data: segs.map(function(s){ return s.value; }) }], fmt);
  }); }

  function progress(host, o){ return mount(host, o, function(host, o, w){
    var size = Math.min(o.size || 160, w), v = Math.max(0, Math.min(100, o.value)), sw = o.thickness || 12, R = 50 - sw / 2 - 1, C = 2 * Math.PI * R;
    var box = h('div', '', host); box.style.cssText = 'position:relative;width:' + size + 'px;height:' + size + 'px;margin:0 auto';
    var svg = el('svg', { viewBox: '0 0 100 100', role: 'img', 'aria-label': (o.title || 'Progress') + ': ' + v + '%' }, box);
    el('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: '#f5f5f5', 'stroke-width': sw }, svg);
    el('circle', { cx: 50, cy: 50, r: R, fill: 'none', stroke: o.color || '#4f46e5', 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-dasharray': (v / 100 * C) + ' ' + C, transform: 'rotate(-90 50 50)' }, svg);
    h('div', 'upc-center', box, '<strong>' + esc(o.text != null ? o.text : v + '%') + '</strong>' + (o.label ? '<small>' + esc(o.label) + '</small>' : ''));
  }); }

  window.UpChart = { line: line, bar: bar, donut: donut, progress: progress, PALETTE: PALETTE };
})();
</script>
<script>
  window.addEventListener('message', function(e){
    if (e.data === 'toggle-sidebar') document.querySelector('.shell').classList.toggle('sidebar-collapsed');
  });

  // Mirrors concept-mastery.html's CONCEPTS, extended with drill-down data.
  // Concepts with only 1 supporting question intentionally render as
  // "Insufficient data" below rather than a fabricated mastery read.
  const CONCEPT_DETAILS = {
    "binary-search-trees": {
      name:"Binary Search Trees", course:"CS-301: Advanced Data Structures", accuracy:91, questionCount:42,
      relatedAssessments:["Midterm Exam — Data Structures", "Quiz 3: Trees & Graphs"],
      learnerPerformance:[
        { id:"LNR-002", name:"Sophia Chen", accuracy:95 },
        { id:"LNR-001", name:"Marcus Vance", accuracy:92 },
        { id:"LNR-003", name:"David O'Connor", accuracy:84 },
      ],
    },
    "graph-traversal-algorithms": {
      name:"Graph Traversal Algorithms", course:"CS-301: Advanced Data Structures", accuracy:44, questionCount:38,
      relatedAssessments:["Midterm Exam — Data Structures"],
      learnerPerformance:[
        { id:"LNR-004", name:"Elena Rostova", accuracy:22 },
        { id:"LNR-005", name:"James Wilson", accuracy:38 },
        { id:"LNR-003", name:"David O'Connor", accuracy:55 },
      ],
      improvement:{ before:31, after:58 },
    },
    "dynamic-programming": {
      name:"Dynamic Programming", course:"CS-301: Advanced Data Structures", accuracy:62, questionCount:51,
      relatedAssessments:["Assignment 2: Binary Heap", "Quiz 1: Dynamic Programming"],
      learnerPerformance:[
        { id:"LNR-001", name:"Marcus Vance", accuracy:89 },
        { id:"LNR-003", name:"David O'Connor", accuracy:60 },
        { id:"LNR-005", name:"James Wilson", accuracy:48 },
      ],
    },
    "recursion-fundamentals": {
      name:"Recursion Fundamentals", course:"CS-301: Advanced Data Structures", accuracy:88, questionCount:29,
      relatedAssessments:["Assignment 2: Binary Heap"],
      learnerPerformance:[
        { id:"LNR-002", name:"Sophia Chen", accuracy:94 },
        { id:"LNR-001", name:"Marcus Vance", accuracy:85 },
      ],
    },
    "react-component-lifecycle": {
      name:"React Component Lifecycle", course:"WEB-202: Modern Frontend Frameworks", accuracy:35, questionCount:24,
      relatedAssessments:["WEB-202 Practical: Component Design"],
      learnerPerformance:[
        { id:"LNR-001", name:"Marcus Vance", accuracy:40 },
        { id:"LNR-007", name:"Lucas Miller", accuracy:28 },
      ],
    },
    "css-flexbox-grid": {
      name:"CSS Flexbox & Grid", course:"WEB-202: Modern Frontend Frameworks", accuracy:73, questionCount:19,
      relatedAssessments:["WEB-202 Practical: Component Design"],
      learnerPerformance:[
        { id:"LNR-001", name:"Marcus Vance", accuracy:78 },
        { id:"LNR-007", name:"Lucas Miller", accuracy:65 },
      ],
    },
    "usability-heuristics": {
      name:"Usability Heuristics", course:"UX-204: Interaction Design", accuracy:100, questionCount:1,
      relatedAssessments:["UX-204 Quiz: Heuristic Evaluation"],
      learnerPerformance:[],
    },
    "neural-network-basics": {
      name:"Neural Network Basics", course:"AI-101: Intro to Machine Learning", accuracy:58, questionCount:16,
      relatedAssessments:["AI-101 Quiz: Neural Fundamentals"],
      learnerPerformance:[
        { id:"LNR-002", name:"Sophia Chen", accuracy:70 },
        { id:"LNR-005", name:"James Wilson", accuracy:46 },
      ],
    },
  };

  function masteryBand(accuracy) {
    if (accuracy >= 80) return 'mastered';
    if (accuracy >= 50) return 'developing';
    return 'struggling';
  }

  function getQueryParam(p) { return new URLSearchParams(window.location.search).get(p); }

  function render() {
    const root = document.getElementById('detailRoot');
    const conceptId = getQueryParam('concept');
    const c = CONCEPT_DETAILS[conceptId];

    if (!c) {
      root.innerHTML = `
        <div class="not-found-card">
          <div class="insufficient-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <div class="insufficient-title">Concept not found</div>
          <div class="insufficient-desc">This concept doesn't exist or isn't within your assigned scope.</div>
        </div>`;
      return;
    }

    const band = masteryBand(c.accuracy);
    const lowConfidence = c.questionCount <= 1;

    const assessmentsHtml = c.relatedAssessments.map(name => `
      <a href="assessments-overview.html" class="assessment-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
        ${name}
      </a>`).join('');

    let learnerTableHtml = `<div class="card-body" style="color:var(--text-tertiary); font-size:14px;">No individual learner performance recorded yet for this concept.</div>`;
    if (c.learnerPerformance.length) {
      learnerTableHtml = `
        <table>
          <thead><tr><th>Learner</th><th>Accuracy</th><th>Level</th></tr></thead>
          <tbody>
            ${c.learnerPerformance.map(l => {
              const lBand = masteryBand(l.accuracy);
              return `
                <tr onclick="location.href='learner-report.html?id=${l.id}'">
                  <td class="learner-name-cell">${l.name}</td>
                  <td style="font-weight:700; font-variant-numeric:tabular-nums;">${l.accuracy}%</td>
                  <td><span class="perf-badge ${lBand}">${lBand.charAt(0).toUpperCase() + lBand.slice(1)}</span></td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    const improvementHtml = c.improvement ? `
      <div class="improvement-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span>Improvement after retake: <b>${c.improvement.before}% &rarr; ${c.improvement.after}%</b> across learners who attempted this concept twice.</span>
      </div>
      <!-- RPT-004-FR-07: before/after comparison after retakes (same numbers as the box above) -->
      <div class="card">
        <div class="card-head"><h3 class="card-title">Accuracy before vs. after retake</h3></div>
        <div class="card-body"><div id="retakeChart"></div></div>
      </div>` : '';

    root.innerHTML = `
      <div class="detail-head">
        <div>
          <h1>${c.name}</h1>
          <div class="course-tag">${c.course}</div>
        </div>
        <span class="mastery-badge ${band}"><i></i>${band.charAt(0).toUpperCase() + band.slice(1)}</span>
      </div>

      ${lowConfidence ? `
        <div class="insufficient-card" style="margin-top:20px;">
          <div class="insufficient-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <div class="insufficient-title">Insufficient data</div>
          <div class="insufficient-desc">This concept is tagged to only ${c.questionCount} question across your assessments. A single question can't reliably represent mastery — add more tagged questions for this concept before drawing conclusions from it.</div>
          <div style="margin-top:20px;">${assessmentsHtml}</div>
        </div>
      ` : `
        <div class="metrics-row">
          <div class="metric-block">
            <span class="metric-lbl">Current Mastery</span>
            <span class="metric-val">${c.accuracy}%</span>
            <span class="metric-sub">${band.charAt(0).toUpperCase() + band.slice(1)}</span>
          </div>
          <div class="metric-block">
            <span class="metric-lbl">Accuracy</span>
            <span class="metric-val">${c.accuracy}%</span>
            <span class="metric-sub">Across all tagged attempts</span>
          </div>
          <div class="metric-block">
            <span class="metric-lbl">Supporting Questions</span>
            <span class="metric-val">${c.questionCount}</span>
            <span class="metric-sub">Tagged to this concept</span>
          </div>
        </div>

        ${improvementHtml}

        <div class="card">
          <div class="card-head"><h3 class="card-title">Related Assessment(s)</h3></div>
          <div class="card-body">${assessmentsHtml}</div>
        </div>

        <div class="card">
          <div class="card-head"><h3 class="card-title">Learner Performance</h3></div>
          ${learnerTableHtml}
        </div>
      `}
    `;

    if (c.improvement && !lowConfidence) UpChart.bar('#retakeChart', {
      title: 'Accuracy before vs. after retake',
      labels: ['Before retake', 'After retake'],
      series: [{ name: 'Accuracy', data: [c.improvement.before, c.improvement.after] }],
      unit: '%', max: 100, valueLabels: true, barWidth: 48, height: 200,
    });
  }

  render();
</script>
