<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Course Designer — Review AI course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Course Designer — Review an AI-generated course (AI course builder flow,
     FigJam "LMS UI" node 7:1906, steps after "Generate Course"):
       "Does the user want to continue with the generated course?" NO →
       user goes to any module / chapter → uses AI (prompts the changes) or
       makes the changes by hand → satisfied? → Save as draft, or
       Publish / Send for approval.
     Layout ref: mood board node 48:901 (outline left, lesson centre,
     AI editor right).
     Entry: ai-course-generate.html "Make changes" / ready toast → ?id=<course>.
     AI edits: scope = whole course, a module, or a lesson. Quick prompts
     follow AI-001-FR-05 ("Make shorter", "Add more examples", "Focus on…").
     Every AI change is a proposal the author Applies or Discards
     (AI-001-FR-04), with Undo after applying. AI-generated marks stay
     visible to the author and approvers (AI-001-FR-06).
     By hand: "Edit manually" opens the same lesson in course-builder.html.
     No AI service exists in this repo: proposals are local stand-ins (see
     ponytail comments). Replace with the API.
     Library: Buttons, Badge, Select, Message, Textarea, Modal, Toast,
     Alerts, Video player (native controls), Tooltip.
     Approved hand-built: Chat composer, Course structure tree, Lesson list
     item, Flashcard (two-sided flip card), Callout / Quote / Image figure /
     Audio / Document / Assessment summary block renders.
     New (approved 2026-11-02): AI change proposal card.
     Demo states: Preview control or ?state=blocked | noapproval.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-strong:#404040; --text-secondary:#525252; --text-tertiary:#a3a3a3; --text-disabled:#d4d4d4;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f5f5f5; --border-strong:#a3a3a3;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --action-primary-subtle:#eef2ff; --action-primary-soft:#e0e7ff; --focus-ring:#6366f1;
    --error:#dc2626; --error-subtle:#fef2f2; --error-border:#fecaca;
    --warning:#ca8a04; --warning-subtle:#fefce8; --warning-border:#fef08a;
    --success:#15803d; --success-subtle:#f0fdf4;
    --info:#2563eb; --info-subtle:#eff6ff; --info-border:#bfdbfe;
    --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-xl:12px; --radius-2xl:16px; --radius-full:999px;
    --shadow-md:0 12px 16px -4px rgba(23,23,23,.08), 0 4px 6px -2px rgba(23,23,23,.03);
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,input,select,textarea{ font-family:var(--font); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  [hidden]{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; min-width:0; min-height:0; display:flex; flex-direction:column; }

  /* Buttons (library) */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:var(--radius-lg); font-size:14px; font-weight:500; border:1px solid transparent; white-space:nowrap; transition:background-color .15s ease, border-color .15s ease; }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .btn-primary{ background:var(--action-primary); color:#fff; }
  .btn-primary:hover{ background:var(--action-primary-hover); }
  .btn-primary:disabled{ opacity:.45; cursor:default; background:var(--action-primary); }
  .btn-secondary{ background:#fff; color:var(--text-strong); border-color:#d4d4d4; }
  .btn-secondary:hover{ background:var(--surface-raised); }
  .btn-secondary:disabled{ color:var(--text-tertiary); cursor:default; background:#fff; }
  .btn.sm{ height:32px; padding:0 12px; }
  .ib{ width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:var(--radius-md); background:transparent; color:var(--text-tertiary); flex-shrink:0; }
  .ib:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .ib svg{ width:16px; height:16px; }

  /* Badge (library) */
  .badge{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:var(--radius-full); font-size:12px; font-weight:500; white-space:nowrap; }
  .badge i{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge svg{ width:12px; height:12px; }
  .badge.sm{ height:20px; padding:0 7px; }
  .badge.gray{ background:var(--surface-raised); color:var(--text-secondary); }
  .badge.brand{ background:var(--action-primary-subtle); color:var(--action-primary); }
  .badge.warning{ background:var(--warning-subtle); color:#a16207; }
  .badge.success{ background:var(--success-subtle); color:var(--success); }

  /* Alerts (library) */
  .alert{ display:flex; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); border:1px solid var(--border-default); background:#fff; font-size:14px; line-height:1.5; color:var(--text-strong); }
  .alert svg{ width:18px; height:18px; flex-shrink:0; margin-top:2px; }
  .alert b{ display:block; color:var(--text-primary); }
  .alert.warning{ background:var(--warning-subtle); border-color:var(--warning-border); } .alert.warning svg{ color:var(--warning); }
  .alert.info{ background:var(--info-subtle); border-color:var(--info-border); } .alert.info svg{ color:var(--info); }

  .ai-mark{ width:24px; height:24px; border-radius:var(--radius-md); background:linear-gradient(135deg, #6366f1, #4338ca); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ai-mark svg{ width:13px; height:13px; }

  /* Bar (same pattern as course-builder.html .bar) */
  .bar{ display:flex; align-items:center; gap:12px; padding:10px clamp(14px, 1.8vw, 24px); background:#fff; border-bottom:1px solid var(--border-default); flex-wrap:wrap; }
  .bar-title{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .bar-title h1{ margin:0; font-size:18px; font-weight:700; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .bar-acts{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .rv{ flex:1; min-height:0; display:grid; grid-template-columns:clamp(240px, 19vw, 300px) minmax(0,1fr) clamp(320px, 26vw, 400px); }

  /* Course structure tree / Lesson list item (hand-built, approved) */
  .nav{ min-height:0; overflow-y:auto; background:#fff; border-right:1px solid var(--border-default); padding:14px 10px 24px; }
  .nav-h{ padding:2px 8px 12px; }
  .nav-h b{ display:block; font-size:14px; }
  .nav-h small{ font-size:12px; color:var(--text-tertiary); }
  .nmod + .nmod{ margin-top:8px; }
  .nmod-h{ width:100%; display:flex; align-items:center; gap:8px; padding:8px; border:0; border-radius:var(--radius-lg); background:transparent; text-align:left; font-size:14px; font-weight:600; color:var(--text-primary); }
  .nmod-h:hover{ background:var(--surface-raised); }
  .nmod-h .num{ width:22px; height:22px; border-radius:var(--radius-md); background:var(--surface-raised); font-size:12px; font-weight:700; color:var(--text-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nmod-h span:last-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nmod.scoped > .nmod-h{ box-shadow:inset 0 0 0 1.5px var(--action-primary-soft); }
  .nles{ list-style:none; margin:2px 0 0; padding:0 0 0 18px; }
  .nles button{ width:100%; display:flex; align-items:center; gap:8px; min-height:36px; padding:6px 8px; border:0; border-radius:var(--radius-md); background:transparent; text-align:left; font-size:14px; color:var(--text-secondary); }
  .nles button:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .nles button[aria-current="true"]{ background:var(--action-primary-subtle); color:var(--action-primary); font-weight:600; }
  .nles button > span:first-child{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .changed{ width:7px; height:7px; border-radius:50%; background:var(--action-primary); flex-shrink:0; }

  /* Lesson */
  .lesson{ min-height:0; overflow-y:auto; }
  .lesson-in{ max-width:780px; margin:0 auto; padding:24px clamp(16px, 3vw, 44px) 56px; }
  .crumb{ font-size:12px; color:var(--text-tertiary); font-weight:500; }
  .lesson-in h2{ margin:4px 0 8px; font-size:clamp(22px, 2vw, 28px); font-weight:700; letter-spacing:-.5px; }
  .lmeta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text-tertiary); }
  .lacts{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 22px; padding-bottom:18px; border-bottom:1px solid var(--border-default); }
  .lesson .alert{ margin-bottom:16px; }

  .blk{ position:relative; padding:12px 14px; margin:0 -14px 10px; border-radius:var(--radius-lg); transition:background-color .3s ease, box-shadow .3s ease; }
  .blk:hover{ background:#fff; box-shadow:0 0 0 1px var(--border-default); }
  .blk.flash{ animation:flashb 1.6s ease; }
  @keyframes flashb{ 0%{ background:var(--action-primary-soft); } 100%{ background:transparent; } }
  .blk-tag{ position:absolute; top:8px; right:8px; opacity:0; transition:opacity .15s ease; z-index:1; }
  .blk:hover .blk-tag, .blk:focus-within .blk-tag{ opacity:1; }
  .prose{ font-size:16px; line-height:1.7; color:var(--text-primary); }
  .prose p{ margin:0 0 12px; } .prose p:last-child{ margin-bottom:0; }
  .prose ul, .prose ol{ margin:0 0 12px; padding-left:22px; } .prose li{ margin-bottom:4px; }
  .prose h3{ margin:8px 0 6px; font-size:18px; }
  .callout{ padding:12px 16px; border-radius:var(--radius-lg); background:var(--info-subtle); border:1px solid var(--info-border); }
  .callout b{ display:block; margin-bottom:2px; }
  .quote{ padding:12px 16px; border-left:3px solid var(--action-primary-soft); background:#fff; border-radius:0 var(--radius-lg) var(--radius-lg) 0; }
  .quote small{ display:block; font-size:12px; font-weight:600; color:var(--action-primary); margin-bottom:4px; }
  figure{ margin:0; }
  figure img, figure video{ display:block; width:100%; max-height:420px; object-fit:cover; border-radius:var(--radius-lg); background:var(--surface-raised); }
  figcaption{ margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .media-ph{ display:flex; align-items:center; justify-content:center; gap:8px; height:200px; border-radius:var(--radius-lg); background:var(--surface-raised); color:var(--text-tertiary); font-size:14px; }
  .media-ph svg{ width:20px; height:20px; }
  .aud{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:#fff; }
  .aud b{ font-size:14px; }
  .aud audio{ width:100%; }
  .card{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:#fff; }
  .card .ic{ width:36px; height:36px; border-radius:var(--radius-md); background:var(--action-primary-subtle); color:var(--action-primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .card .ic svg{ width:18px; height:18px; }
  .card div{ flex:1; min-width:0; }
  .card b{ display:block; font-size:14px; }
  .card small{ font-size:12px; color:var(--text-tertiary); }
  .card.empty{ border-style:dashed; background:var(--warning-subtle); border-color:var(--warning-border); }
  .card.empty .ic{ background:#fff; color:var(--warning); }
  /* Flashcard (approved hand-built) */
  .fc-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:10px; margin-top:8px; }
  .fc{ perspective:800px; height:132px; border:0; padding:0; background:none; text-align:left; font:inherit; color:inherit; }
  .fc-in{ position:relative; display:block; width:100%; height:100%; transition:transform .45s ease; transform-style:preserve-3d; }
  .fc.flipped .fc-in{ transform:rotateY(180deg); }
  .fc-f, .fc-b{ position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:#fff; font-size:14px; line-height:1.45; }
  .fc-b{ transform:rotateY(180deg); background:var(--action-primary-subtle); border-color:var(--action-primary-soft); }
  .fc small{ font-size:12px; color:var(--text-tertiary); }

  /* AI editor (Aside) */
  .ed{ min-height:0; display:flex; flex-direction:column; background:#fff; border-left:1px solid var(--border-default); }
  .ed-h{ padding:14px 16px 12px; border-bottom:1px solid var(--border-subtle); }
  .ed-h > div{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ed-h b{ font-size:14px; }
  .ed-h label{ display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:4px; }
  .ed-h select{ width:100%; height:38px; padding:0 12px; border:1px solid #d4d4d4; border-radius:var(--radius-lg); background:#fff; font-size:14px; color:var(--text-primary); }
  .thread{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding:16px; }
  .empty-ed{ margin:auto 0; text-align:center; padding:12px; color:var(--text-secondary); font-size:14px; line-height:1.55; }
  .empty-ed .ai-mark{ margin:0 auto 10px; width:32px; height:32px; border-radius:var(--radius-lg); }
  .empty-ed .ai-mark svg{ width:16px; height:16px; }
  .empty-ed b{ display:block; color:var(--text-primary); font-size:16px; margin-bottom:2px; }
  /* Message (library) */
  .you{ align-self:flex-end; max-width:88%; padding:9px 13px; background:var(--action-primary-soft); border-radius:var(--radius-lg) 0 var(--radius-lg) var(--radius-lg); font-size:14px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; animation:rise .25s ease both; }
  .you small{ display:block; font-size:12px; color:var(--text-secondary); font-weight:600; margin-bottom:2px; }
  .ai{ display:grid; grid-template-columns:24px minmax(0,1fr); gap:10px; animation:rise .25s ease both; }
  .ai-body{ min-width:0; padding-top:2px; font-size:14px; line-height:1.6; }
  .ai-body > p{ margin:0 0 8px; } .ai-body > :last-child{ margin-bottom:0; }
  .writing{ display:inline-flex; gap:4px; padding:10px 12px; background:var(--surface-raised); border-radius:0 var(--radius-lg) var(--radius-lg) var(--radius-lg); }
  .writing i{ width:6px; height:6px; border-radius:50%; background:var(--text-tertiary); animation:blink 1.2s infinite ease-in-out; }
  .writing i:nth-child(2){ animation-delay:.15s; } .writing i:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%, 80%, 100%{ opacity:.3; } 40%{ opacity:1; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* AI change proposal card (new, approved 2026-11-02) */
  .prop{ border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; overflow:hidden; }
  .prop-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--border-subtle); font-size:12px; color:var(--text-secondary); }
  .prop ul{ list-style:none; margin:0; padding:10px 12px; display:grid; gap:6px; font-size:14px; line-height:1.45; }
  .prop li{ display:flex; gap:8px; }
  .prop li svg{ width:14px; height:14px; flex-shrink:0; margin-top:3px; color:var(--action-primary); }
  .prop li span{ min-width:0; }
  .prop li small{ color:var(--text-tertiary); }
  .diff{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--border-subtle); }
  .diff div{ padding:10px 12px; font-size:12px; line-height:1.5; color:var(--text-strong); max-height:150px; overflow:hidden; }
  .diff div + div{ border-left:1px solid var(--border-subtle); background:var(--success-subtle); }
  .diff div:first-child{ background:var(--surface-canvas); color:var(--text-secondary); }
  .diff b{ display:block; font-size:12px; font-weight:600; color:var(--text-tertiary); margin-bottom:2px; }
  .prop-foot{ display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 12px; border-top:1px solid var(--border-subtle); background:var(--surface-canvas); }
  .prop-foot .st{ margin-right:auto; display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-secondary); }
  .prop-foot .st svg{ width:14px; height:14px; }
  .prop.applied .prop-foot .st{ color:var(--success); }
  .prop.done ul, .prop.done .diff{ opacity:.6; }

  .quick{ display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0; border-top:1px solid var(--border-subtle); }
  .quick button{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-full); background:#fff; font-size:12px; font-weight:500; color:var(--text-strong); }
  .quick button:hover{ border-color:var(--action-primary-soft); background:var(--action-primary-subtle); color:var(--action-primary); }
  .quick button:disabled{ opacity:.5; cursor:default; }
  .quick svg{ width:13px; height:13px; }
  .dock{ padding:10px 14px 14px; }
  /* Chat composer (hand-built, approved) */
  .composer-box{ display:flex; align-items:flex-end; gap:8px; padding:6px 6px 6px 14px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; transition:border-color .15s ease, box-shadow .15s ease; }
  .composer-box:focus-within{ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .composer textarea{ flex:1; border:0; outline:none; resize:none; font-size:14px; line-height:1.5; padding:8px 0; max-height:140px; color:var(--text-primary); background:transparent; }
  .composer textarea::placeholder{ color:var(--text-tertiary); }
  .send{ width:34px; height:34px; border:0; border-radius:var(--radius-lg); background:var(--action-primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send:hover{ background:var(--action-primary-hover); }
  .send:disabled{ opacity:.35; cursor:default; }
  .send svg{ width:16px; height:16px; }
  .composer small{ display:block; margin-top:6px; font-size:12px; color:var(--text-tertiary); text-align:center; }

  /* Modal (library) */
  .overlay{ position:fixed; inset:0; background:rgba(23,23,23,.32); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:var(--radius-xl); width:480px; max-width:100%; max-height:calc(100vh - 40px); overflow-y:auto; box-shadow:0 24px 64px -12px rgba(23,23,23,.28); padding:24px; }
  .modal h3{ margin:0; font-size:18px; font-weight:700; }
  .modal > p{ margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--text-secondary); }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }

  /* Toast (library) */
  .toast{ position:fixed; bottom:24px; right:24px; background:#171717; color:#fff; padding:10px 12px 10px 16px; border-radius:var(--radius-lg); font-size:14px; font-weight:500; box-shadow:0 12px 32px -8px rgba(23,23,23,.4); display:flex; align-items:center; gap:12px; transform:translateY(12px); opacity:0; pointer-events:none; transition:transform .2s ease, opacity .2s ease; z-index:60; max-width:calc(100vw - 48px); }
  .toast.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .toast button{ height:28px; padding:0 10px; border:0; border-radius:var(--radius-md); background:rgba(255,255,255,.14); color:#fff; font-size:14px; font-weight:500; flex-shrink:0; }
  .toast button:hover{ background:rgba(255,255,255,.24); }

  .preview{ position:fixed; left:12px; bottom:12px; z-index:45; display:flex; align-items:center; gap:6px; padding:4px 4px 4px 10px; border:1px dashed #a3a3a3; border-radius:var(--radius-md); background:rgba(250,250,250,.92); font:500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color:#737373; }
  @media (min-width:901px){ .preview{ left:244px; } }
  .preview select{ font:inherit; color:#404040; border:1px solid #d4d4d4; border-radius:var(--radius-lg, 8px); background:#fff; padding:3px 4px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
  @media (max-width:1200px){
    .rv{ grid-template-columns:minmax(0,1fr) clamp(300px, 34vw, 380px); }
    .nav{ display:none; }
  }
  @media (max-width:900px){
    .main{ overflow-y:auto; display:block; }
    .rv{ display:block; }
    .lesson{ overflow:visible; }
    .ed{ border-left:0; border-top:1px solid var(--border-default); min-height:520px; }
    .diff{ grid-template-columns:1fr; } .diff div + div{ border-left:0; border-top:1px solid var(--border-subtle); }
  }

  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:25; }
  @media (max-width:900px){
    .shell{ grid-template-columns:0 1fr; }
    .topbar-frame{ grid-column:1/-1; }
    .main{ grid-column:1/-1; }
    .sidebar-frame{ position:fixed; top:0; left:0; width:260px; height:100vh; z-index:30; transform:translateX(-100%); transition:transform .25s ease; box-shadow:4px 0 24px rgba(0,0,0,.12); }
    .shell.sidebar-collapsed .sidebar-frame{ transform:translateX(0); }
    .shell.sidebar-collapsed .sidebar-backdrop{ display:block; }
  }
  /* responsive: cap content on large screens (left-aligned in a centred 1440 column; !important beats per-section margins) */
  @media (min-width:1600px){ main > * { max-width:1440px !important; margin-left:max(0px, (100% - 1440px) / 2) !important; margin-right:0 !important; } }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" onclick="document.querySelector('.shell').classList.remove('sidebar-collapsed')"></div>
  <iframe class="sidebar-frame" src="../component/sidebar.html?active=courses" title="Course Designer navigation"></iframe>
  <iframe class="topbar-frame" src="../component/topnavbar.html?parent=My+Courses&amp;parentHref=../code/my-courses.html&amp;current=Review+AI+course" title="Top bar"></iframe>

  <main class="main">
    <div class="bar">
      <a class="ib" href="my-courses.html" aria-label="Back to My Courses" data-i="back"></a>
      <div class="bar-title"><h1 id="cTitle">Course</h1><span class="badge gray" id="cStatus"><i></i>Draft</span><span class="badge brand" id="cAi" hidden><span data-i="spark"></span>AI-generated</span></div>
      <div class="bar-acts">
        <a class="btn btn-secondary" id="previewLink" href="#"><span data-i="eye"></span>Preview</a>
        <button class="btn btn-secondary" type="button" id="draftBtn"><span data-i="save"></span>Save as draft</button>
        <button class="btn btn-primary" type="button" id="submitBtn"><span data-i="send"></span><span id="submitLabel">Send for approval</span></button>
      </div>
    </div>
    <div class="rv">
      <nav class="nav" aria-label="Course outline"><div class="nav-h"><b>Course outline</b><small id="navMeta"></small></div><div id="tree"></div></nav>
      <section class="lesson" aria-live="polite"><div class="lesson-in" id="lesson"></div></section>
      <aside class="ed" aria-label="AI editor">
        <div class="ed-h">
          <div><span class="ai-mark" data-i="spark"></span><b>AI editor</b></div>
          <label for="scope">What should AI change?</label>
          <select id="scope"></select>
        </div>
        <div class="thread" id="thread">
          <div class="empty-ed" id="edEmpty"><span class="ai-mark" data-i="spark"></span><b>Change it with AI</b>Pick a quick action or describe the change. You’ll see what changes before anything is applied.</div>
        </div>
        <div class="quick" id="quick" aria-label="Quick actions">
          <button type="button" data-q="Make it shorter"><span data-i="minus"></span>Make it shorter</button>
          <button type="button" data-q="Add more examples"><span data-i="plus"></span>Add more examples</button>
          <button type="button" data-q="Simplify the language"><span data-i="text"></span>Simplify the language</button>
          <button type="button" data-q="Add a quiz"><span data-i="quiz"></span>Add a quiz</button>
          <button type="button" data-q="Add flash cards"><span data-i="flashcards"></span>Add flash cards</button>
          <button type="button" data-q="Regenerate"><span data-i="refresh"></span>Regenerate</button>
        </div>
        <div class="dock">
          <form class="composer" id="chatForm">
            <div class="composer-box">
              <label for="chatInput" class="sr">Describe the change</label>
              <textarea id="chatInput" rows="1" maxlength="2000" placeholder="e.g. Focus more on data security"></textarea>
              <button class="send" id="chatSend" type="submit" aria-label="Send" disabled><span data-i="up"></span></button>
            </div>
            <small>AI can make mistakes. Check changes before you apply them.</small>
          </form>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button type="button" id="toastAct" hidden></button></div>

<label class="preview" title="Design-only: preview other states. Not shown to users.">Preview
  <select id="previewState">
    <option value="normal">Normal</option>
    <option value="blocked">Policy block</option>
    <option value="noapproval">No approval</option>
  </select>
</label>

<script>
  window.addEventListener('message', function(e){
    if (e.data === 'toggle-sidebar') document.querySelector('.shell').classList.toggle('sidebar-collapsed');
  });

  /* ---------------- Store (same key + seed as my-courses.html) ---------------- */
  var KEY = 'upspace.cd.courses.v1', ME = 'Maya Reed';
  var H = 3600e3, D = 24 * H;
  function ago(ms){ return new Date(Date.now() - ms).toISOString(); }
  function uid(p){ return p + Math.random().toString(36).slice(2, 9); }
  function L(title, html, ai){ return { id:uid('l'), title:title, content:html || '', ai:!!ai, edited:false }; }
  function M(title, lessons){ return { id:uid('m'), title:title, lessons:lessons }; }
  function P(t){ return '<p>' + t + '</p>'; }
  function SEED(){
    return [
      { id:'c-sales', title:'Sales Fundamentals', category:'Sales', description:'Core selling skills for new account executives.', status:'draft', rel:'assigned', owner:'Daniel Kim', updated:ago(2 * H), created:ago(3 * D), modules:[] },
      { id:'c-onboard', title:'Customer Onboarding Playbook', category:'Customer Success', description:'Run a smooth first 90 days for new customers.', status:'draft', rel:'owned', owner:ME, updated:ago(26 * H), created:ago(9 * D), modules:[
        M('Kickoff', [ L('Why onboarding matters', P('Customers decide in their first weeks whether a product is worth the effort. A structured onboarding reduces early churn.'), true), L('Running the kickoff call', P('Set goals, confirm stakeholders and agree on a success plan before the call ends.'), true) ]),
        M('First 30 days', [ L('Building the success plan', P('Translate the customer’s goals into three measurable milestones.')), L('Weekly check-ins', '') ]),
        M('Handover', [ L('Handing over to account management', '') ]) ] },
      { id:'c-privacy', title:'Data Privacy Essentials', category:'Compliance', description:'GDPR basics every employee needs to know.', status:'review', rel:'owned', owner:ME, approval:{ step:2, of:3, approver:'Priya Shah' }, updated:ago(3 * D), created:ago(20 * D), modules:[ M('Foundations', [ L('What counts as personal data', P('Any information that identifies a person directly or indirectly.')) ]) ] },
      { id:'c-lead', title:'Leadership Communication', category:'Leadership', description:'Give feedback and run 1:1s that build trust.', status:'changes', rel:'owned', owner:ME, feedback:'Module 2 needs a practical example.', updated:ago(5 * D), created:ago(30 * D), modules:[ M('Feedback', [ L('The SBI model', P('Situation, Behavior, Impact: a simple structure for specific feedback.')) ]) ] },
      { id:'c-atlas', title:'Product Knowledge: Atlas Platform', category:'Product', description:'Everything customer-facing teams need to know about Atlas.', status:'published', rel:'owned', owner:ME, updated:ago(14 * D), created:ago(60 * D), modules:[ M('Overview', [ L('What Atlas does', P('Atlas centralises reporting for operations teams.')) ]) ] },
      { id:'c-safety', title:'Workplace Safety Refresher', category:'Safety', description:'Annual refresher on hazards, reporting and first aid.', status:'published', rel:'assigned', owner:'Daniel Kim', updated:ago(32 * D), created:ago(90 * D), modules:[ M('Hazards', [ L('Spotting hazards', P('Walk the space with fresh eyes once a month.')) ]) ] },
      { id:'c-negotiate', title:'Negotiation Skills', category:'Sales', description:'Prepare, anchor and close with confidence.', status:'approved', rel:'delegated-to', owner:'Aisha Rahman', permission:'Edit + Submit', updated:ago(6 * D), created:ago(40 * D), modules:[ M('Preparation', [ L('Know your BATNA', P('Your best alternative sets your walk-away point.')) ]) ] },
      { id:'c-finance', title:'Intro to Financial Planning', category:'Finance', description:'Budgets, forecasts and reading a P&L.', status:'draft', rel:'delegated-by', owner:ME, delegate:'Tom Becker', permission:'Edit', delegateActive:ago(20 * H), updated:ago(4 * D), created:ago(15 * D), modules:[ M('Budgets', [ L('Building a simple budget', '') ]) ] },
      { id:'c-managers', title:'Onboarding for New Managers', category:'Management', description:'The first 100 days as a people manager.', status:'review', rel:'assigned', owner:'Daniel Kim', approval:{ step:1, of:2, approver:'Maria Lopez' }, updated:ago(2 * D), created:ago(25 * D), modules:[ M('Getting started', [ L('Your first week', P('Meet every direct report one-on-one.')) ]) ] },
      { id:'c-excel', title:'Legacy Excel Training', category:'Productivity', description:'Replaced by the Sheets course in 2026.', status:'archived', rel:'owned', owner:ME, updated:ago(240 * D), created:ago(400 * D), modules:[] }
    ];
  }
  var MEM = null;
  function load(){
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) return s; } catch (e) {}
    if (MEM) return MEM;
    var seed = SEED(); save(seed); return seed;
  }
  function save(list){ MEM = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]; }); }
  function readJSON(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function writeJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
  function textOf(html){ var d = document.createElement('div'); d.innerHTML = (html || '').replace(/<\/(p|li|h[1-6])>/gi, ' </$1>'); return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
  function words(html){ var t = textOf(html); return t ? t.split(/\s+/).length : 0; }

  var IC = {
    spark:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
    back:'<path d="m15 18-6-6 6-6"/>', up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
    x:'<path d="M18 6 6 18M6 6l12 12"/>', check:'<path d="M20 6 9 17l-5-5"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
    eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    save:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/>',
    send:'<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
    minus:'<path d="M5 12h14"/>', plus:'<path d="M5 12h14M12 5v14"/>',
    text:'<path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/>',
    quiz:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/>',
    flashcards:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    doc:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8M16 13H8M16 17H8"/>',
    slides:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
    image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    video:'<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
    library:'<rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/>',
    undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'
  };
  function sv(k, w){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[k] + '</svg>'; }
  document.querySelectorAll('[data-i]').forEach(function(el){ el.innerHTML = sv(el.dataset.i); el.removeAttribute('data-i'); });

  var toastT;
  function toast(msg, act, fn){
    $('toastText').textContent = msg;
    var b = $('toastAct'); b.hidden = !act; b.textContent = act || ''; b.onclick = function(){ $('toast').classList.remove('show'); fn && fn(); };
    $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('show'); }, act ? 7000 : 3500);
  }

  /* Shared stores (course-builder.html). ponytail: library fallback mirrors course-builder LIB_SEED ids + urls
     so media renders before the builder has seeded the real store. */
  var LIB = readJSON('upspace.cd.library.v1') || [
    { id:'a-vid-flower', name:'Flower timelapse.mp4', kind:'video', url:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4' },
    { id:'a-aud-sample', name:'Sound sample.mp3', kind:'audio', url:'https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3' },
    { id:'a-img-team', name:'Team workshop.jpg', kind:'image', url:'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1400&q=70' },
    { id:'a-img-desk', name:'Desk setup.jpg', kind:'image', url:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1400&q=70' },
    { id:'a-img-chart', name:'Dashboard chart.jpg', kind:'image', url:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=70' },
    { id:'a-doc-guide', name:'Onboarding guide.pdf', kind:'document', url:null }
  ];
  var ASM_KEY = 'upspace.cd.assessments.v1';
  function asset(id){ return LIB.find(function(a){ return a.id === id; }); }

  var params = new URLSearchParams(location.search), ps = $('previewState');
  ps.value = params.get('state') || 'normal';
  var course = load().find(function(c){ return c.id === params.get('id'); });
  if (!course) location.replace('my-courses.html');
  var editable = !!course && (course.status === 'draft' || course.status === 'changes');
  var cur = null, scope = 'course'; // cur = lesson id; scope = 'course' | 'm:<id>' | 'l:<id>'

  function persist(){ course.updated = new Date().toISOString(); var l = load(), i = l.findIndex(function(c){ return c.id === course.id; }); if (i > -1){ l[i] = course; save(l); } }
  function allLessons(){ var out = []; course.modules.forEach(function(m, mi){ m.lessons.forEach(function(l, li){ out.push({ m:m, l:l, mi:mi, li:li }); }); }); return out; }
  function findL(id){ return allLessons().find(function(x){ return x.l.id === id; }); }
  function lessonLabel(id){ var x = findL(id); return x ? 'Lesson ' + (x.mi + 1) + '.' + (x.li + 1) : 'Lesson'; }

  /* ---------------- Header ---------------- */
  var STATUS = { draft:['Draft', 'gray'], changes:['Changes requested', 'warning'], review:['In review', 'brand'], approved:['Approved', 'brand'], published:['Published', 'success'], archived:['Archived', 'gray'] };
  function renderBar(){
    $('cTitle').textContent = course.title;
    var st = STATUS[course.status] || STATUS.draft;
    $('cStatus').className = 'badge ' + st[1]; $('cStatus').innerHTML = '<i></i>' + st[0];
    $('cAi').hidden = !allLessons().some(function(x){ return x.l.ai; });
    $('previewLink').href = 'course-preview.html?id=' + encodeURIComponent(course.id) + (cur ? '&lesson=' + encodeURIComponent(cur) : '');
    $('submitLabel').textContent = ps.value === 'noapproval' ? 'Publish' : 'Send for approval';
    $('draftBtn').disabled = $('submitBtn').disabled = !editable;
  }

  /* ---------------- Outline ---------------- */
  function renderTree(){
    $('navMeta').textContent = plural(course.modules.length, 'module') + ' · ' + plural(allLessons().length, 'lesson');
    $('tree').innerHTML = course.modules.map(function(m, mi){
      return '<div class="nmod' + (scope === 'm:' + m.id ? ' scoped' : '') + '"><button class="nmod-h" type="button" data-mod="' + m.id + '" title="Change this module with AI"><span class="num">' + (mi + 1) + '</span><span>' + esc(m.title) + '</span></button>' +
        '<ul class="nles">' + m.lessons.map(function(l){
          return '<li><button type="button" data-les="' + l.id + '" aria-current="' + (l.id === cur) + '"><span>' + esc(l.title) + '</span>' +
            (l.aiChanged ? '<span class="changed" title="Changed with AI"></span><span class="sr">Changed with AI</span>' : '') +
            (l.ai ? '<span class="badge sm brand" title="AI-generated">' + sv('spark') + 'AI</span>' : '') + '</button></li>';
        }).join('') + '</ul></div>';
    }).join('');
  }
  $('tree').addEventListener('click', function(e){
    var b = e.target.closest('[data-les]'); if (b) return openLesson(b.dataset.les, true);
    var m = e.target.closest('[data-mod]');
    if (m){ var mod = course.modules.find(function(x){ return x.id === m.dataset.mod; }); if (mod.lessons[0]) openLesson(mod.lessons[0].id, false); setScope('m:' + mod.id); if (editable) $('chatInput').focus(); }
  });

  /* ---------------- Lesson (read-only render of builder v2 blocks) ---------------- */
  function builderHref(lessonId){ return 'course-builder.html?id=' + encodeURIComponent(course.id) + '&lesson=' + encodeURIComponent(lessonId); }
  function renderBlock(b){
    var d = b.data || {}, k = (b.meta && b.meta.kind) || b.type, a, body = '';
    switch (b.type){
      case 'text':
        if (k === 'flashcards' && d.cards){ body = '<div class="prose"><p><strong>Flash cards</strong> <span style="font-size:12px;color:var(--text-tertiary)">· select a card to flip it</span></p></div><div class="fc-grid">' + d.cards.map(function(c){ return '<button class="fc" type="button" aria-label="Flash card: ' + esc(c[0]) + '. Select to flip."><span class="fc-in"><span class="fc-f">' + esc(c[0]) + '<small>Front</small></span><span class="fc-b">' + esc(c[1]) + '<small>Back</small></span></span></button>'; }).join('') + '</div>'; break; }
        body = '<div class="prose">' + (d.html || '') + '</div>'; break;
      case 'heading': body = '<div class="prose"><h3>' + esc(d.text) + '</h3></div>'; break;
      case 'callout': body = '<div class="callout prose">' + (d.title ? '<b>' + esc(d.title) + '</b>' : '') + (d.html || '') + '</div>'; break;
      case 'quote': body = '<div class="quote prose"><small>' + esc({ example:'Example', takeaway:'Key takeaway', case:'Case study' }[d.variant] || 'Quote') + '</small>' + (d.html || '') + '</div>'; break;
      case 'image': a = asset(d.assetId); body = '<figure>' + (a && a.url ? '<img src="' + esc(a.url) + '" alt="' + esc(d.alt || '') + '" loading="lazy">' : '<div class="media-ph">' + sv('image') + 'Image</div>') + (d.caption ? '<figcaption>' + esc(d.caption) + '</figcaption>' : '') + '</figure>'; break;
      case 'video': a = asset(d.assetId); body = '<figure>' + (a && a.url ? '<video controls preload="metadata" src="' + esc(a.url) + '"></video>' : '<div class="media-ph">' + sv('video') + 'Video</div>') + (d.caption ? '<figcaption>' + esc(d.caption) + '</figcaption>' : '') + '</figure>'; break;
      case 'audio': a = asset(d.assetId); body = '<div class="aud"><b>' + esc(d.title || 'Audio') + '</b>' + (a && a.url ? '<audio controls preload="none" src="' + esc(a.url) + '"></audio>' : '') + '</div>'; break;
      case 'document': a = asset(d.assetId);
        body = a ? '<div class="card"><span class="ic">' + sv(k === 'slides' ? 'slides' : 'doc') + '</span><div><b>' + esc(d.title || a.name) + '</b><small>' + esc(a.name) + '</small></div></div>'
                 : '<div class="card empty"><span class="ic">' + sv(k === 'slides' ? 'slides' : 'doc') + '</span><div><b>' + esc(d.title || 'Document') + '</b><small>' + (k === 'slides' ? 'Slides are still being prepared. Add a PPTX by hand if you need it now.' : 'Needs a file from your Content Library.') + '</small></div><a class="btn btn-secondary sm" href="' + builderHref(cur) + '">Add file</a></div>';
        break;
      case 'assessment':
        var as = (readJSON(ASM_KEY) || []).find(function(x){ return x.id === d.assessmentId; });
        body = '<div class="card"><span class="ic">' + sv('quiz') + '</span><div><b>' + esc(as ? as.title : 'Quiz') + '</b><small>' + (as ? plural(as.questions.length, 'question') + ' · pass mark ' + as.passMark + '%' : 'Set up the questions in the Course Builder') + '</small></div><a class="btn btn-secondary sm" href="' + builderHref(cur) + '">' + (as ? 'Review' : 'Set up') + '</a></div>';
