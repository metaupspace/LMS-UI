<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Course Designer — Course Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ---------------------------------------------------------------
     Course Designer — Course Builder v2 (CRS-003), block-based.
     Course → Module[] → Lesson[] → ContentBlock[] (independently
     addressable + reorderable). Rebuilt 2026-09-24 on user request;
     v1 (single rich-text field per lesson) backed up in scratchpad.
     Entry points unchanged: ?id= · &new=1 · &generated=1.
     Layout: outline (left) · lesson canvas (center) · contextual
     properties panel (right, library "Aside"; docked ≥1400px, overlay
     drawer below).
     Blocks: text, heading, image, video, audio, document, file, embed,
     code, callout, quote/example, divider, assessment (quiz / test /
     assignment / knowledge check). Add via "+ Add content" picker,
     drag from picker onto canvas, "/" quick insert, or drop files.
     Content Library (CRS-009): assets in localStorage
     `upspace.cd.library.v1`, file blobs in IndexedDB `upspace-cd`
     store `blobs` (user decision 2026-09-24 — no media server here).
     Uploads from the builder are added to the library (FR-07).
     Assessments (ASM-002) in `upspace.cd.assessments.v1`, edited in a
     drawer without leaving the builder; block references by id.
     Question Bank (ASM-003): shared store `upspace.cd.qbank.v1` (managed
     in question-bank.html), org-filtered. "Question Bank" in the
     assessment drawer inserts independent deep copies (new ids; bankId
     kept only to append usage history on save). Per-question "Save to
     Question Bank" (FR-03) adds a new independent bank row on save.
     Image-based questions: kind 'image' + format (mcq/multi/tf/short).
     Preview → course-preview.html (CRS-005, new tab).
     AI: stand-ins marked `ponytail:` — no AI service in this repo.
     Version history (CRS-008) not built anywhere yet → not wired.
     Library reused: Video player, Slider, Toggle, Aside, Modal,
     Dropdown menu, Select, Input, Textarea, File Dropper, Radio group,
     Badge, Alerts, Toast, Progress bar. Approved hand-built: Rich
     text editor, Tabs, Empty state, Skeleton, Course structure tree,
     AI progress + the 14 block components logged 2026-09-24.
     Question editor pattern from instructor/code/assessment-editor.html.
     Demo states via Preview control: loading, error, save-fail,
     upload-fail, ai-fail, library-fail, assessment-fail, bank-fail.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-strong:#404040; --text-secondary:#525252; --text-tertiary:#a3a3a3; --text-disabled:#d4d4d4;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f0f0f0; --border-strong:#a3a3a3;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --action-primary-subtle:#eef2ff; --action-primary-soft:#e0e7ff; --focus-ring:#6366f1;
    --error:#dc2626; --error-subtle:#fef2f2; --error-border:#fecaca;
    --warning:#ca8a04; --warning-subtle:#fefce8; --warning-border:#fef08a;
    --success:#15803d; --success-subtle:#f0fdf4; --success-border:#bbf7d0;
    --info:#2563eb; --info-subtle:#eff6ff; --info-border:#bfdbfe;
    --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-full:999px;
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow-sm:0 1px 3px rgba(23,23,23,.08), 0 1px 2px rgba(23,23,23,.04);
    --shadow-md:0 8px 24px rgba(23,23,23,.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,input,select,textarea{ font-family:var(--font); }
  button{ cursor:pointer; }
  button[disabled]{ cursor:not-allowed; }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  [hidden]{ display:none !important; }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }

  /* Buttons (library) */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 14px; border-radius:var(--radius-lg); font-size:14px; font-weight:600; border:1px solid transparent; white-space:nowrap; transition:background-color .15s ease, border-color .15s ease; }
  .btn{ line-height:1; }
  .btn svg{ width:16px; height:16px; flex-shrink:0; display:block; }
  .btn-sm{ height:32px; padding:0 10px; font-size:13px; gap:6px; }
  .btn-sm svg{ width:15px; height:15px; }
  .btn-primary{ background:var(--action-primary); color:#fff; }
  .btn-primary:hover{ background:var(--action-primary-hover); }
  .btn-primary[disabled]{ background:#a5b4fc; }
  .btn-secondary{ background:#fff; color:var(--text-strong); border-color:var(--border-default); }
  .btn-secondary:hover{ background:var(--surface-raised); }
  .btn-secondary[disabled]{ color:var(--text-tertiary); background:#fff; }
  .btn-danger{ background:var(--error); color:#fff; }
  .btn-danger:hover{ background:#b91c1c; }
  .btn-ghost{ background:transparent; color:var(--text-secondary); }
  .btn-ghost:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .ib{ width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:var(--radius-md); background:transparent; color:var(--text-secondary); flex-shrink:0; padding:0; }
  .ib:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .ib svg{ width:16px; height:16px; display:block; }
  .ib.sm{ width:28px; height:28px; }
  .spin{ width:14px; height:14px; border-radius:50%; border:2px solid var(--action-primary-soft); border-top-color:var(--action-primary); animation:spin .8s linear infinite; flex-shrink:0; }
  .spin.w{ border-color:rgba(255,255,255,.45); border-top-color:#fff; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Badge (library) */
  .badge{ display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:var(--radius-full); font-size:12.5px; font-weight:600; white-space:nowrap; }
  .badge i{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge svg{ width:12px; height:12px; }
  .badge.sm{ height:20px; padding:0 7px; font-size:11.5px; }
  .badge.gray{ background:var(--surface-raised); color:var(--text-secondary); }
  .badge.brand{ background:var(--action-primary-subtle); color:var(--action-primary); }
  .badge.warning{ background:var(--warning-subtle); color:#a16207; }
  .badge.success{ background:var(--success-subtle); color:var(--success); }
  .badge.blue{ background:var(--info-subtle); color:var(--info); }
  .badge.error{ background:var(--error-subtle); color:var(--error); }
  .badge.outline{ background:#fff; color:var(--text-tertiary); box-shadow:inset 0 0 0 1px var(--border-default); }

  /* Builder top bar */
  .bar{ display:flex; align-items:center; gap:12px; padding:10px clamp(14px, 1.8vw, 24px); background:#fff; border-bottom:1px solid var(--border-default); flex-wrap:wrap; }
  .bar-title{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .bar-title h1{ margin:0; font-size:17px; font-weight:700; letter-spacing:-.3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .save{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-tertiary); white-space:nowrap; }
  .save svg{ width:14px; height:14px; }
  .save.failed{ color:var(--error); font-weight:600; }
  .save .spin{ width:12px; height:12px; border-width:1.5px; border-color:var(--border-default); border-top-color:var(--text-secondary); }
  .bar-acts{ display:flex; align-items:center; gap:8px; }
  .btn-warn{ background:var(--warning-subtle); color:#a16207; border-color:var(--warning-border); }
  .btn-warn:hover{ background:#fef9c3; }
  .fb-quote{ margin:0 0 16px; padding:14px 16px; border-left:3px solid var(--warning); background:var(--warning-subtle); border-radius:0 var(--radius-lg) var(--radius-lg) 0; font-size:15px; line-height:1.6; color:var(--text-primary); }
  .fb-steps{ margin:0; padding-left:20px; font-size:14px; line-height:1.6; color:var(--text-secondary); }
  .fb-steps li{ margin-bottom:6px; }

  /* Banners (Alerts, library) */
  .banner{ display:flex; align-items:flex-start; gap:10px; padding:9px clamp(14px, 1.8vw, 24px); font-size:13.5px; line-height:1.5; color:var(--text-strong); border-bottom:1px solid var(--border-default); }
  .banner > svg{ width:17px; height:17px; flex-shrink:0; margin-top:2px; }
  .banner b{ color:var(--text-primary); }
  .banner .txt{ flex:1; min-width:0; }
  .banner .acts{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .banner.info{ background:var(--info-subtle); border-color:var(--info-border); } .banner.info > svg{ color:var(--info); }
  .banner.warning{ background:var(--warning-subtle); border-color:var(--warning-border); } .banner.warning > svg{ color:var(--warning); }
  .banner.error{ background:var(--error-subtle); border-color:var(--error-border); } .banner.error > svg{ color:var(--error); }
  .banner.gray{ background:var(--surface-raised); } .banner.gray > svg{ color:var(--text-secondary); }
  .banner .ib{ width:26px; height:26px; margin:-2px -6px -2px 0; }

  /* Workspace grid */
  .work{ flex:1; min-height:0; display:grid; grid-template-columns:clamp(250px, 19vw, 300px) minmax(0,1fr) auto; position:relative; }

  /* LEFT — Course outline (Course structure tree, approved) */
  .outline{ background:#fff; border-right:1px solid var(--border-default); display:flex; flex-direction:column; min-height:0; }
  .outline-h{ padding:14px 14px 12px; border-bottom:1px solid var(--border-subtle); }
  .outline-h h2{ margin:0; font-size:13.5px; font-weight:700; }
  .outline-h .counts{ font-size:12.5px; color:var(--text-tertiary); margin:3px 0 10px; }
  .prog-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; }
  .prog-row b{ color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .track{ height:6px; border-radius:var(--radius-full); background:var(--surface-overlay); overflow:hidden; }
  .track i{ display:block; height:100%; border-radius:inherit; background:var(--action-primary); transition:width .3s ease; }
  .tree-wrap{ flex:1; min-height:0; overflow-y:auto; padding:8px 8px 16px; }
  .tree, .lessons{ list-style:none; margin:0; padding:0; }
  .mod{ position:relative; }
  .mod + .mod{ margin-top:4px; }
  .mod-row{ display:flex; align-items:center; gap:4px; height:36px; padding:0 4px; border-radius:var(--radius-md); position:relative; }
  .mod-row:hover{ background:var(--surface-canvas); }
  .tw{ width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; border:0; background:none; color:var(--text-tertiary); border-radius:var(--radius-md); padding:0; flex-shrink:0; }
  .tw svg{ width:14px; height:14px; transition:transform .15s ease; }
  .tw[aria-expanded="false"] svg{ transform:rotate(-90deg); }
  .mod-t{ flex:1; min-width:0; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cnt{ font-size:12px; color:var(--text-tertiary); font-variant-numeric:tabular-nums; padding:0 2px; }
  .mod-row .ib, .les .ib{ width:24px; height:24px; opacity:0; }
  .mod-row:hover .ib, .mod-row:focus-within .ib, .les:hover .ib, .les:focus-within .ib, .les.sel .ib, .ib[aria-expanded="true"]{ opacity:1; }
  .lessons{ padding:2px 0 4px 16px; }
  .les{ display:flex; align-items:center; gap:2px; border-radius:var(--radius-md); position:relative; padding-right:2px; }
  .les:hover{ background:var(--surface-canvas); }
  .les.sel{ background:var(--action-primary-subtle); }
  .grip{ width:14px; display:flex; justify-content:center; color:var(--text-disabled); cursor:grab; flex-shrink:0; }
  .grip svg{ width:12px; height:12px; }
  .les:hover .grip{ color:var(--text-tertiary); }
  .les-btn{ flex:1; min-width:0; display:flex; align-items:center; gap:7px; height:32px; padding:0 4px; border:0; background:none; text-align:left; font-size:13px; color:var(--text-strong); border-radius:var(--radius-md); }
  .les.sel .les-btn{ color:var(--action-primary); font-weight:600; }
  .les-t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .les-ic{ width:14px; height:14px; color:var(--text-tertiary); flex-shrink:0; display:inline-flex; }
  .les-ic svg{ width:14px; height:14px; }
  .ai-tag{ display:inline-flex; align-items:center; gap:3px; height:18px; padding:0 6px; border-radius:var(--radius-full); background:var(--action-primary-subtle); color:var(--action-primary); font-size:10.5px; font-weight:700; flex-shrink:0; }
  .les.sel .ai-tag{ background:#fff; }
  .ai-tag svg{ width:9px; height:9px; }
  .empty-dot{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--text-tertiary); flex-shrink:0; }
  .add-les{ display:flex; align-items:center; gap:6px; height:30px; padding:0 8px 0 20px; border:0; background:none; font-size:12.5px; font-weight:600; color:var(--text-tertiary); border-radius:var(--radius-md); width:100%; }
  .add-les:hover{ color:var(--action-primary); background:var(--surface-canvas); }
  .add-les svg{ width:14px; height:14px; }
  .add-mod{ margin:10px 4px 0; width:calc(100% - 8px); justify-content:flex-start; }
  .rename{ flex:1; min-width:0; height:28px; padding:0 8px; border:1px solid var(--focus-ring); border-radius:var(--radius-md); font-size:13px; outline:none; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .mod.dragging, .les.dragging{ opacity:.4; }
  .drop-before::before, .drop-after::after{ content:""; position:absolute; left:6px; right:6px; height:2px; border-radius:2px; background:var(--action-primary); z-index:2; pointer-events:none; }
  .drop-before::before{ top:-2px; } .drop-after::after{ bottom:-2px; }
  .mod-row.drop-into{ background:var(--action-primary-subtle); box-shadow:inset 0 0 0 1.5px var(--action-primary-soft); }
  .tree-empty{ padding:22px 12px; font-size:13px; color:var(--text-tertiary); text-align:center; line-height:1.5; }

  /* CENTER — Lesson canvas */
  .canvas-wrap{ min-height:0; min-width:0; overflow-y:auto; position:relative; }
  .canvas{ max-width:840px; margin:0 auto; padding:clamp(20px, 2.4vw, 36px) clamp(18px, 2.6vw, 40px) 120px; }
  .crumb{ font-size:12.5px; color:var(--text-tertiary); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .les-head{ display:flex; align-items:flex-start; gap:10px; }
  .les-title{ flex:1; min-width:0; border:1px solid transparent; border-radius:var(--radius-lg); padding:3px 8px; margin-left:-9px; font-size:26px; font-weight:700; letter-spacing:-.5px; color:var(--text-primary); background:transparent; outline:none; }
  .les-title:hover:not([readonly]){ border-color:var(--border-default); }
  .les-title:focus:not([readonly]){ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); background:#fff; }
  .les-acts{ display:flex; align-items:center; gap:6px; padding-top:5px; flex-shrink:0; }
  .les-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0 22px; font-size:13px; color:var(--text-tertiary); }
  .les-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--text-disabled); }

  #blocks{ position:relative; }
  .drop-line{ position:absolute; left:0; right:0; height:2px; background:var(--action-primary); border-radius:2px; pointer-events:none; z-index:6; }
  .drop-line::before, .drop-line::after{ content:""; position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--action-primary); }
  .drop-line::before{ left:-4px; } .drop-line::after{ right:-4px; }
  .canvas.dragging-over #blocks{ outline:1.5px dashed var(--action-primary-soft); outline-offset:10px; border-radius:var(--radius-lg); }

  /* Insertion point (hand-built, approved) */
  .ins{ position:relative; height:22px; display:flex; align-items:center; justify-content:center; }
  .ins::before{ content:""; position:absolute; left:12px; right:12px; top:50%; height:1px; background:transparent; transition:background-color .15s ease; }
  .ins button{ position:relative; display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:var(--radius-full); border:1px solid var(--border-default); background:#fff; color:var(--text-secondary); font-size:12px; font-weight:600; opacity:0; transition:opacity .12s ease; box-shadow:var(--shadow-sm); }
  .ins button svg{ width:13px; height:13px; }
  .ins:hover::before, .ins:focus-within::before{ background:var(--action-primary-soft); }
  .ins:hover button, .ins button:focus-visible, .ins.open button{ opacity:1; color:var(--action-primary); border-color:var(--action-primary-soft); }
  .ins.end{ height:auto; margin-top:10px; justify-content:flex-start; }
  .ins.end::before{ display:none; }
  .ins.end button{ opacity:1; height:40px; padding:0 16px; font-size:14px; border-style:dashed; box-shadow:none; color:var(--text-secondary); width:100%; justify-content:center; border-radius:var(--radius-lg); }
  .ins.end button:hover{ color:var(--action-primary); border-color:var(--action-primary); background:var(--action-primary-subtle); }
  .ins.end button svg{ width:16px; height:16px; }

  /* Content block frame (hand-built, approved) */
  .blk{ position:relative; border-radius:var(--radius-lg); padding:10px 12px; margin:0 -12px; transition:box-shadow .12s ease, background-color .12s ease; }
  .blk:hover{ box-shadow:inset 0 0 0 1px var(--border-default); }
  .blk.sel{ box-shadow:inset 0 0 0 1.5px var(--action-primary), 0 0 0 3px rgba(99,102,241,.1); }
  .blk.dragging{ opacity:.35; }
  .blk.ro:hover{ box-shadow:none; }
  .blk-type{ position:absolute; left:10px; top:-10px; height:20px; padding:0 8px; border-radius:var(--radius-full); background:#fff; border:1px solid var(--border-default); font-size:11px; font-weight:600; color:var(--text-secondary); display:none; align-items:center; gap:4px; z-index:4; }
  .blk-type svg{ width:11px; height:11px; }
  .blk-type .ai{ color:var(--action-primary); }
  .blk:hover .blk-type, .blk.sel .blk-type{ display:inline-flex; }
  .blk.ro .blk-type{ display:none; }
  .tb{ position:absolute; right:8px; top:-16px; display:none; align-items:center; gap:1px; padding:2px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); z-index:5; }
  .blk:hover .tb, .blk.sel .tb, .tb:focus-within{ display:flex; }
  .tb .ib{ width:28px; height:28px; }
  .tb .ib svg{ width:15px; height:15px; }
  .tb .drag{ cursor:grab; }
  .tb .sep{ width:1px; height:16px; background:var(--border-default); margin:0 2px; }
  .blk.busy > .busy-ov{ display:flex; }
  .busy-ov{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,.85); border-radius:inherit; z-index:6; font-size:14px; font-weight:500; }

  /* Text-like blocks (Rich text editor, approved) */
  .rt{ font-size:16px; line-height:1.7; color:var(--text-primary); outline:none; overflow-wrap:anywhere; min-height:1.7em; }
  .rt:empty::before, .hd:empty::before, .cap:empty::before, .vid-cap:empty::before, .co-t:empty::before, [data-edit="attribution"]:empty::before{ content:attr(data-placeholder); color:var(--text-tertiary); pointer-events:none; }
  .rt p{ margin:0 0 12px; } .rt p:last-child{ margin-bottom:0; }
  .rt h2{ font-size:21px; margin:18px 0 8px; letter-spacing:-.3px; } .rt h3{ font-size:17.5px; margin:16px 0 6px; }
  .rt h2:first-child, .rt h3:first-child{ margin-top:0; }
  .rt ul, .rt ol{ margin:0 0 12px; padding-left:24px; } .rt li{ margin-bottom:4px; }
  .rt blockquote{ margin:0 0 12px; padding:2px 0 2px 14px; border-left:3px solid var(--border-default); color:var(--text-secondary); }
  .rt a{ color:var(--action-primary); text-decoration:underline; }
  .rt code{ font-family:var(--mono); font-size:.86em; padding:1px 5px; border-radius:var(--radius-sm); background:var(--surface-raised); border:1px solid var(--border-subtle); }
  .rt pre{ font-family:var(--mono); font-size:13.5px; line-height:1.6; background:#171717; color:#e5e5e5; padding:12px 14px; border-radius:var(--radius-lg); overflow-x:auto; margin:0 0 12px; white-space:pre-wrap; }
  .hd{ outline:none; font-weight:700; color:var(--text-primary); overflow-wrap:anywhere; }
  .hd.h2{ font-size:22px; letter-spacing:-.4px; line-height:1.3; }
  .hd.h3{ font-size:18px; letter-spacing:-.2px; line-height:1.35; }
  .dv{ border:0; border-top:1px solid var(--border-default); margin:10px 0; }

  /* Floating formatting toolbar */
  .fmt{ position:fixed; z-index:30; display:flex; align-items:center; gap:1px; padding:3px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); }
  .fmt button{ width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:var(--radius-md); background:transparent; color:var(--text-secondary); padding:0; }
  .fmt button:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .fmt button[aria-pressed="true"]{ background:var(--action-primary-subtle); color:var(--action-primary); }
  .fmt button svg{ width:15px; height:15px; }
  .fmt .sep{ width:1px; height:18px; background:var(--border-default); margin:0 3px; }
  .fmt-link{ position:fixed; z-index:31; display:flex; gap:6px; padding:6px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); }
  .fmt-link input{ width:240px; height:32px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-md); font-size:13.5px; outline:none; }
  .fmt-link input:focus{ border-color:var(--focus-ring); }

  /* Callout (hand-built, approved) */
  .co{ display:flex; gap:12px; padding:12px 14px; border-radius:var(--radius-lg); background:var(--surface-canvas); border-left:3px solid var(--border-strong); }
  .co-ic{ width:20px; height:20px; flex-shrink:0; margin-top:2px; color:var(--text-secondary); }
  .co-ic svg{ width:20px; height:20px; }
  .co-t{ font-size:13px; font-weight:700; letter-spacing:.2px; margin-bottom:2px; color:var(--text-strong); outline:none; }
  .co .rt{ font-size:15px; line-height:1.6; }
  .co-body{ flex:1; min-width:0; }
  .co.note{ border-left-color:var(--info); } .co.note .co-ic{ color:var(--info); }
  .co.tip{ border-left-color:var(--success); } .co.tip .co-ic{ color:var(--success); }
  .co.important{ border-left-color:var(--action-primary); } .co.important .co-ic{ color:var(--action-primary); }
  .co.warning{ border-left-color:var(--warning); background:var(--warning-subtle); } .co.warning .co-ic{ color:var(--warning); }
  .co.example{ border-left-color:var(--text-secondary); }

  /* Quote / Example (hand-built, approved) */
  .qt{ margin:0; padding:4px 0 4px 22px; position:relative; }
  .qt::before{ content:"\201C"; position:absolute; left:-2px; top:-10px; font-size:44px; line-height:1; color:var(--action-primary-soft); font-family:Georgia, serif; }
  .qt .rt{ font-size:18px; line-height:1.6; font-style:italic; color:var(--text-strong); }
  .qt figcaption{ margin-top:8px; font-size:13.5px; color:var(--text-tertiary); outline:none; }
  .ex{ padding:2px 0 2px 16px; border-left:3px solid var(--action-primary-soft); }
  .ex-l{ font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--action-primary); margin-bottom:4px; }
  .ex.takeaway{ border-left-color:var(--success); } .ex.takeaway .ex-l{ color:var(--success); }
  .ex.case{ border-left-color:var(--text-strong); } .ex.case .ex-l{ color:var(--text-strong); }

  /* Media source chooser (File Dropper, library) */
  .src{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:22px 16px; border:1.5px dashed var(--border-default); border-radius:var(--radius-xl); background:var(--surface-canvas); transition:border-color .15s ease, background-color .15s ease; }
  .src.over{ border-color:var(--action-primary); background:var(--action-primary-subtle); }
  .src-ic{ width:40px; height:40px; border-radius:var(--radius-lg); background:#fff; border:1px solid var(--border-default); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; margin-bottom:2px; }
  .src-ic svg{ width:20px; height:20px; }
  .src b{ font-size:14.5px; }
  .src > span{ font-size:12.5px; color:var(--text-tertiary); }
  .src-acts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .src-url{ display:flex; gap:6px; width:min(460px, 100%); margin-top:6px; }
  .src-url input{ flex:1; min-width:0; height:34px; padding:0 10px; border:1px solid var(--border-default); border-radius:var(--radius-md); font-size:13.5px; outline:none; background:#fff; }
  .src-url input:focus{ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .src small{ font-size:12px; color:var(--text-tertiary); margin-top:2px; }
  .src .err{ font-size:12.5px; color:var(--error); font-weight:600; }

  /* Upload status row (hand-built, approved) */
  .up{ display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; }
  .up-ic{ width:40px; height:40px; border-radius:var(--radius-lg); background:var(--action-primary-subtle); color:var(--action-primary); display:flex; align-items:center; justify-content:center; }
  .up-ic svg{ width:18px; height:18px; }
  .up b{ display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up small{ display:block; font-size:12.5px; color:var(--text-tertiary); margin-top:6px; }
  .up-bar{ height:6px; border-radius:var(--radius-full); background:var(--surface-overlay); overflow:hidden; margin-top:8px; }
  .up-bar i{ display:block; height:100%; background:var(--action-primary); border-radius:inherit; transition:width .15s linear; }
  .up-bar.ind i{ width:35%; animation:ind 1.1s ease-in-out infinite; }
  @keyframes ind{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(300%); } }
  .up.failed{ border-color:var(--error-border); background:var(--error-subtle); }
  .up.failed .up-ic{ background:#fff; color:var(--error); }
  .up.failed small{ color:var(--error); font-weight:600; }
  .up .acts{ display:flex; gap:6px; }

  /* Media shells */
  .shimmer{ background:linear-gradient(90deg, #f3f3f3 25%, #e9e9e9 50%, #f3f3f3 75%); background-size:200% 100%; animation:loading 1.4s infinite; border-radius:var(--radius-lg); }
  @keyframes loading{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
  .broken{ display:flex; align-items:center; gap:12px; padding:16px; border:1px dashed var(--error-border); border-radius:var(--radius-xl); background:var(--error-subtle); color:var(--text-strong); font-size:14px; }
  .broken svg{ width:20px; height:20px; color:var(--error); flex-shrink:0; }
  .broken b{ display:block; color:var(--text-primary); }
  .broken .txt{ flex:1; min-width:0; }

  /* Image figure (hand-built, approved) */
  .im{ margin:0; }
  .im img{ display:block; max-width:100%; height:auto; border-radius:var(--radius-lg); }
  .im.wide img{ width:100%; }
  .im.center{ text-align:center; } .im.center img{ margin:0 auto; max-width:70%; }
  .im.left img{ max-width:55%; }
  .im .ph{ aspect-ratio:16/9; width:100%; }
  .cap{ margin-top:8px; font-size:13.5px; color:var(--text-tertiary); outline:none; }
  .im.center .cap{ text-align:center; }

  /* Video player (library) */
  .vp{ position:relative; border-radius:var(--radius-xl); overflow:hidden; background:#0a0a0a; aspect-ratio:16/9; }
  .vp video, .vp iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#0a0a0a; }
  .vp .slot, .vp .ph{ position:absolute; inset:0; }
  .vp .ph{ border-radius:0; }
  .vp-play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.18); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; color:#fff; pointer-events:none; transition:opacity .2s ease; }
  .vp-play svg{ width:26px; height:26px; margin-left:3px; }
  .vp.playing .vp-play{ opacity:0; }
  .vid-cap{ margin-top:8px; font-size:13.5px; color:var(--text-tertiary); outline:none; }

  /* Audio player (hand-built, approved) */
  .ap{ display:grid; grid-template-columns:44px minmax(0,1fr); gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; }
  .ap-play{ width:44px; height:44px; border-radius:50%; border:0; background:var(--action-primary); color:#fff; display:flex; align-items:center; justify-content:center; }
  .ap-play:hover{ background:var(--action-primary-hover); }
  .ap-play svg{ width:18px; height:18px; }
  .ap-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .ap-top b{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .ap-time{ font-size:12.5px; color:var(--text-tertiary); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ap-row{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  .range{ -webkit-appearance:none; appearance:none; height:6px; border-radius:var(--radius-full); background:linear-gradient(var(--action-primary), var(--action-primary)) 0/var(--p, 0%) 100% no-repeat, var(--surface-overlay); outline:none; cursor:pointer; }
  .range::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--action-primary); box-shadow:var(--shadow-sm); }
  .range::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid var(--action-primary); }
  .ap .seek{ flex:1; min-width:0; }
  .ap .vol{ width:70px; }
  .ap-vol{ display:flex; align-items:center; gap:6px; color:var(--text-tertiary); }
  .ap-vol svg{ width:16px; height:16px; }
  .ap-tr{ grid-column:1/-1; }
  .ap-tr summary{ font-size:12.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; }
  .ap-tr p{ margin:8px 0 0; font-size:13.5px; line-height:1.6; color:var(--text-secondary); white-space:pre-wrap; }

  /* Document viewer (hand-built, approved) */
  .doc{ border:1px solid var(--border-default); border-radius:var(--radius-xl); overflow:hidden; background:#fff; }
  .doc-h{ display:flex; align-items:center; gap:12px; padding:10px 12px 10px 14px; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; }
  .ext{ width:36px; height:36px; border-radius:var(--radius-md); background:var(--action-primary-subtle); color:var(--action-primary); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; text-transform:uppercase; flex-shrink:0; }
  .ext.pdf{ background:var(--error-subtle); color:var(--error); }
  .ext.pptx{ background:#fff7ed; color:#c2410c; }
  .ext.docx{ background:var(--info-subtle); color:var(--info); }
  .ext.xlsx, .ext.csv{ background:var(--success-subtle); color:var(--success); }
  .doc-h .meta{ flex:1; min-width:140px; }
  .doc-h b{ display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-h small{ font-size:12.5px; color:var(--text-tertiary); }
  .doc-h .acts{ display:flex; gap:6px; }
  .doc iframe{ display:block; width:100%; border:0; background:var(--surface-raised); }
  .doc-fb{ padding:28px 20px; text-align:center; background:var(--surface-canvas); font-size:14px; color:var(--text-secondary); line-height:1.5; }
  .doc-fb b{ display:block; color:var(--text-primary); margin-bottom:2px; }

  /* File download (hand-built, approved) */
  .fd{ display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; }
  .fd .ext{ width:40px; height:40px; }
  .fd b{ display:block; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fd small{ display:block; font-size:12.5px; color:var(--text-tertiary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Embed (hand-built, approved) */
  .em{ border:1px solid var(--border-default); border-radius:var(--radius-xl); overflow:hidden; background:#fff; }
  .em-h{ display:flex; align-items:center; gap:8px; padding:6px 8px 6px 12px; border-bottom:1px solid var(--border-subtle); font-size:12.5px; color:var(--text-tertiary); }
  .em-h svg{ width:14px; height:14px; flex-shrink:0; }
  .em-h span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .em iframe{ display:block; width:100%; border:0; background:var(--surface-canvas); }
  .em-note{ padding:6px 12px; font-size:12px; color:var(--text-tertiary); border-top:1px solid var(--border-subtle); }
  .em-cfg{ padding:16px; border:1.5px dashed var(--border-default); border-radius:var(--radius-xl); background:var(--surface-canvas); }
  .em-cfg .seg{ margin-bottom:10px; }
  .em-cfg .row{ display:flex; gap:8px; }
  .em-cfg input, .em-cfg textarea{ flex:1; width:100%; min-width:0; border:1px solid var(--border-default); border-radius:var(--radius-md); padding:8px 10px; font-size:13.5px; outline:none; background:#fff; font-family:var(--font); }
  .em-cfg textarea{ font-family:var(--mono); font-size:12.5px; min-height:74px; resize:vertical; }
  .em-cfg input:focus, .em-cfg textarea:focus{ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .em-cfg .foot{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }

  /* Tabs (segmented, approved) */
  .seg{ display:inline-flex; gap:3px; padding:3px; background:var(--surface-overlay); border-radius:var(--radius-lg); }
  .seg button{ height:28px; padding:0 12px; border:0; border-radius:var(--radius-md); background:transparent; font-size:13px; font-weight:600; color:var(--text-secondary); }
  .seg button[aria-selected="true"]{ background:#fff; color:var(--text-primary); box-shadow:0 1px 3px rgba(23,23,17,.1); }

  /* Code (hand-built, approved) */
  .cd{ border-radius:var(--radius-xl); overflow:hidden; background:#171717; border:1px solid #262626; }
  .cd-h{ display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; border-bottom:1px solid #262626; }
  .cd-h .t{ flex:1; min-width:0; font-size:12.5px; font-weight:600; color:#d4d4d4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; outline:none; }
  .cd-h .t:empty::before{ content:attr(data-placeholder); color:#737373; }
  .cd-h .lang{ height:26px; padding:0 8px; border-radius:var(--radius-md); background:#262626; color:#d4d4d4; border:1px solid #333; font-size:12px; font-weight:600; }
  .cd-h .lang-l{ font-size:12px; font-weight:600; color:#a3a3a3; }
  .cd-h .copy{ display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 8px; border:0; border-radius:var(--radius-md); background:transparent; color:#a3a3a3; font-size:12px; font-weight:600; }
  .cd-h .copy:hover{ background:#262626; color:#fff; }
  .cd-h .copy svg{ width:13px; height:13px; }
  .cd pre, .cd textarea{ margin:0; padding:14px 16px; font-family:var(--mono); font-size:13.5px; line-height:1.65; color:#e5e5e5; tab-size:2; }
  .cd pre{ overflow-x:auto; white-space:pre; }
  .cd textarea{ display:block; width:100%; min-height:120px; background:#0f0f0f; border:0; outline:none; resize:vertical; white-space:pre; overflow-x:auto; }
  .cd-x{ margin-top:8px; font-size:14px; line-height:1.6; color:var(--text-secondary); }
  .tk-c{ color:#737373; font-style:italic; } .tk-s{ color:#a5d6a7; } .tk-n{ color:#f9c97a; } .tk-k{ color:#a5b4fc; font-weight:500; } .tk-t{ color:#7dd3fc; } .tk-a{ color:#f0abfc; } .tk-p{ color:#fda4af; }

  /* Assessment summary (hand-built, approved) */
  .as{ display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; padding:16px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; }
  .as-ic{ width:44px; height:44px; border-radius:var(--radius-lg); background:var(--action-primary-subtle); color:var(--action-primary); display:flex; align-items:center; justify-content:center; }
  .as-ic svg{ width:20px; height:20px; }
  .as b{ display:block; font-size:15.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .as .m{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); margin-top:3px; }
  .as .m .dot{ width:3px; height:3px; border-radius:50%; background:var(--text-disabled); }
  .as .badges{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

  /* Empty states (approved) */
  .blank{ margin:clamp(24px, 6vh, 72px) auto 0; max-width:480px; text-align:center; padding:0 20px; }
  .blank .ic{ width:44px; height:44px; border-radius:var(--radius-lg); background:var(--action-primary-subtle); color:var(--action-primary); display:inline-flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .blank .ic svg{ width:22px; height:22px; }
  .blank b{ display:block; font-size:18px; margin-bottom:6px; }
  .blank p{ margin:0 0 20px; font-size:14.5px; line-height:1.55; color:var(--text-secondary); }
  .blank .acts{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .gen-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px dashed var(--action-primary-soft); border-radius:var(--radius-xl); background:var(--action-primary-subtle); color:var(--action-primary); font-size:14px; font-weight:500; margin:6px 0; }
  .gen-row .lines{ flex:1; display:grid; gap:7px; }
  .gen-row .lines i{ display:block; height:8px; border-radius:4px; background:rgba(79,70,229,.14); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.45; } }

  /* Content picker (hand-built, approved) */
  .picker{ position:fixed; z-index:40; width:min(560px, calc(100vw - 24px)); max-height:min(560px, calc(100vh - 24px)); display:flex; flex-direction:column; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); box-shadow:0 16px 48px rgba(23,23,23,.16); transition:opacity .12s ease; }
  .picker.dragging{ opacity:.25; pointer-events:none; }
  .picker-h{ display:flex; align-items:center; gap:8px; padding:10px 10px 10px 14px; border-bottom:1px solid var(--border-subtle); }
  .picker-h > svg{ width:16px; height:16px; color:var(--text-tertiary); flex-shrink:0; }
  .picker-h input{ flex:1; min-width:0; height:32px; border:0; outline:none; font-size:14px; }
  .picker-b{ overflow-y:auto; padding:6px 10px 12px; }
  .picker-cat{ font-size:11.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); margin:10px 4px 6px; }
  .picker-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:2px; }
  .pk{ display:flex; align-items:center; gap:10px; padding:7px 8px; border:0; border-radius:var(--radius-lg); background:transparent; text-align:left; cursor:grab; min-width:0; }
  .pk:hover, .pk:focus-visible, .pk.active{ background:var(--surface-raised); outline:none; }
  .pk[disabled]{ opacity:.45; cursor:not-allowed; }
  .pk .pi{ width:32px; height:32px; border-radius:var(--radius-md); border:1px solid var(--border-default); background:#fff; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pk .pi svg{ width:16px; height:16px; }
  .pk.ai .pi{ color:var(--action-primary); border-color:var(--action-primary-soft); background:var(--action-primary-subtle); }
  .pk b{ display:block; font-size:13.5px; font-weight:600; color:var(--text-primary); }
  .pk small{ display:block; font-size:12px; color:var(--text-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pk div{ min-width:0; }
  .picker-f{ padding:8px 14px; border-top:1px solid var(--border-subtle); font-size:12px; color:var(--text-tertiary); }
  .picker-empty{ padding:24px; text-align:center; color:var(--text-tertiary); font-size:13.5px; }

  /* RIGHT — Properties panel (Aside, library) */
  .props{ width:340px; background:#fff; border-left:1px solid var(--border-default); display:flex; flex-direction:column; min-height:0; }
  .props-h{ display:flex; align-items:center; gap:10px; padding:12px 12px 12px 16px; border-bottom:1px solid var(--border-subtle); }
  .props-h .pi{ width:28px; height:28px; border-radius:var(--radius-md); background:var(--surface-raised); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; }
  .props-h .pi svg{ width:15px; height:15px; }
  .props-h h2{ flex:1; margin:0; font-size:14px; font-weight:700; }
  .props-b{ flex:1; min-height:0; overflow-y:auto; padding:16px; }
  .props-f{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border-subtle); }
  .props-f .btn{ flex:1; }
  .psec + .psec{ margin-top:18px; padding-top:18px; border-top:1px solid var(--border-subtle); }
  .psec h3{ margin:0 0 10px; font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--text-tertiary); }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label, .lbl{ display:block; font-size:13px; font-weight:600; color:var(--text-strong); margin-bottom:6px; }

  var KW = {
    javascript:'const let var function return if else for while do class new import from export default async await try catch finally throw typeof instanceof null undefined true false this switch case break continue of in',
    python:'def return if elif else for while class import from as try except finally raise with lambda None True False and or not in is pass yield self print break continue global',
    java:'public private protected class interface static final void int long double float boolean char byte new return if else for while do try catch finally throw throws import package extends implements this super null true false String switch case break',
    c:'int char float double void return if else for while do struct typedef include define static const unsigned long short sizeof NULL switch case break continue enum',
    sql:'select from where insert into values update set delete create table join left right inner outer on group by order having as and or not null limit distinct count sum avg min max primary key',
    json:'true false null',
    bash:'if then else elif fi for do done while echo export function return in case esac cd ls grep sudo cat source local'

  function hl(src, lang){
    var rules;
    if (lang === 'html') rules = [['c', /<!--[\s\S]*?-->/], ['s', /"[^"]*"|'[^']*'/], ['t', /<\/?[a-zA-Z][\w-]*|\/?>/], ['a', /\s[\w\-:]+(?==)/]];
    else if (lang === 'css') rules = [['c', /\/\*[\s\S]*?\*\//], ['s', /"[^"]*"|'[^']*'/], ['a', /[\w-]+(?=\s*:)/], ['n', /#[\da-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|rem|em|%|s|vh|vw)?\b/], ['t', /[.#]?[\w-]+(?=[^{}]*\{)/]];
    else {
      var cm = lang === 'python' || lang === 'bash' ? /#.*/ : lang === 'sql' ? /--.*|\/\*[\s\S]*?\*\// : lang === 'json' ? /\u0000/ : /\/\/.*|\/\*[\s\S]*?\*\//;
      rules = [['c', cm], ['s', /"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`/], ['n', /\b\d+(?:\.\d+)?\b/], ['w', /[A-Za-z_]\w*/]];
      if (lang === 'json') rules.splice(1, 0, ['p', /"(?:\\.|[^"\\])*"(?=\s*:)/]);
    }
    var kw = (KW[lang] || '').split(' '), re = new RegExp(rules.map(function(r){ return '(' + r[1].source + ')'; }).join('|'), 'g');
    var out = '', last = 0, m;
    while ((m = re.exec(src))){
      if (!m[0]){ re.lastIndex++; continue; }
      out += esc(src.slice(last, m.index));
      var gi = m.slice(1).findIndex(function(x){ return x !== undefined; }), type = rules[gi][0], tok = m[0];
      if (type === 'w') out += kw.indexOf(lang === 'sql' ? tok.toLowerCase() : tok) > -1 ? '<span class="tk-k">' + esc(tok) + '</span>' : esc(tok);
      else out += '<span class="tk-' + type + '">' + esc(tok) + '</span>';
      last = m.index + tok.length;
    }
    return out + esc(src.slice(last));
  }

        all.unshift({ id:id, orgId:ORG_ID, kind:q.kind, format:q.format || null, prompt:q.prompt.trim(), image:q.image ? clone(q.image) : null, options:q.options.map(function(o){ return { id:uid('o'), text:o.text.trim(), correct:!!o.correct }; }), answer:(q.answer || '').trim(), alts:(q.alts || []).slice(), explanation:q.explanation || '', points:q.points, tags:[], ai:!!q.ai, aiSource:null, createdBy:ME, createdAt:now, updatedBy:ME, updatedAt:now, usage:[clone(rec)] });
        q.savedToBank = true; q.bankId = id; delete q.saveToBank; made++; return;
      }
      if (!q.bankId) return;
      var t = all.find(function(x){ return x.id === q.bankId && x.orgId === ORG_ID; });
      if (!t) return; // template deleted — this copy is unaffected
      t.usage = t.usage || [];
      var u = t.usage.find(function(x){ return x.asmId === a.id; });
      if (u) u.asmTitle = a.title; else t.usage.push(clone(rec));
    });
    writeJSON(QB_KEY, all);
    return made;
  }
  var bankTok = null;
  function openBank(){
    var tok = bankTok = {}, picked = {}, shown = 100, all = [], items = [];
    $('modalBody').innerHTML = '<div class="bank-h"><h3 id="modalTitle">Insert from Question Bank</h3><a class="btn btn-ghost btn-sm" href="question-bank.html" target="_blank" rel="noopener">Manage Question Bank ↗</a></div><p class="sub">Selected questions are copied into this assessment. Editing a copy won\'t change the bank, and bank edits won\'t change this assessment.</p><div id="bankBody" aria-busy="true"><div class="pick-list">' + [0, 1, 2, 3].map(function(){ return '<div class="pick-row" style="cursor:default"><span class="sk" style="width:16px;height:16px;margin:0"></span><div class="grow"><span class="sk" style="width:70%"></span><span class="sk" style="width:40%;height:9px"></span></div></div>'; }).join('') + '</div></div><div class="modal-foot"><span class="bank-count" id="bankCount"></span><button class="btn btn-secondary" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" id="bankAdd" disabled>Insert selected</button></div>';
    $('modal').querySelector('.modal').style.width = '720px'; openModal();
    function load(){
      $('bankBody').setAttribute('aria-busy', 'true');
      // ponytail: simulated bank fetch; swap for the paginated Question Bank API (ASM-003-NFR-02)
      setTimeout(function(){
        if (bankTok !== tok || !$('bankBody')) return;
        $('bankBody').removeAttribute('aria-busy');
        if (demo() === 'bank-fail'){ $('bankBody').innerHTML = '<div class="alert error" role="alert">' + I.alert + '<div><b>The Question Bank couldn\'t be loaded</b>Nothing was added. Check your connection and try again.<br><button class="btn btn-secondary btn-sm" type="button" id="bankRetry" style="margin-top:8px">Try again</button></div></div>'; $('bankRetry').onclick = function(){ ps.value = 'normal'; load(); }; return; }
        all = bankList();
        if (!all.length){ $('bankBody').innerHTML = '<div class="q-empty"><b>Your Question Bank is empty</b><br>Create reusable questions in the Question Bank, then insert them here.<br><a class="btn btn-secondary btn-sm" href="question-bank.html" target="_blank" rel="noopener" style="margin-top:12px">Open Question Bank ↗</a></div>'; return; }
        var tags = {}; all.forEach(function(x){ (x.tags || []).forEach(function(t){ tags[t.toLowerCase()] = tags[t.toLowerCase()] || t; }); });
        $('bankBody').innerHTML = '<div class="bank-tools"><input class="input" id="bankQ" type="search" placeholder="Search questions..." aria-label="Search questions"><select class="select" id="bankType" aria-label="Filter by type"><option value="">All types</option>' + Q_KINDS.map(function(x){ return '<option value="' + x[0] + '">' + x[1] + '</option>'; }).join('') + '</select><select class="select" id="bankTag" aria-label="Filter by tag"><option value="">All tags</option>' + Object.keys(tags).sort().map(function(k){ return '<option value="' + esc(tags[k]) + '">' + esc(tags[k]) + '</option>'; }).join('') + '</select></div><label class="bank-all"><input type="checkbox" id="bankAllChk">Select all visible <span id="bankVis"></span></label><div class="pick-list" id="bankList" style="max-height:340px"></div>';
        $('bankQ').oninput = function(){ shown = 100; draw(); };
        $('bankType').onchange = $('bankTag').onchange = function(){ shown = 100; draw(); };
        $('bankAllChk').onchange = function(){ var on = this.checked; items.slice(0, shown).forEach(function(x){ if (on) picked[x.id] = true; else delete picked[x.id]; }); draw(); };
        $('bankList').onchange = function(e){ var id = e.target.dataset.bid; if (id == null) return; if (e.target.checked) picked[id] = true; else delete picked[id]; count(); };
        $('bankList').onclick = function(e){ if (e.target.id === 'bankMore'){ shown += 100; draw(); } };
        draw(); $('bankQ').focus();
      }, 300);
    }
    function draw(){
      var s = $('bankQ').value.trim().toLowerCase(), ty = $('bankType').value, tg = $('bankTag').value.toLowerCase();
      items = all.filter(function(x){ return (!ty || x.kind === ty) && (!tg || (x.tags || []).some(function(t){ return t.toLowerCase() === tg; })) && (!s || (x.prompt + ' ' + (x.options || []).map(function(o){ return o.text; }).join(' ') + ' ' + (x.tags || []).join(' ')).toLowerCase().indexOf(s) > -1); });
      var vis = items.slice(0, shown);
      $('bankList').innerHTML = vis.length ? vis.map(function(x){ var kl = (Q_KINDS.find(function(k){ return k[0] === x.kind; }) || [0, x.kind])[1]; return '<label class="pick-row"><input type="checkbox" data-bid="' + esc(x.id) + '"' + (picked[x.id] ? ' checked' : '') + '><div class="grow"><b>' + esc(x.prompt) + '</b><small>' + esc([kl].concat((x.tags || []).slice(0, 3)).join(' · ')) + ' · ' + x.points + (x.points === 1 ? ' pt' : ' pts') + '</small></div>' + (x.ai ? '<span class="badge brand sm">' + I.sparkF + 'AI generated</span>' : '') + '</label>'; }).join('') + (items.length > shown ? '<button class="btn btn-ghost btn-sm" type="button" id="bankMore">Show more (' + (items.length - shown) + ' remaining)</button>' : '') : '<p class="hint">No questions match. Try another search or filter.</p>';
      count();
    }
    function count(){
      var vis = items.slice(0, shown), nv = vis.filter(function(x){ return picked[x.id]; }).length, n = Object.keys(picked).length, c = $('bankAllChk');
      c.checked = !!vis.length && nv === vis.length; c.indeterminate = nv > 0 && nv < vis.length; c.disabled = !vis.length;
      $('bankVis').textContent = '(' + vis.length + ')';
      $('bankCount').textContent = n ? n + ' selected' : '';
      $('bankAdd').disabled = !n; $('bankAdd').textContent = n ? 'Insert ' + n + ' selected' : 'Insert selected';
    }
    $('bankAdd').onclick = function(){
      var sel = all.filter(function(x){ return picked[x.id]; });
      sel.forEach(function(t){ asmCtx.draft.questions.push(bankCopy(t)); });
      asmCtx.dirty = true; closeModal(); drawAsm(); toast(sel.length + (sel.length === 1 ? ' question inserted as a copy.' : ' questions inserted as copies.'));
    };
    load();
  }
  function openAiQ(){
    $('modalBody').innerHTML = '<h3 id="modalTitle">Generate questions with AI</h3><p class="sub">AI drafts questions with suggested answers. Nothing is final — review and edit every question before saving.</p><div class="field"><label for="aiTopic">What should the questions cover?</label><textarea class="input" id="aiTopic">' + esc((lesson() || {}).title || '') + '</textarea></div><div class="field"><label for="aiN">Number of questions</label><select class="select" id="aiN"><option>3</option><option selected>5</option><option>10</option></select></div><div id="aiQErr"></div><div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" id="aiGo">' + I.spark + 'Generate</button></div>';
    openModal();
    $('aiGo').onclick = function(){
      var b = this; b.disabled = true; b.innerHTML = '<span class="spin w"></span>Generating…';
      // ponytail: local stand-in for AI question generation (ASM-002-FR-05, ≤30s); swap for the API
      setTimeout(function(){
        if (demo() === 'ai-fail'){ b.disabled = false; b.innerHTML = I.spark + 'Try again'; $('aiQErr').innerHTML = '<div class="alert error" role="alert">' + I.alert + '<div>AI couldn\'t generate questions. Nothing was added. Try again.</div></div>'; return; }
        aiQuestions($('aiTopic').value.trim() || (lesson() || {}).title, +$('aiN').value).forEach(function(q){ asmCtx.draft.questions.push(q); });
        asmCtx.dirty = true; closeModal(); drawAsm(); toast('Questions generated — review them before saving.');
      }, 1300);
    };
  }

  /* ================= Course settings drawer ================= */
  function openSettings(){
    var dis = canEdit ? '' : ' disabled', dr = $('setDrawer');
    var cats = ['Uncategorized', 'Compliance', 'Customer Success', 'Finance', 'Leadership', 'Management', 'Product', 'Productivity', 'Safety', 'Sales']; if (cats.indexOf(course.category) < 0) cats.push(course.category);
    function opts(list, v){ return list.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
    dr.innerHTML = '<div class="drawer-h"><h2>Course settings</h2><button class="ib" type="button" data-set="close" aria-label="Close settings">' + I.x + '</button></div><div class="drawer-b">' +
      '<div class="field"><label for="sTitle">Course title <span class="req">*</span></label><input class="input" id="sTitle" maxlength="120" value="' + esc(course.title) + '"' + dis + '><div class="hint" id="sTitleHint"></div></div>' +
      '<div class="field"><label for="sDesc">Description</label><textarea class="input" id="sDesc" maxlength="600"' + dis + '>' + esc(course.description || '') + '</textarea></div>' +
      '<div class="field"><label for="sCat">Category</label><select class="select" id="sCat"' + dis + '>' + opts(cats, course.category) + '</select></div>' +
      '<div class="field"><label for="sEnroll">Enrollment</label><select class="select" id="sEnroll"' + dis + '>' + opts(['Manager-assigned', 'Open', 'Invite-only'], course.enrollment || 'Manager-assigned') + '</select></div>' +
      '<div class="field"><label for="sDone">Completion criteria</label><select class="select" id="sDone"' + dis + '>' + opts(['All lessons', 'Specific lessons', 'Minimum score'], course.completion || 'All lessons') + '</select></div>' +
      '<div class="field"><label for="sOrder">Lesson order</label><select class="select" id="sOrder"' + dis + '><option value="free"' + (course.sequential ? '' : ' selected') + '>Any order — lock individual lessons if needed</option><option value="seq"' + (course.sequential ? ' selected' : '') + '>Sequential — each lesson unlocks after the previous one</option></select><div class="hint">With sequential order, learners must complete lesson N before opening lesson N+1. You can also lock single lessons in Lesson settings.</div></div>' +
      '<p class="hint">Thumbnail, prerequisites and visibility settings aren\'t designed yet. Version history (CRS-008) isn\'t built yet, so restoring earlier versions isn\'t available.</p></div>';
    dr.classList.add('open'); dr.setAttribute('aria-hidden', 'false'); $('drawerBack').hidden = false;
    setTimeout(function(){ dr.querySelector('[data-set="close"]').focus(); }, 60);
    if (!canEdit) return;
    $('sTitle').addEventListener('input', function(e){ var v = e.target.value.trim(), h = $('sTitleHint'); e.target.classList.toggle('invalid', !v); h.className = 'hint' + (v ? '' : ' error'); h.textContent = v ? '' : 'A course needs a title. Your previous title is kept until you add one.'; if (!v) return; course.title = v; $('courseTitle').textContent = v; $('courseTitle').title = v; dirty(); });
    $('sDesc').addEventListener('input', function(e){ course.description = e.target.value; dirty(); });
    $('sOrder').addEventListener('change', function(e){ course.sequential = e.target.value === 'seq'; dirty(); renderTree(); refreshMeta(); renderProps(); });
    ['sCat:category', 'sEnroll:enrollment', 'sDone:completion'].forEach(function(p){ var x = p.split(':'); $(x[0]).addEventListener('change', function(e){ course[x[1]] = e.target.value; dirty(); }); });
  }
  /* Requested changes (CRS-013-FR-07 / CRS-014-FR-04) */
  function openFeedback(){
    var dr = $('fbDrawer'), ap = course.approval;
    dr.innerHTML = '<div class="drawer-h"><h2>Changes requested</h2><button class="ib" type="button" data-fb="close" aria-label="Close">' + I.x + '</button></div><div class="drawer-b">' +
      '<p class="hint" style="margin:0 0 8px">Reviewer comment' + (course.feedbackBy ? ' from <b>' + esc(course.feedbackBy) + '</b>' : '') + (course.feedbackAt ? ' · ' + fmtDate(course.feedbackAt) : '') + '</p>' +
      '<blockquote class="fb-quote">' + esc(course.feedback) + '</blockquote>' +
      (ap ? '<dl class="kv" style="margin-bottom:18px"><dt>Returned from</dt><dd>Step ' + ap.step + ' of ' + ap.of + '</dd><dt>Approver</dt><dd>' + esc(ap.approver) + '</dd></dl>' : '') +
      '<div class="psec"><h3>What happens next</h3><ol class="fb-steps"><li>Make the requested changes in the lessons. The course stays editable while changes are requested.</li><li>Submit for approval again. It goes back to the same approval step, not the start.</li></ol></div>' +
      (course.feedbackBy ? '' : '<p class="hint">Reviewer name and date aren\'t available for this course.</p>') +
      '</div><div class="drawer-f"><span class="grow"></span><button class="btn btn-secondary" type="button" data-fb="close">Close</button>' + (canSubmit ? '<button class="btn btn-primary" type="button" data-fb="submit">' + I.send + 'Submit again</button>' : '') + '</div>';
    dr.classList.add('open'); dr.setAttribute('aria-hidden', 'false'); $('drawerBack').hidden = false;
    setTimeout(function(){ dr.querySelector('[data-fb="close"]').focus(); }, 60);
  }
  function closeFeedback(){ $('fbDrawer').classList.remove('open'); $('fbDrawer').setAttribute('aria-hidden', 'true'); if (!$('asmDrawer').classList.contains('open') && !$('setDrawer').classList.contains('open')) $('drawerBack').hidden = true; }
  $('fbDrawer').addEventListener('click', function(e){ var t = e.target.closest('[data-fb]'); if (!t) return; closeFeedback(); if (t.dataset.fb === 'submit') submitFlow(); });
  function closeSettings(){ $('setDrawer').classList.remove('open'); $('setDrawer').setAttribute('aria-hidden', 'true'); if (!$('asmDrawer').classList.contains('open')) $('drawerBack').hidden = true; }
  $('setDrawer').addEventListener('click', function(e){ if (e.target.closest('[data-set="close"]')) closeSettings(); });
  $('drawerBack').onclick = function(){ if ($('fbDrawer').classList.contains('open')) closeFeedback(); else if ($('asmDrawer').classList.contains('open')) closeAsm(); else closeSettings(); };

  /* ================= Preview + Submit ================= */
  function openPreview(){
    if (canEdit && saveState !== 'saved') persistNow();
    if (saveState === 'failed') toast('Preview shows your last saved version — your latest changes aren\'t saved yet.', null, true);
    window.open('course-preview.html?id=' + encodeURIComponent(course.id) + (selLesson ? '&lesson=' + encodeURIComponent(selLesson) : ''), '_blank');
  }
  function submitFlow(){
    if (!persistNow()) return toast('Save your latest changes before submitting.', function(){ submitFlow(); }, true, 'Retry');
    var errs = [], lessons = [], emptyMedia = 0, emptyAsm = 0, untitled = 0;
    course.modules.forEach(function(m){ m.lessons.forEach(function(l){ lessons.push(l); if (!l.title.trim()) untitled++; l.blocks.forEach(function(b){ if (/^(image|video|audio|document|file|embed)$/.test(b.type) && !blockHasContent(b)) emptyMedia++; if (b.type === 'assessment'){ var a = asmById(b.data.assessmentId); if (!a || (a.type !== 'assignment' && !a.questions.length)) emptyAsm++; } }); }); });
    if (!course.title.trim()) errs.push('Add a course title in Settings.');
    if (!lessons.some(lessonHasContent)) errs.push('Add content to at least one lesson.');
    if (untitled) errs.push('Give ' + (untitled === 1 ? '1 lesson' : untitled + ' lessons') + ' a title.');
    if (emptyMedia) errs.push(emptyMedia + (emptyMedia === 1 ? ' media or embed block doesn\'t' : ' media or embed blocks don\'t') + ' have content yet — add it or delete the block.');
    if (emptyAsm) errs.push(emptyAsm + (emptyAsm === 1 ? ' assessment has' : ' assessments have') + ' no questions or couldn\'t be loaded.');
    if (errs.length){ $('modalBody').innerHTML = '<h3 id="modalTitle">Not ready to submit yet</h3><p class="sub">Fix the following, then submit again.</p><div class="alert">' + I.alert + '<ul>' + errs.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></div><div class="modal-foot"><button class="btn btn-primary" type="button" data-close>OK</button></div>'; openModal(); return; }
    var empty = lessons.length - lessons.filter(lessonHasContent).length;
    $('modalBody').innerHTML = '<h3 id="modalTitle">Submit for approval</h3><p class="sub">The course will enter your organization\'s approval workflow. You won\'t be able to edit it while it\'s in review.' + (empty ? ' ' + empty + (empty === 1 ? ' lesson is' : ' lessons are') + ' still empty.' : '') + '</p><label for="subNote" class="lbl">Note to approver (optional)</label><textarea class="input" id="subNote" maxlength="1000" placeholder="Context, changes since last review, or areas to focus on"></textarea><div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" id="doSubmit">Submit</button></div>';
    openModal();
    $('doSubmit').onclick = function(){
      // Workflow + approver are assigned server-side (CRS-012-NFR-01); mock first step
      course.status = 'review'; course.approval = { step:1, of:2, approver:'Priya Shah' }; delete course.feedback;
      canEdit = canSubmit = false; showGenerated = false; selBlock = null; persistNow(true); saveState = 'saved'; closeModal(); render(); toast('Submitted for approval.');
    };
  }

  /* ================= Menus / modal / toast ================= */
  var menuCb = null, menuBtn = null;
  function item(act, icon, label, o){ o = o || {}; return '<button type="button" role="menuitem" data-act="' + act + '"' + (o.danger ? ' class="danger"' : '') + (o.disabled ? ' disabled' : '') + '>' + icon + label + (o.k ? '<span class="k">' + o.k + '</span>' : '') + '</button>'; }
  function openMenu(anchor, html, cb, o){
    o = o || {}; closeMenu();
    var m = $('menu'); m.innerHTML = html; m.hidden = false; menuCb = cb; menuBtn = anchor;
    if (anchor.tagName === 'BUTTON') anchor.setAttribute('aria-expanded', 'true');
    var r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    var left = o.anchorBottom ? r.left : r.right - mw, top = o.anchorBottom ? r.top + Math.min(r.height, 28) + 4 : r.bottom + 6;
    m.style.left = Math.min(Math.max(8, left), innerWidth - mw - 8) + 'px';
    m.style.top = (top + mh > innerHeight - 8 ? Math.max(8, r.top - mh - 6) : top) + 'px';
    if (!o.keepFocus){ var f = m.querySelector('button:not([disabled])'); if (f) f.focus(); }
  }
  function closeMenu(){ if (menuBtn && menuBtn.tagName === 'BUTTON') menuBtn.setAttribute('aria-expanded', 'false'); $('menu').hidden = true; menuCb = null; menuBtn = null; }
  $('menu').addEventListener('mousedown', function(e){ e.preventDefault(); });
  $('menu').addEventListener('click', function(e){ var b = e.target.closest('[data-act]'); if (!b || b.disabled) return; var cb = menuCb; closeMenu(); if (cb) cb(b.dataset.act); });
  document.addEventListener('mousedown', function(e){ if (!$('menu').hidden && !e.target.closest('#menu') && !(menuBtn && menuBtn.contains(e.target))){ slashFor = null; closeMenu(); } });
  function openModal(){ $('modal').classList.add('open'); var b = $('modalBody').querySelector('input:not([type=checkbox]), textarea, .modal-foot .btn-primary:not([disabled]), .modal-foot .btn-danger, .choice'); if (b) setTimeout(function(){ b.focus(); }, 30); }
  function closeModal(){ $('modal').classList.remove('open'); $('modal').querySelector('.modal').style.width = ''; }
  $('modal').addEventListener('click', function(e){ if (e.target === $('modal') || e.target.closest('[data-close]')) closeModal(); });
  function confirmModal(title, body, cta, onOk, primary){
    $('modalBody').innerHTML = '<h3 id="modalTitle">' + title + '</h3><p class="sub">' + body + '</p><div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>Cancel</button><button class="btn ' + (primary ? 'btn-primary' : 'btn-danger') + '" type="button" id="okBtn">' + cta + '</button></div>';
    openModal(); $('okBtn').onclick = onOk;
  }
  var toastTimer;
  function toast(msg, act, isErr, actLabel){
    var t = $('toast'), a = $('toastAct');
    t.querySelector('span').textContent = msg; t.classList.toggle('err', !!isErr); a.hidden = !act; a.textContent = actLabel || 'Undo';
    a.onclick = function(){ t.classList.remove('show'); if (act) act(); };
    t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, act ? 6500 : 3200);
  }
  window.addEventListener('resize', function(){ closeMenu(); closePicker(); posFmt(); });

  var lastMode = ps.value;
  ps.addEventListener('change', function(){
    var was = lastMode; lastMode = ps.value;
    if (ps.value === 'loading' || ps.value === 'error' || !course || was === 'loading' || was === 'error') return boot();
    if (ps.value === 'normal'){ if (saveState === 'failed') persistNow(); return; } // keep in-memory edits
    toast('Preview state: ' + ps.options[ps.selectedIndex].text + '. Try the action now.');
  });
  boot();
</script>
