<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Learner - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Learner — Dashboard (RPT-001-FR-05 learner variant). v5 2026-09-24:
     simplified on user request ("too dense, don't know where to look").
     Three blocks: Continue learning → Coming up → Keep going (other
     in-progress courses, 2026-09-24: replaced the AI tiles row; AI
     tools stay reachable via Your Coach in the sidebar + course pages). Removed: Recent activity (nothing to act on), My progress
     panel (ring, counts, recent results — live on my-courses.html /
     certificates.html / assignments.html), "Also in progress" minis.
     Next up + Upcoming merged into one "Coming up" list (max 4).
     Data mirrors sibling pages: courses = my-courses.html, work =
     assignments.html, sessions = live-sessions.html. Fixed mock
     "today" = Wed Sep 23 2026 (same as those pages).
     Library: Buttons, Progress bar. Course card = same pattern as
     my-courses.html (reused as-is). Hand-built (approved,
     MISSING_COMPONENTS.md): Date tile, Empty state, Skeleton loader,
     First-time learner illustration.
     Demo states (design only): ?state=loading | empty | no-courses |
     no-work | error, or the dashed Preview control bottom-left.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-strong:#404040; --text-secondary:#525252; --text-tertiary:#a3a3a3;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f0f0f0; --border-strong:#a3a3a3;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --action-primary-subtle:#eef2ff; --action-primary-soft:#e0e7ff; --focus-ring:#6366f1;
    --warning:#ca8a04; --error:#dc2626; --error-subtle:#fef2f2; --error-border:#fecaca;
    --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-2xl:16px; --radius-full:999px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,select{ font-family:var(--font); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  [hidden]{ display:none !important; }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; overflow-y:auto; min-width:0; }
  .main-inner{ width:100%; padding:32px clamp(20px, 2.6vw, 48px) 64px; }

  /* Buttons (library) */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:var(--radius-lg); font-size:14px; font-weight:600; border:1px solid transparent; white-space:nowrap; transition:background-color .15s ease, border-color .15s ease; }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .btn-lg{ height:44px; padding:0 18px; font-size:15px; }
  .btn-sm{ height:34px; padding:0 12px; font-size:13.5px; }
  .btn-primary{ background:var(--action-primary); color:#fff; }
  .btn-primary:hover{ background:var(--action-primary-hover); }
  .btn-secondary{ background:#fff; color:var(--text-strong); border-color:var(--border-default); }
  .btn-secondary:hover{ background:var(--surface-raised); }
  .link{ font-size:14px; font-weight:600; color:var(--action-primary); white-space:nowrap; }
  .link:hover{ color:var(--action-primary-hover); text-decoration:underline; }

  /* Greeting */
  .greet{ margin-bottom:32px; }
  .greet h1{ margin:0 0 6px; font-size:clamp(24px, 1.2vw + 14px, 30px); font-weight:700; letter-spacing:-.6px; }
  .greet p{ margin:0; font-size:15.5px; color:var(--text-secondary); line-height:1.5; }
  .greet p b{ color:var(--text-primary); font-weight:600; }

  /* Layout: two blocks side by side, AI row below */
  .stack{ display:flex; flex-direction:column; gap:40px; }
  .grid{ display:grid; grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr); gap:clamp(24px, 2.4vw, 40px); align-items:start; }
  .sec-h{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .sec-h h2{ margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px; }
  .panel{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-2xl); }

  /* 1 · Continue learning */
  .hero{ display:grid; grid-template-columns:minmax(200px, 40%) minmax(0,1fr); overflow:hidden; }
  .thumb{ position:relative; background:#e5e7eb center/cover no-repeat; min-height:260px; }
  .thumb .tag{ position:absolute; left:14px; top:14px; height:26px; padding:0 10px; border-radius:var(--radius-full); background:rgba(255,255,255,.92); font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; color:var(--text-strong); }
  .hero-body{ padding:clamp(22px, 2vw, 32px); display:flex; flex-direction:column; min-width:0; }
  .hero h3{ margin:0; font-size:clamp(20px, .8vw + 14px, 26px); font-weight:700; letter-spacing:-.5px; line-height:1.2; }
  .next{ margin:10px 0 0; font-size:15px; line-height:1.5; color:var(--text-secondary); }
  .next b{ color:var(--text-primary); font-weight:600; }
  .prog{ margin-top:22px; }
  .prog-row{ display:flex; justify-content:space-between; gap:12px; font-size:13.5px; color:var(--text-secondary); margin-bottom:8px; }
  .prog-row b{ color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .bar{ height:8px; border-radius:var(--radius-full); background:var(--surface-overlay); overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:inherit; background:var(--action-primary); }
  .hero-acts{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:auto; padding-top:26px; }

  /* 2 · Coming up — whole row is the link (Date tile, approved) */
  .list{ list-style:none; margin:0; padding:6px; }
  .up{ display:grid; grid-template-columns:44px minmax(0,1fr) 16px; gap:14px; align-items:center; padding:10px; border-radius:var(--radius-xl); }
  .up:hover{ background:var(--surface-canvas); }
  .up:hover .t{ color:var(--action-primary); }
  .up > svg{ width:16px; height:16px; color:var(--text-tertiary); }
  .tile{ width:44px; padding:5px 0; border:1px solid var(--border-default); border-radius:var(--radius-lg); text-align:center; line-height:1.1; background:#fff; }
  .tile small{ display:block; font-size:11px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; }
  .tile b{ display:block; font-size:15px; font-weight:700; margin-top:1px; }
  .tile.late{ border-color:var(--error-border); background:var(--error-subtle); }
  .tile.late small, .tile.late b{ color:var(--error); }
  .up .t{ display:block; font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up .m{ display:block; font-size:13.5px; color:var(--text-secondary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up .m .late{ color:var(--error); font-weight:600; }

  /* 3 · Keep going — course card, same as my-courses.html */
  .course-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:24px; }
  .course-card{ display:flex; flex-direction:column; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); overflow:hidden; transition:border-color .2s ease; }
  .course-card:hover{ border-color:var(--border-strong); }
  .course-photo-wrap{ position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--surface-raised); }
  .course-photo{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s var(--ease); }
  .course-card:hover .course-photo{ transform:scale(1.05); }
  .course-photo-tag{ position:absolute; left:12px; top:12px; font-size:11.5px; font-weight:600; color:#fff; background:rgba(15,15,15,.5); backdrop-filter:blur(8px); padding:4px 10px; border-radius:var(--radius-md); }
  .course-card-body{ padding:18px; display:flex; flex-direction:column; flex:1; }
  .course-card-title{ font-size:16px; font-weight:700; line-height:1.3; letter-spacing:-.2px; text-wrap:balance; }
  .course-card-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--text-tertiary); margin-top:6px; }
  .course-card-meta .dot{ width:3px; height:3px; border-radius:50%; background:#d4d4d4; }
  .course-card-meta .mandatory{ color:var(--warning); font-weight:600; }
  .course-card-foot{ margin-top:auto; padding-top:18px; }
  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-bar-bg{ flex:1; height:6px; background:var(--surface-overlay); border-radius:var(--radius-full); overflow:hidden; }
  .progress-bar-fill{ height:100%; border-radius:var(--radius-full); background:var(--action-primary); }
  .progress-val{ font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .card-action{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:13.5px; font-weight:600; color:var(--action-primary); }
  .card-action svg{ width:16px; height:16px; transition:transform .2s var(--ease); }
  .course-card:hover .card-action svg{ transform:translateX(3px); }

  /* States (Empty state + Skeleton, approved) */
  .empty-in{ padding:36px 24px; text-align:center; }
  .empty-in b{ display:block; font-size:15.5px; margin-bottom:4px; }
  .empty-in span{ display:block; font-size:14px; color:var(--text-tertiary); line-height:1.5; max-width:420px; margin:0 auto; }
  .empty-in .btn{ margin-top:16px; }
  .err{ padding:18px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .err svg{ width:20px; height:20px; color:var(--error); flex-shrink:0; }
  .err div{ flex:1; min-width:200px; font-size:14px; color:var(--text-secondary); }
  .err b{ display:block; color:var(--text-primary); font-size:15px; }
  .sk{ display:block; height:12px; border-radius:4px; background:linear-gradient(90deg, #f3f3f3 25%, #e9e9e9 50%, #f3f3f3 75%); background-size:200% 100%; animation:loading 1.4s infinite; }
  .sk + .sk{ margin-top:10px; }
  @keyframes loading{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

  /* First-time learner (illustration hand-built, approved 2026-09-24) */
  .welcome{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px, 4vw, 72px); align-items:center; padding:clamp(28px, 4vw, 64px); }
  .welcome h2{ margin:0 0 12px; font-size:clamp(24px, 1.2vw + 14px, 34px); letter-spacing:-.7px; line-height:1.15; }
  .welcome p{ margin:0 0 26px; font-size:16px; line-height:1.6; color:var(--text-secondary); max-width:460px; }
  .welcome .acts{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .illo{ width:100%; max-width:440px; height:auto; justify-self:center; }
  .illo .float{ animation:float 4s ease-in-out infinite; }
  .illo .float.b{ animation-delay:-2s; }
  .illo .twinkle{ animation:twinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .illo .twinkle.b{ animation-delay:-1.3s; }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  @keyframes twinkle{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.7); opacity:.5; } }

  /* Preview control (design only — same pattern as live-sessions.html) */
  .preview{ position:fixed; left:12px; bottom:12px; z-index:50; display:flex; align-items:center; gap:6px; padding:4px 4px 4px 10px; border:1px dashed #a3a3a3; border-radius:var(--radius-md); background:rgba(250,250,250,.92); font:500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color:#737373; }
  @media (min-width:901px){ .preview{ left:244px; } }
  .preview select{ font:inherit; color:#404040; border:1px solid #e5e5e5; border-radius:4px; background:#fff; padding:3px 4px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  @media (max-width:1080px){ .grid{ grid-template-columns:1fr; } }
  @media (max-width:760px){
    .hero{ grid-template-columns:1fr; }
    .thumb{ min-height:0; aspect-ratio:16/8; }
    .welcome{ grid-template-columns:1fr; }
    .illo{ max-width:300px; grid-row:1; }
    .stack{ gap:32px; }
  }

  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:25; }
  @media (max-width:900px){
    .shell{ grid-template-columns:0 1fr; }
    .topbar-frame{ grid-column:1/-1; }
    .main{ grid-column:1/-1; }
    .main-inner{ padding:22px 16px 48px; }
    .sidebar-frame{ position:fixed; top:0; left:0; width:260px; height:100vh; z-index:30; transform:translateX(-100%); transition:transform .25s ease; box-shadow:4px 0 24px rgba(0,0,0,.12); }
    .shell.sidebar-collapsed .sidebar-frame{ transform:translateX(0); }
    .shell.sidebar-collapsed .sidebar-backdrop{ display:block; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar-backdrop" onclick="document.querySelector('.shell').classList.remove('sidebar-collapsed')"></div>
  <iframe class="sidebar-frame" src="../component/sidebar.html?active=dashboard" title="Learner navigation"></iframe>
  <iframe class="topbar-frame" src="../component/topnavbar.html?current=Dashboard" title="Top bar"></iframe>
  <main class="main"><div class="main-inner" id="root" aria-live="polite"></div></main>
</div>

<label class="preview" title="Design-only: preview dashboard states. Not shown to learners.">Preview
  <select id="previewState">
    <option value="normal">Normal</option>
    <option value="empty">First-time learner</option>
    <option value="loading">Loading</option>
    <option value="no-courses">No active courses</option>
    <option value="no-work">No upcoming work</option>
    <option value="error">Error</option>
  </select>
</label>

<script>
  window.addEventListener('message', function(e){
    if (e.data === 'toggle-sidebar') document.querySelector('.shell').classList.toggle('sidebar-collapsed');
  });

  /* ---------------- Data (mirrors sibling learner pages) ---------------- */
  var NAME = 'Sophia';
  // Most recently accessed in-progress course (my-courses.html lastAccessedSort)
  var COURSE = { id:'CS-301', title:'Advanced Data Structures', tag:'Computer Science', photo:'https://images.unsplash.com/photo-1504639725590-34d0984388bd?auto=format&fit=crop&w=800&h=450&q=70', progress:68, done:14, total:21, lesson:'Tree traversals: in-order, pre-order, post-order', left:'9 min left', deadline:'Sep 30' };

  // Other in-progress courses, most recently accessed next (my-courses.html)
  var U = function(id){ return 'https://images.unsplash.com/photo-' + id + '?auto=format&fit=crop&w=800&h=450&q=70'; };
  var OTHERS = [
    { id:'DS-210', title:'Data Visualization Techniques', tag:'Analytics', photo:U('1556155092-490a1ba16284'), progress:77, mandatory:true, deadline:'Oct 3' },
    { id:'WEB-303', title:'Modern Web Architecture', tag:'Web Development', photo:U('1517694712202-14dd9538aa97'), progress:52 },
    { id:'AI-101', title:'Intro to Machine Learning', tag:'Machine Learning', photo:U('1509228468518-180dd4864904'), progress:34 },
    { id:'MOB-201', title:'iOS App Development Basics', tag:'Mobile', photo:U('1512941937669-90a1b58e7e9c'), progress:18 }
  ];

  // Coming up — merged Next up + Upcoming, soonest first, max 4
  // (assignments.html a3/a1, live-sessions.html s1/s4)
  var COMING = [
    { mon:'Sep', day:'20', late:true, title:'Interaction Prototype', meta:'<span class="late">Overdue</span> · submit by Sep 27', href:'assignment-detail.html?id=a3' },
    { mon:'Sep', day:'23', title:'Graph Algorithms Q&amp;A', meta:'Today · 1:30 PM · Live on Zoom', href:'live-session-detail.html?id=s1' },
    { mon:'Sep', day:'23', title:'Data Structures Lab', meta:'Today · 5:05 PM · Google Meet', href:'live-session-detail.html?id=s4' },
    { mon:'Sep', day:'24', title:'Trees &amp; Graphs Assignment', meta:'Due tomorrow · 11:59 PM', href:'assignment-detail.html?id=a1' }
  ];

  var I = {
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>'
  };
  var $ = function(id){ return document.getElementById(id); };
  function greeting(){ var h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

  /* ---------------- Sections ---------------- */
  function continueLearning(state){
    if (state === 'loading') return '<div class="panel hero"><div class="thumb" style="background:#f0f0f0"></div><div class="hero-body"><span class="sk" style="width:70%;height:22px"></span><span class="sk" style="width:55%"></span><span class="sk" style="width:100%;margin-top:28px"></span></div></div>';
    if (state === 'error') return '<div class="panel err" role="alert">' + I.alert + '<div><b>Couldn\'t load your courses.</b>Check your connection and try again.</div><button class="btn btn-secondary btn-sm" type="button" data-retry>Try again</button></div>';
    if (state === 'no-courses') return '<div class="panel empty-in"><b>You\'re not in the middle of a course.</b><span>You\'ve finished everything you started. Pick up a new course or review one you completed.</span><a class="btn btn-primary" href="my-courses.html">Browse My Courses</a></div>';
    var c = COURSE;
    return '<div class="panel hero">' +
      '<div class="thumb" style="background-image:url(' + c.photo + ')" role="img" aria-label="' + c.title + ' cover"><span class="tag">' + c.tag + '</span></div>' +
      '<div class="hero-body">' +
        '<h3>' + c.title + '</h3>' +
        '<p class="next">Next: <b>' + c.lesson + '</b> · ' + c.left + '</p>' +
        '<div class="prog"><div class="prog-row"><span>' + c.progress + '% complete · due ' + c.deadline + '</span><b>' + c.done + ' / ' + c.total + ' lessons</b></div><div class="bar" role="progressbar" aria-label="Course progress" aria-valuenow="' + c.progress + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + c.progress + '%"></i></div></div>' +
        '<div class="hero-acts"><a class="btn btn-primary btn-lg" href="course-player.html?id=' + c.id + '">Continue lesson' + I.arrow + '</a><a class="link" href="course-overview.html?id=' + c.id + '">Course overview</a></div>' +
      '</div></div>';
  }

  function comingUp(state){
    if (state === 'loading') return '<div class="panel" style="padding:20px"><span class="sk" style="width:60%"></span><span class="sk" style="width:80%"></span><span class="sk" style="width:50%"></span></div>';
    if (state === 'error') return '<div class="panel err" role="alert">' + I.alert + '<div><b>Couldn\'t load your schedule.</b>Assignments and sessions will show here once this loads.</div><button class="btn btn-secondary btn-sm" type="button" data-retry>Try again</button></div>';
    if (state === 'no-work') return '<div class="panel empty-in"><b>You\'re all caught up.</b><span>Nothing is due and no sessions are scheduled this week.</span></div>';
    return '<ul class="panel list">' + COMING.map(function(u){
      return '<li><a class="up" href="' + u.href + '"><span class="tile' + (u.late ? ' late' : '') + '"><small>' + u.mon + '</small><b>' + u.day + '</b></span><div style="min-width:0"><span class="t">' + u.title + '</span><span class="m">' + u.meta + '</span></div>' + I.chev + '</a></li>';
    }).join('') + '</ul>';
  }

  function keepGoing(state){
    if (state === 'loading') return '<div class="course-grid">' + [0,1,2,3].map(function(){ return '<div class="course-card"><div class="course-photo-wrap"></div><div class="course-card-body"><span class="sk" style="width:75%"></span><span class="sk" style="width:45%"></span><span class="sk" style="margin-top:24px"></span></div></div>'; }).join('') + '</div>';
    return '<div class="course-grid">' + OTHERS.map(function(c){
      var meta = [c.mandatory ? '<span class="mandatory">Mandatory</span>' : 'Optional'];
      if (c.deadline) meta.push('Due ' + c.deadline);
      return '<a class="course-card" href="course-overview.html?id=' + c.id + '">' +
        '<div class="course-photo-wrap"><img class="course-photo" src="' + c.photo + '" alt="' + c.title + ' course thumbnail" loading="lazy"><span class="course-photo-tag">' + c.tag + '</span></div>' +
        '<div class="course-card-body"><div class="course-card-title">' + c.title + '</div><div class="course-card-meta">' + meta.join('<span class="dot"></span>') + '</div>' +
          '<div class="course-card-foot"><div class="progress-row"><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + c.progress + '%;"></div></div><span class="progress-val">' + c.progress + '%</span></div>' +
          '<div class="card-action"><span>Continue</span>' + I.arrow + '</div></div></div></a>';
    }).join('') + '</div>';
  }

  // ponytail: static inline SVG in library indigo palette; swap for brand artwork when the library gets an illustration set
  var ILLO = '<svg class="illo" viewBox="0 0 360 280" role="img" aria-label="An open book with a course card and sparkles floating above it">' +
    '<circle cx="180" cy="140" r="122" fill="#eef2ff"/>' +
    '<ellipse cx="180" cy="236" rx="118" ry="9" fill="#e0e7ff"/>' +

  function firstTime(){
    return '<div class="panel welcome"><div>' +
        '<h2>Your learning journey starts here.</h2>' +
        '<p>When you\'re assigned or enroll in a course, your next lesson and what\'s due will show up right here.</p>' +
        '<div class="acts"><a class="btn btn-primary btn-lg" href="my-courses.html">View My Courses' + I.arrow + '</a><a class="link" href="coach.html">Ask Your Coach</a></div>' +
      '</div>' + ILLO + '</div>';
  }

  /* ---------------- Page ---------------- */
  function render(state){
    var sub;
    if (state === 'empty') sub = 'Welcome to UpSpace.';
    else if (state === 'loading') sub = 'Getting your learning ready…';
    else if (state === 'no-work') sub = 'Nothing is due right now. A good moment to keep going.';
    else if (state === 'no-courses') sub = 'Ready to start something new?';
    else if (state === 'error') sub = 'Some of your information didn\'t load.';
    else sub = 'You have <b>1 overdue assignment</b> and <b>2 live sessions today</b>.';
    var head = '<header class="greet"><h1>' + greeting() + ', ' + NAME + '</h1><p>' + sub + '</p></header>';

    if (state === 'empty'){ $('root').innerHTML = head + firstTime(); return; }

    $('root').innerHTML = head + '<div class="stack">' +
      '<div class="grid">' +
        '<section aria-labelledby="h-cont"><div class="sec-h"><h2 id="h-cont">Continue learning</h2></div>' + continueLearning(state) + '</section>' +
        '<section aria-labelledby="h-up"><div class="sec-h"><h2 id="h-up">Coming up</h2><a class="link" href="assignments.html">All work</a></div>' + comingUp(state) + '</section>' +
      '</div>' +
      (state === 'error' || state === 'no-courses' ? '' : '<section aria-labelledby="h-keep"><div class="sec-h"><h2 id="h-keep">Keep going</h2><a class="link" href="my-courses.html">All courses</a></div>' + keepGoing(state) + '</section>') +
    '</div>';
  }

  var ps = $('previewState');
  var initial = new URLSearchParams(location.search).get('state') || 'normal';
  ps.value = initial;
  ps.addEventListener('change', function(){ render(ps.value); });
  document.addEventListener('click', function(e){ if (e.target.closest('[data-retry]')){ ps.value = 'normal'; render('normal'); } });
  render(initial);
</script>
