<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Learner — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Learner — Quiz assignment (ASM-005 take assessment, ASM-006 results).
     Opened from assignments.html for quiz-type rows (?id=q1…q3).
     States, driven by the quiz config + saved attempt:
       Intro → "Start quiz" / "Resume quiz" (timer starts on Start, FR-03)
       Taking → one question per page + question navigator (FR-01),
         answers auto-save on every change and navigation (FR-04)
       Review → answered / unanswered list (FR-05). User decision:
         Submit stays disabled until every question is answered. Timer expiry
         still auto-submits whatever is saved (FR-03).
       Result → score, pass/fail, time taken; per-question breakdown only
         when visibility = answers (ASM-006-FR-02/05/06); hidden → not released
     Quiz = objective questions only (ASM-002-FR-01): MCQ, multiple select,
     true/false, fill-in-the-blank, image-based.
     Library: Breadcrumbs, Badge (dot), Buttons, Radio group item (radio +
     checkbox), Input field, Progress bar, Alerts, Modal, Toast. Hand-built
     (approved, MISSING_COMPONENTS.md): Question navigator, learner question
     render (course-preview.html .opt), Empty state.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-strong:#404040; --text-secondary:#525252; --text-tertiary:#a3a3a3; --text-disabled:#d4d4d4;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f5f5f5; --border-popover:#d4d4d4;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --action-primary-subtle:#eef2ff; --action-primary-soft:#e0e7ff; --focus-ring:#6366f1;
    --error:#dc2626; --error-subtle:#fef2f2; --error-border:#fecaca;
    --warning:#ca8a04; --warning-subtle:#fefce8; --warning-border:#fef08a;
    --success:#15803d; --success-subtle:#f0fdf4; --success-soft:#dcfce7; --success-border:#bbf7d0;
    --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-xl:12px; --radius-full:999px;
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,input{ font-family:var(--font); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  [hidden]{ display:none !important; }
  svg{ flex-shrink:0; }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; overflow-y:auto; min-width:0; }
  .main-inner{ width:100%; padding:24px clamp(20px, 2.6vw, 48px) 64px; }

  /* Buttons — library sizes (md 40 / lg 44) */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:var(--radius-lg); font-size:14px; font-weight:500; border:none; white-space:nowrap; transition:background-color .15s ease, transform .1s ease; }
  .btn:active{ transform:scale(.98); }
  .btn svg{ width:16px; height:16px; }
  .btn-lg{ height:44px; padding:0 18px; font-size:14px; }
  .btn-primary{ background:var(--action-primary); color:#fff; }
  .btn-primary:hover{ background:var(--action-primary-hover); }
  .btn-secondary{ background:#fff; color:var(--text-strong); border:1px solid #d4d4d4; }
  .btn-secondary:hover{ background:var(--surface-raised); }
  .btn:disabled, .btn[aria-disabled="true"]{ background:var(--surface-overlay); color:var(--text-tertiary); border-color:transparent; cursor:not-allowed; transform:none; }
  .btn-primary.busy{ background:var(--action-primary); color:#fff; opacity:.75; }
  .btn-block{ width:100%; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Breadcrumbs — library */
  .crumbs{ display:flex; align-items:center; gap:6px; font-size:14px; margin-bottom:18px; min-width:0; }
  .crumbs a{ color:var(--text-secondary); font-weight:500; white-space:nowrap; }
  .crumbs a:hover{ color:var(--text-primary); }
  .crumbs svg{ width:16px; height:16px; color:var(--text-disabled); }
  .crumbs > span{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Head */
  .head{ margin-bottom:24px; }
  .eyebrow{ font-size:14px; color:var(--text-secondary); }
  .eyebrow a{ font-weight:600; color:var(--text-primary); }
  .eyebrow a:hover{ color:var(--action-primary); }
  .head h1{ margin:6px 0 0; font-size:clamp(28px, 2.2vw, 32px); font-weight:700; letter-spacing:-.6px; line-height:1.2; text-wrap:balance; }

  /* Layout */
  .layout{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:clamp(24px, 2.4vw, 36px); align-items:start; }
  .side{ position:sticky; top:0; }
  .stack{ display:flex; flex-direction:column; gap:20px; min-width:0; }

  /* Status — Badge (dot), same vocabulary as assignments.html */
  .status{ display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--text-strong); }
  .status i{ width:8px; height:8px; border-radius:50%; background:var(--text-disabled); }
  .status.todo i{ background:transparent; box-shadow:inset 0 0 0 1.5px var(--text-tertiary); }
  .status.in-progress i{ background:var(--action-primary); }
  .status.submitted i{ background:var(--text-tertiary); }
  .status.graded i{ background:var(--success); }
  .status.overdue, .status.closed{ color:var(--error); }
  .status.overdue i, .status.closed i{ background:var(--error); }

  .card{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); }
  .summary{ padding:20px; }
  .summary .status{ font-size:16px; }
  .summary dl{ margin:16px 0 18px; display:grid; grid-template-columns:auto 1fr; gap:10px 16px; font-size:14px; }
  .summary dt{ color:var(--text-tertiary); }
  .summary dd{ margin:0; text-align:right; font-weight:700; color:var(--text-strong); font-variant-numeric:tabular-nums; }
  .summary dd small{ display:block; font-weight:500; font-size:12px; color:var(--text-tertiary); }
  .summary dd.late small{ color:var(--error); }
  .summary .note{ margin:12px 0 0; font-size:14px; line-height:1.5; color:var(--text-secondary); }
  .summary .actions{ display:grid; gap:8px; }

  .section{ padding:22px 24px; }
  .section h2{ margin:0 0 14px; font-size:16px; font-weight:700; letter-spacing:-.2px; outline:none; }
  .prose{ max-width:72ch; font-size:16px; line-height:1.65; color:var(--text-strong); }
  .prose p{ margin:0 0 12px; }
  .prose ul{ margin:0 0 12px; padding-left:22px; }
  .prose li{ margin:4px 0; }
  .prose > :last-child{ margin-bottom:0; }

  /* Alerts — library, tinted by feedback family */
  .alert{ display:flex; gap:12px; padding:14px 16px; border-radius:var(--radius-lg); border:1px solid var(--border-default); background:#fff; font-size:14px; line-height:1.5; color:var(--text-strong); flex-wrap:wrap; }
  .alert > svg{ width:20px; height:20px; margin-top:1px; color:var(--text-secondary); }
  .alert > div{ flex:1; min-width:200px; }
  .alert b{ display:block; font-weight:600; color:var(--text-primary); }
  .alert.error{ background:var(--error-subtle); border-color:var(--error-border); }
  .alert.error > svg{ color:var(--error); }
  .alert.warning{ background:var(--warning-subtle); border-color:var(--warning-border); }
  .alert.warning > svg{ color:var(--warning); }
  .alert .act{ align-self:center; }

  /* Question */
  .qcard{ padding:24px 28px; }
  .q-meta{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:14px; color:var(--text-tertiary); }
  .q-meta b{ color:var(--text-strong); font-weight:600; }
  .q-prompt{ margin:10px 0 20px; font-size:20px; font-weight:600; line-height:1.45; letter-spacing:-.2px; max-width:68ch; outline:none; }
  .q-fig{ margin:0 0 20px; width:min(360px, 100%); padding:12px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:var(--surface-canvas); }
  .q-fig svg{ display:block; width:100%; height:auto; }
  /* Radio group item (Radio button / Checkbox) — reuses the approved learner question render (course-preview.html .opt) */
  .opts{ display:grid; gap:8px; max-width:640px; }
  .opt{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border-default); border-radius:var(--radius-lg); font-size:16px; line-height:1.4; cursor:pointer; background:#fff; transition:border-color .15s ease, background-color .15s ease; }
  .opt:hover{ background:var(--surface-canvas); }
  .opt input{ width:17px; height:17px; accent-color:var(--action-primary); margin:0; flex-shrink:0; }
  .opt:has(input:checked){ border-color:var(--action-primary); background:var(--action-primary-subtle); }
  .opt:has(input:focus-visible){ outline:2px solid var(--focus-ring); outline-offset:2px; }
  .opt input:focus-visible{ outline:none; }
  /* Input field — library */
  .input{ width:100%; max-width:480px; height:44px; padding:0 14px; border:1px solid #d4d4d4; border-radius:var(--radius-lg); font-size:16px; outline:none; background:#fff; color:var(--text-primary); }
  .input::placeholder{ color:var(--text-tertiary); }
  .input:focus{ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .q-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:28px; padding-top:18px; border-top:1px solid var(--border-subtle); }

  /* Side panel: timer, progress, navigator */
  .panel{ padding:20px; }
  .timer{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; margin-bottom:18px; border-radius:var(--radius-lg); background:var(--surface-canvas); border:1px solid var(--border-default); font-size:14px; color:var(--text-secondary); }
  .timer span{ display:flex; align-items:center; gap:8px; }
  .timer svg{ width:16px; height:16px; }
  .timer b{ font-size:20px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .timer.low{ background:var(--warning-subtle); border-color:var(--warning-border); color:#854d0e; }
  .timer.low b{ color:#854d0e; }
  .prog-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:14px; color:var(--text-secondary); margin-bottom:8px; }
  .prog-row b{ font-size:16px; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  /* Progress bar — library */
  .progress-bar-bg{ height:8px; background:var(--surface-overlay); border-radius:var(--radius-full); overflow:hidden; }
  .progress-bar-fill{ height:100%; background:var(--action-primary); border-radius:var(--radius-full); transition:width .25s ease; }
  /* Question navigator (hand-built, approved 2026-10-31) */
  .qnav{ display:grid; grid-template-columns:repeat(auto-fill, minmax(40px, 1fr)); gap:6px; margin:18px 0 12px; }
  .qn{ height:40px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:#fff; font-size:14px; font-weight:600; color:var(--text-secondary); font-variant-numeric:tabular-nums; transition:background-color .15s ease, border-color .15s ease; }
  .qn:hover{ background:var(--surface-raised); }
  .qn.done{ background:var(--action-primary-subtle); border-color:var(--action-primary-soft); color:var(--action-primary); }
  .qn.cur{ border-color:var(--action-primary); box-shadow:inset 0 0 0 1px var(--action-primary); }
  .legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--text-tertiary); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:12px; height:12px; border-radius:3px; border:1px solid var(--border-default); background:#fff; }
  .legend i.done{ background:var(--action-primary-subtle); border-color:var(--action-primary-soft); }
  .legend i.cur{ border-color:var(--action-primary); box-shadow:inset 0 0 0 1px var(--action-primary); }
  .saved{ display:flex; align-items:center; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border-subtle); font-size:14px; color:var(--text-secondary); }
  .saved svg{ width:16px; height:16px; color:var(--success); }
  .panel .btn-block{ margin-top:16px; }

  /* Review list */
  .r-intro{ margin:-6px 0 16px; font-size:14px; line-height:1.5; color:var(--text-secondary); }
  .rlist{ list-style:none; margin:0; padding:0; border:1px solid var(--border-default); border-radius:var(--radius-lg); }
  .alert + .rlist{ margin-top:16px; }
  .rlist li + li{ border-top:1px solid var(--border-default); }
  .rlist button{ width:100%; display:flex; align-items:center; gap:14px; padding:12px 14px; border:0; background:transparent; text-align:left; font-size:14px; color:var(--text-strong); }
  .rlist button:hover{ background:var(--surface-canvas); }
  .rlist .n{ width:24px; color:var(--text-tertiary); font-weight:600; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .rlist .p{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rlist .st{ display:inline-flex; align-items:center; gap:6px; font-weight:600; white-space:nowrap; }
  .rlist .st svg{ width:16px; height:16px; }
  .rlist .st.ok{ color:var(--success); }
  .rlist .st.no{ color:#854d0e; }
  .r-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:22px; padding-top:18px; border-top:1px solid var(--border-subtle); }
  .r-foot .hint{ font-size:14px; color:var(--text-secondary); }
  .r-foot .acts{ display:flex; gap:8px; margin-left:auto; }

  /* Result */
  .grade{ display:flex; align-items:flex-end; gap:12px 28px; flex-wrap:wrap; }
  .score{ font-size:40px; font-weight:700; letter-spacing:-1.2px; line-height:1; font-variant-numeric:tabular-nums; }
  .score small{ font-size:20px; font-weight:600; color:var(--text-tertiary); letter-spacing:-.3px; }
  .grade-meta{ font-size:14px; color:var(--text-secondary); line-height:1.6; padding-bottom:2px; }
  .grade-meta b{ color:var(--success); font-weight:600; }
  .grade-meta b.fail{ color:var(--error); }
  .waiting{ display:flex; gap:14px; align-items:flex-start; }
  .waiting .ic{ width:40px; height:40px; border-radius:50%; background:var(--surface-raised); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .waiting .ic svg{ width:20px; height:20px; }
  .waiting b{ display:block; font-size:16px; }
  .waiting span{ display:block; font-size:14px; color:var(--text-secondary); margin-top:3px; line-height:1.5; }
  .muted{ margin:0; font-size:14px; color:var(--text-tertiary); }
  .bd{ list-style:none; margin:0; padding:0; }
  .bq{ padding:18px 0; border-top:1px solid var(--border-subtle); }
  .bq:first-child{ border-top:0; padding-top:4px; }
  .bq-h{ display:flex; gap:10px; font-size:16px; font-weight:600; line-height:1.5; margin-bottom:12px; }
  .bq-h .n{ color:var(--text-tertiary); font-variant-numeric:tabular-nums; }
  .bq-h .pts{ margin-left:auto; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bq-h .pts.right{ color:var(--success); } .bq-h .pts.wrong{ color:var(--error); }
  .bq .opts{ gap:6px; }
  .bq .opt{ cursor:default; font-size:14px; padding:10px 12px; }
  .bq .opt:hover{ background:#fff; }
  .bq .opt svg, .bq .opt .mk{ width:16px; height:16px; }
  .bq .opt em{ margin-left:auto; font-style:normal; font-size:12px; font-weight:600; white-space:nowrap; }
  .bq .opt.right{ border-color:var(--success-border); background:var(--success-subtle); }
  .bq .opt.right svg, .bq .opt.right em{ color:var(--success); }
  .bq .opt.wrong{ border-color:var(--error-border); background:var(--error-subtle); }
  .bq .opt.wrong svg, .bq .opt.wrong em{ color:var(--error); }
  .bq .q-fig{ width:min(280px, 100%); }
  .ans-line{ display:flex; gap:12px; font-size:14px; padding:4px 0; }
  .ans-line span{ width:110px; flex-shrink:0; color:var(--text-tertiary); }
  .ans-line b{ font-weight:600; }
  .ans-line b.right{ color:var(--success); } .ans-line b.wrong{ color:var(--error); }

  /* Empty state (hand-built, approved) */
  .empty{ padding:24px 16px; text-align:center; border:1px dashed var(--border-default); border-radius:var(--radius-lg); }
  .empty b{ display:block; font-size:16px; }
  .empty span{ display:block; margin-top:3px; font-size:14px; color:var(--text-tertiary); }
  .empty .btn{ margin-top:14px; }

  /* Modal — library (white, r12, 24 padding, heading 18 bold, actions right) */
  .overlay{ position:fixed; inset:0; z-index:80; background:rgba(10,10,10,.5); display:flex; align-items:center; justify-content:center; padding:16px; animation:popIn .18s ease both; }
  .modal{ width:min(440px, 100%); background:#fff; border-radius:var(--radius-xl); padding:24px; box-shadow:0 24px 48px rgba(10,10,10,.18); }
  .modal h3{ margin:0; font-size:18px; font-weight:700; }
  .modal p{ margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--text-secondary); }
  .modal .acts{ display:flex; justify-content:flex-end; gap:8px; margin-top:22px; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }

  /* Toast — library (Success / Warning: #f5f5f5, r8, round icon) */
  .toast{ position:fixed; right:24px; bottom:24px; z-index:90; display:flex; align-items:center; gap:12px; padding:10px 14px 10px 10px; min-width:260px; max-width:min(440px, calc(100vw - 32px)); background:var(--surface-raised); border:1px solid var(--border-default); border-radius:var(--radius-lg); font-size:14px; font-weight:500; line-height:1.4; color:var(--text-primary); box-shadow:0 8px 24px rgba(23,23,17,.08); animation:popIn .2s ease both; }
  .toast .ic{ width:32px; height:32px; border-radius:50%; background:var(--success-soft); color:var(--success); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .toast .ic.warn{ background:var(--warning-subtle); color:var(--warning); }
  .toast .ic svg{ width:15px; height:15px; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  @media (max-width:1100px){
    .layout{ grid-template-columns:1fr; }
    .side{ position:static; order:-1; }
    .qnav{ grid-template-columns:repeat(auto-fill, 40px); }
  }
  @media (max-width:640px){
    .section, .qcard, .panel, .summary{ padding:18px 16px; }
    .q-prompt{ font-size:18px; }
    .q-foot .btn{ flex:1; padding:0 10px; }
    .r-foot .acts{ width:100%; }
    .r-foot .acts .btn{ flex:1; padding:0 10px; }
    .toast{ left:16px; right:16px; bottom:16px; }
  }

  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:25; }
  @media (max-width:900px){
    .shell{ grid-template-columns:0 1fr; }
    .topbar-frame{ grid-column:1/-1; }
    .main{ grid-column:1/-1; }
    .main-inner{ padding:20px 16px 40px; }
    .sidebar-frame{ position:fixed; top:0; left:0; width:260px; height:100vh; z-index:30; transform:translateX(-100%); transition:transform .25s ease; box-shadow:4px 0 24px rgba(0,0,0,.12); }
    .shell.sidebar-collapsed .sidebar-frame{ transform:translateX(0); }
    .shell.sidebar-collapsed .sidebar-backdrop{ display:block; }
  }
  /* responsive: cap content on large screens (left-aligned in a centred 1440 column; !important beats per-section margins) */
  @media (min-width:1600px){ main > * { max-width:1440px !important; margin-left:max(0px, (100% - 1440px) / 2) !important; margin-right:0 !important; } }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar-backdrop" onclick="document.querySelector('.shell').classList.remove('sidebar-collapsed')"></div>
  <iframe class="sidebar-frame" src="../component/sidebar.html?active=assessments" title="Learner navigation"></iframe>
  <iframe class="topbar-frame" src="../component/topnavbar.html?current=Assignments" title="Top bar"></iframe>

  <main class="main"><div class="main-inner">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="assignments.html">Assignments</a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span id="crumb" aria-current="page"></span>
    </nav>
    <div id="root"></div>
  </div></main>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" hidden></div>

<script>
  window.addEventListener('message', function(e){
    if (e.data === 'toggle-sidebar') document.querySelector('.shell').classList.toggle('sidebar-collapsed');
  });

  /* ---------------- Data (list fields mirror assignments.html) ---------------- */

  }
  function record(){
    var q = Q.questions[st.cur];
    st.answers[q.id] = fmt(q) === 'fill' ? $('ans').value
      : Array.prototype.map.call(document.querySelectorAll('input[name="ans"]:checked'), function(i){ return i.value; });
    persist(); paintPanel();
  }
  var typing;
  $('root').addEventListener('change', function(e){ if (e.target.name === 'ans') record(); });
  $('root').addEventListener('input', function(e){ if (e.target.id === 'ans'){ clearTimeout(typing); typing = setTimeout(record, 300); } });
  $('root').addEventListener('keydown', function(e){
    if (e.target.id === 'ans' && e.key === 'Enter'){ clearTimeout(typing); record(); act(st.cur === Q.questions.length - 1 ? 'review' : 'next'); }
  });
  $('root').addEventListener('click', function(e){
    var g = e.target.closest('[data-goto]');
    if (g) return go(+g.dataset.goto);
    var b = e.target.closest('[data-act]');
    if (b && !b.disabled) act(b.dataset.act);
  });

  function act(a){
    if (a === 'start'){
      if (!st.startedAt){ st.startedAt = Date.now(); persist(); }
      startTimer();
      if (view !== 'result') go(st.cur); // already 'result' if the timer ran out while away
    }
    else if (a === 'prev') go(st.cur - 1);
    else if (a === 'next') go(st.cur + 1);
    else if (a === 'back') go(st.cur);
    else if (a === 'review'){ view = 'review'; persist(); render(); $('revTitle').focus(); }
    else if (a === 'submit') openConfirm();
  }

  /* ---------------- Submit confirm — Modal (library) ---------------- */
  var modalKey = null, modalReturn = null;
  function closeModal(){
    var m = $('modal'); m.hidden = true; m.innerHTML = '';
    if (modalKey) document.removeEventListener('keydown', modalKey);
    modalKey = null;
  }
  function openConfirm(){
    if (unanswered().length) return; // user decision: every question must be answered first
    var m = $('modal');
    modalReturn = document.activeElement;
    m.hidden = false;
    m.innerHTML = '<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mBody">' +
      '<h3 id="mTitle">Submit quiz?</h3><p id="mBody">You’ve answered all ' + Q.questions.length + ' questions. You can’t change your answers after submitting' + (Q.maxAttempts === 1 ? ', and this is your only attempt.' : '.') + '</p>' +
      '<div class="acts"><button class="btn btn-secondary" type="button" id="mCancel">Keep reviewing</button><button class="btn btn-primary" type="button" id="mOk">Submit quiz</button></div></div></div>';
    var ok = $('mOk'), cancel = $('mCancel');
    function dismiss(){ closeModal(); if (modalReturn) modalReturn.focus(); }
    modalKey = function(e){
      if (e.key === 'Escape') dismiss();
      if (e.key === 'Tab'){ e.preventDefault(); (document.activeElement === ok ? cancel : ok).focus(); }
    };
    document.addEventListener('keydown', modalKey);
    cancel.onclick = dismiss;
    m.firstChild.onclick = function(e){ if (e.target === this) dismiss(); };
    ok.onclick = function(){
      ok.disabled = cancel.disabled = true; ok.classList.add('busy'); ok.innerHTML = '<span class="spin"></span>Submitting…';
      setTimeout(function(){ submit(false); }, 600);
    };
    ok.focus();
  }

  // Records answers, timestamp and time spent; objective questions are graded on submit (ASM-005-FR-07)
  function submit(auto){
    clearInterval(tick);
    closeModal();
    if (view === 'result') return;
    var spent = st.startedAt ? Math.round((Date.now() - st.startedAt) / 1000) : 0;
    if (Q.timeLimit) spent = Math.min(spent, Q.timeLimit * 60);
    var sub = { at:new Date().toISOString(), spent:spent, auto:auto, answers:st.answers, grade:{ score:scoreOf(st.answers), released:Q.visibility !== 'hidden' } };
    st.subs.push(sub);
    local = { submissions:(local.submissions || []).concat(sub) };
    save(KEY, local);
    view = 'result'; render();
    if ($('resTitle')) $('resTitle').focus();
    toast(auto ? 'Time’s up — your quiz was submitted with your saved answers.' : 'Quiz submitted.');
  }

  var toastTimer;
  function toast(msg, warn){
    var t = $('toast');
    t.innerHTML = '<span class="ic' + (warn ? ' warn' : '') + '">' + (warn ? I.clock : I.check) + '</span><span>' + esc(msg) + '</span>';
    t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 4000);
  }

  /* ---------------- Boot ---------------- */
  if (!Q){
    $('crumb').textContent = 'Quiz not found';
    $('root').innerHTML = '<div class="empty"><b>Quiz not found.</b><span>It may have been removed or the link is wrong.</span><a class="btn btn-secondary" href="assignments.html">Back to assignments</a></div>';
  } else {
    render();
    // Timer keeps running server-side across reloads (edge case: browser crash → resume, lost time not restored)
    if (view === 'intro' && Q.timeLimit && st.startedAt && !remaining()) submit(true);
  }
</script>
</body>
