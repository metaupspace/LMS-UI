<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpSpace Learner — Course Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------------------------------------------------------------
     Learner — Course Overview (CDL-002). Opened from any course card
     on my-courses.html (?id=COURSE_ID). The Continue hero skips this
     and goes straight to course-player.html.
     - Main: description + course structure as an accordion — module
       description and every lesson (title, type, duration, summary),
       completed lessons marked. Not playable from here (FR-02).
     - Side card: thumbnail, progress/last lesson, Start/Continue/Review
       (FR-06/07), assignment details (FR-05), prerequisites (FR-04).
     - Ask AI: floating bottom bar (Google Docs–style: sparkle pill → input →
       thinking → answer), ⋮ → side panel / turn off. NOTE: undocumented —
       AI-006 only defines the tutor inside the player. Built on user
       request, scoped to this course's outline (same guardrail copy).
     Library components used as-is: Breadcrumbs, Badge, Buttons,
     Progress bar, Message, Textarea input field, Dropdown menu, Aside
     (Right). Hand-built (approved, MISSING_COMPONENTS.md): Accordion,
     Lesson list item, Chat composer, AI bottom bar.
     - AI study tools (user decision 2026-09-23): each completed module has a
       "Revision notes" row (AI-008) → revision-notes.html?course=&mod=; a
       "Generate flashcards" button under Continue opens a modal with the
       whole flashcard flow (AI-007, one set per course) → study in
       flashcard-study.html?course=. #flashcards opens the modal. Demo: &ai=fail.
  ----------------------------------------------------------------*/
  :root{
    --text-primary:#171717; --text-strong:#404040; --text-secondary:#525252; --text-tertiary:#a3a3a3; --text-disabled:#d4d4d4;
    --surface-canvas:#fafafa; --surface-raised:#f5f5f5; --surface-overlay:#e5e5e5;
    --border-default:#e5e5e5; --border-subtle:#f0f0f0;
    --action-primary:#4f46e5; --action-primary-hover:#4338ca; --action-primary-subtle:#eef2ff; --action-primary-soft:#e0e7ff; --focus-ring:#6366f1;
    --error:#dc2626; --error-subtle:#fef2f2;
    --warning:#ca8a04; --warning-subtle:#fefce8;
    --success:#15803d; --success-subtle:#f0fdf4;
    --info:#2563eb;
    --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-2xl:16px; --radius-full:999px;
    --ease:cubic-bezier(.2,.7,.2,1);
    --font:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button,input,textarea{ font-family:var(--font); }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }
  [hidden]{ display:none !important; }
  svg{ flex-shrink:0; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  .shell{ display:grid; grid-template-columns:232px 1fr; grid-template-rows:80px 1fr; height:100vh; }
  .shell.sidebar-collapsed{ grid-template-columns:0 1fr; }
  .shell.sidebar-collapsed .sidebar-frame{ border-right:none; }
  .sidebar-frame{ grid-column:1; grid-row:1/-1; width:100%; height:100%; border:0; display:block; border-right:1px solid var(--border-default); }
  .topbar-frame{ grid-column:2; grid-row:1; width:100%; height:100%; border:0; display:block; background:#fff; border-bottom:1px solid var(--border-default); }
  .main{ grid-column:2; grid-row:2; overflow-y:auto; min-width:0; }
  .main-inner{ width:100%; padding:24px clamp(20px, 2.6vw, 48px) 32px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 18px; border-radius:var(--radius-lg); font-size:14.5px; font-weight:600; border:none; transition:background-color .15s ease, transform .1s ease; white-space:nowrap; }
  .btn:active{ transform:scale(.97); }
  .btn svg{ width:17px; height:17px; }
  .btn-primary{ background:var(--action-primary); color:#fff; }
  .btn-primary:hover{ background:var(--action-primary-hover); }
  .btn-secondary{ background:#fff; color:var(--text-strong); border:1px solid var(--border-default); }
  .btn-secondary:hover{ background:var(--surface-raised); }
  .btn[aria-disabled="true"]{ background:var(--surface-overlay); color:var(--text-tertiary); pointer-events:none; }
  .btn-block{ width:100%; }

  /* Breadcrumbs — library pattern */
  .crumbs{ display:flex; align-items:center; gap:6px; font-size:14px; margin-bottom:20px; min-width:0; }
  .crumbs a{ color:var(--text-secondary); font-weight:500; white-space:nowrap; }
  .crumbs a:hover{ color:var(--text-primary); }
  .crumbs svg{ width:16px; height:16px; color:var(--text-disabled); }
  .crumbs span{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Badge — library pattern (sm; Brand / Gray / Warning / Error / Success) */
  .badge{ display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:var(--radius-full); font-size:12.5px; font-weight:600; white-space:nowrap; }
  .badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge.brand{ background:var(--action-primary-subtle); color:var(--action-primary); }
  .badge.gray{ background:var(--surface-raised); color:var(--text-secondary); }
  .badge.warning{ background:var(--warning-subtle); color:var(--warning); }
  .badge.error{ background:var(--error-subtle); color:var(--error); }
  .badge.success{ background:var(--success-subtle); color:var(--success); }

  .progress-bar-bg{ height:8px; background:var(--surface-overlay); border-radius:var(--radius-full); overflow:hidden; }
  .progress-bar-fill{ height:100%; background:var(--action-primary); border-radius:var(--radius-full); }

  /* ---- Layout: content + sticky side card ---- */
  .layout{ display:grid; grid-template-columns:minmax(0,1fr) minmax(320px, 400px); gap:clamp(24px, 2.5vw, 40px); align-items:start; }
  .side{ position:sticky; top:0; }

  .head .badges{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .head h1{ margin:0; font-size:clamp(28px, 2.4vw, 38px); font-weight:700; letter-spacing:-.8px; line-height:1.15; text-wrap:balance; }
  .head .lead{ margin:14px 0 0; max-width:72ch; font-size:16px; line-height:1.65; color:var(--text-secondary); }
  .head .lead.muted{ color:var(--text-tertiary); font-style:italic; }
  .byline{ display:flex; align-items:center; gap:10px; margin-top:18px; font-size:14px; color:var(--text-secondary); }
  .byline .av{ width:32px; height:32px; border-radius:50%; background:var(--action-primary-soft); color:var(--action-primary); font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .byline b{ color:var(--text-primary); font-weight:600; }
  .stats{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .stat{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-xl); }
  .stat svg{ width:18px; height:18px; color:var(--text-tertiary); }
  .stat b{ display:block; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat small{ display:block; font-size:12.5px; color:var(--text-tertiary); }

  .section{ margin-top:40px; }
  .section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .section-head h2{ margin:0; font-size:20px; font-weight:700; letter-spacing:-.3px; }
  .section-head .sub{ font-size:13.5px; color:var(--text-tertiary); margin-top:4px; }
  .link-btn{ border:0; background:transparent; font-size:14px; font-weight:600; color:var(--action-primary); padding:6px 8px; border-radius:var(--radius-md); }
  .link-btn:hover{ background:var(--action-primary-subtle); }

  /* Accordion (hand-built) */
  .outline{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-2xl); overflow:hidden; }
  .acc + .acc{ border-top:1px solid var(--border-subtle); }
  .acc-btn{ width:100%; display:flex; align-items:flex-start; gap:14px; padding:18px 20px; border:0; background:transparent; text-align:left; transition:background-color .15s ease; }
  .acc-btn:hover{ background:var(--surface-canvas); }
  .num{ flex-shrink:0; width:32px; height:32px; border-radius:var(--radius-lg); background:var(--surface-raised); font-size:13.5px; font-weight:700; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
  .acc.done .num{ background:var(--success-subtle); color:var(--success); }
  .acc.current .num{ background:var(--action-primary-soft); color:var(--action-primary); }
  .acc-btn .txt{ flex:1; min-width:0; }
  .acc-btn .t{ display:block; font-size:16px; font-weight:600; line-height:1.35; }
  .acc-btn .m{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--text-tertiary); margin-top:4px; }
  .acc-btn .m .sep{ width:3px; height:3px; border-radius:50%; background:var(--text-disabled); }
  .chev{ width:20px; height:20px; color:var(--text-tertiary); margin-top:6px; transition:transform .25s var(--ease); }
  .acc-btn[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .acc-panel{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease); }
  .acc-btn[aria-expanded="true"] + .acc-panel{ grid-template-rows:1fr; }
  .acc-panel > div{ overflow:hidden; }
  .acc-body{ padding:0 20px 18px 66px; }
  .acc-desc{ margin:0 0 12px; max-width:72ch; font-size:14.5px; line-height:1.6; color:var(--text-secondary); }
  .lessons{ list-style:none; margin:0; padding:0; border:1px solid var(--border-subtle); border-radius:var(--radius-xl); }
  /* Lesson list item (hand-built; not interactive here — FR-02) */
  .lesson{ display:flex; gap:12px; padding:12px 14px; }
  .lesson + .lesson{ border-top:1px solid var(--border-subtle); }
  .lesson .st{ width:20px; height:20px; margin-top:1px; }
  .lesson .st svg{ width:20px; height:20px; }
  .lesson .body{ flex:1; min-width:0; }
  .lesson .row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .lesson .lt{ font-size:14.5px; font-weight:600; color:var(--text-strong); line-height:1.4; }
  .lesson .dur{ font-size:13px; color:var(--text-tertiary); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .lesson .lm{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-tertiary); margin-top:2px; }
  .lesson .lm svg{ width:13px; height:13px; }
  .lesson .ld{ margin:6px 0 0; font-size:13.5px; line-height:1.55; color:var(--text-secondary); max-width:72ch; }
  .last-tag{ margin-left:8px; font-size:11.5px; font-weight:600; color:var(--action-primary); background:var(--action-primary-subtle); padding:2px 7px; border-radius:var(--radius-full); vertical-align:2px; white-space:nowrap; }

  /* Side card */
  .card{ background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-2xl); overflow:hidden; }
  .thumb{ aspect-ratio:16/9; background:var(--surface-raised) center/cover no-repeat; }
  .thumb.placeholder{ display:flex; align-items:center; justify-content:center; color:var(--text-disabled); }
  .thumb.placeholder svg{ width:40px; height:40px; }
  .thumb.completed{ filter:grayscale(55%); }
  .card-body{ padding:20px; }
  .prog-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; color:var(--text-secondary); margin-bottom:8px; }
  .prog-row b{ font-size:15px; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .last{ margin:12px 0 16px; font-size:13.5px; color:var(--text-secondary); line-height:1.5; }
  .last:empty{ margin:0 0 16px; }
  .last b{ color:var(--text-primary); font-weight:600; }
  .block-note{ display:flex; gap:8px; margin-top:10px; font-size:13px; line-height:1.5; color:var(--text-secondary); }
  .block-note svg{ width:16px; height:16px; color:var(--warning); margin-top:1px; }
  .cert{ display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:14px; font-weight:600; color:var(--info); }
  .cert:hover{ text-decoration:underline; }
  .cert svg{ width:16px; height:16px; }
  .dl{ margin:0; padding:16px 20px; border-top:1px solid var(--border-subtle); display:grid; grid-template-columns:auto 1fr; gap:10px 16px; font-size:13.5px; }
  .dl dt{ color:var(--text-tertiary); }
  .dl dd{ margin:0; text-align:right; font-weight:600; color:var(--text-strong); }
  .dl dd.overdue{ color:var(--error); }
  .prereq{ padding:16px 20px; border-top:1px solid var(--border-subtle); }
  .prereq h3{ margin:0 0 10px; font-size:12px; font-weight:700; color:var(--text-tertiary); letter-spacing:.06em; text-transform:uppercase; }
  .prereq ul{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .prereq li{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .prereq li svg{ width:18px; height:18px; }
  .prereq li.met{ color:var(--text-secondary); }
  .prereq li a{ font-weight:600; }
  .prereq li a:hover{ text-decoration:underline; }

  /* ---- Ask AI: floating bottom bar (hand-built, user-requested) + side sheet (library Aside · Right) ---- */
  .ai-dock{ position:sticky; bottom:20px; z-index:15; display:flex; justify-content:center; padding:0 16px; pointer-events:none; margin-top:-8px; }
  .ai-dock > *{ pointer-events:auto; }
  .ai-dock[hidden]{ display:none; }
  .ai-pill{ height:36px; width:88px; border-radius:var(--radius-full); border:1px solid var(--border-default); background:#fff; color:var(--action-primary); display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(23,23,17,.06); transition:width .25s var(--ease), background-color .15s ease; }
  .ai-pill:hover{ background:var(--action-primary-subtle); width:100px; }
  .ai-pill svg{ width:18px; height:18px; }
  .ai-card{ width:min(760px, 100%); background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-2xl); box-shadow:0 2px 8px rgba(23,23,17,.06); overflow:visible; animation:barIn .25s var(--ease) both; }
  @keyframes barIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
  .ai-dock[data-state="pill"] .ai-card, .ai-dock[data-state="off"] .ai-card{ display:none; }
  .ai-dock:not([data-state="pill"]):not([data-state="off"]) .ai-pill{ display:none; }

  .ai-answer{ padding:14px 16px 14px; border-bottom:1px solid var(--border-subtle); max-height:min(46vh, 380px); overflow-y:auto; }
  .ai-answer[hidden]{ display:none; }
  .ai-answer-head{ display:flex; align-items:center; gap:2px; margin-bottom:8px; }
  .ai-answer-head .spark{ color:var(--action-primary); width:20px; height:20px; margin-right:auto; }
  .ai-q{ font-size:13px; color:var(--text-tertiary); margin-bottom:6px; }
  .ai-a{ font-size:15px; line-height:1.6; color:var(--text-primary); white-space:pre-wrap; overflow-wrap:anywhere; }
  .ib{ width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:var(--radius-md); background:transparent; color:var(--text-secondary); position:relative; }
  .ib:hover{ background:var(--surface-raised); color:var(--text-primary); }
  .ib[aria-pressed="true"]{ color:var(--action-primary); background:var(--action-primary-subtle); }
  .ib svg{ width:18px; height:18px; }

  .ai-row{ display:flex; align-items:flex-end; gap:6px; padding:8px 8px 8px 16px; }
  .ai-row .spark{ width:20px; height:20px; color:var(--action-primary); margin-bottom:9px; flex-shrink:0; }
  .ai-row textarea{ flex:1; border:0; outline:none; resize:none; font-size:15px; line-height:1.5; padding:8px 4px; max-height:120px; color:var(--text-primary); background:transparent; }
  .ai-row textarea::placeholder{ color:var(--text-tertiary); }
  .send{ width:36px; height:36px; border:0; border-radius:50%; background:var(--action-primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:background-color .15s ease, opacity .15s ease; }
  .send:hover{ background:var(--action-primary-hover); }
  .send:disabled{ opacity:.3; cursor:default; }
  .send svg{ width:17px; height:17px; }
  .ai-thinking{ display:none; align-items:center; gap:12px; padding:10px 10px 10px 16px; }
  .ai-dock[data-state="thinking"] .ai-thinking{ display:flex; }
  .ai-dock[data-state="thinking"] .ai-row{ display:none; }
  .ai-thinking .spark{ width:22px; height:22px; color:var(--action-primary); animation:spin 1.4s linear infinite; }
  .ai-thinking span{ flex:1; font-size:14.5px; font-weight:600; color:var(--text-strong); }
  .stop{ width:36px; height:36px; border:0; border-radius:50%; background:var(--action-primary-subtle); color:var(--action-primary); display:inline-flex; align-items:center; justify-content:center; }
  .stop:hover{ background:var(--action-primary-soft); }
  .stop svg{ width:12px; height:12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Dropdown menu — library pattern (Dropdown menu / _Dropdown list item) */
  .menu-wrap{ position:relative; }
  .menu{ position:absolute; right:0; bottom:calc(100% + 6px); z-index:30; min-width:220px; padding:4px; background:#fff; border:1px solid var(--border-default); border-radius:var(--radius-lg); box-shadow:0 8px 24px rgba(23,23,17,.08); }
  .menu.down{ bottom:auto; top:calc(100% + 6px); }
  .menu button{ width:100%; display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border:0; border-radius:var(--radius-md); background:transparent; font-size:14px; font-weight:500; color:var(--text-strong); text-align:left; }
  .menu button:hover, .menu button:focus-visible{ background:var(--surface-raised); outline:none; }
  .menu button svg{ width:16px; height:16px; color:var(--text-secondary); }

  /* Side sheet (Aside · Right) */
  .sheet-backdrop{ position:fixed; inset:0; z-index:60; background:rgba(15,23,42,.32); opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .sheet{ position:fixed; top:0; right:0; bottom:0; z-index:61; width:min(440px, 100vw); background:#fff; border-left:1px solid var(--border-default); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s var(--ease); visibility:hidden; }
  body.sheet-open .sheet{ transform:none; visibility:visible; }
  body.sheet-open .sheet-backdrop{ opacity:1; pointer-events:auto; }
  .sheet-head{ display:flex; align-items:center; gap:10px; padding:14px 12px 14px 20px; border-bottom:1px solid var(--border-subtle); }
  .sheet-head .spark{ width:22px; height:22px; color:var(--action-primary); }
  .sheet-head h2{ margin:0; font-size:16px; font-weight:700; letter-spacing:-.2px; }
  .sheet-head .hint{ font-size:12.5px; color:var(--text-tertiary); }
  .sheet-head .spacer{ flex:1; }
  .thread{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:18px; }
  .sheet-empty{ margin-top:auto; }
  .sheet-empty p{ margin:0 0 12px; font-size:14px; line-height:1.5; color:var(--text-secondary); }
  .sheet-foot{ padding:12px 16px 16px; border-top:1px solid var(--border-subtle); }
  .composer-box{ display:flex; align-items:flex-end; gap:8px; padding:6px 6px 6px 14px; border:1px solid var(--border-default); border-radius:var(--radius-xl); background:#fff; transition:border-color .15s ease, box-shadow .15s ease; }
  .composer-box:focus-within{ border-color:var(--focus-ring); box-shadow:0 0 0 3px rgba(99,102,241,.15); }
  .composer-box textarea{ flex:1; border:0; outline:none; resize:none; font-size:15px; line-height:1.5; padding:7px 0; max-height:140px; color:var(--text-primary); background:transparent; }
  .composer-box textarea::placeholder{ color:var(--text-tertiary); }

  /* Message — library pattern */
  .msg{ display:flex; gap:12px; max-width:94%; animation:rise .3s var(--ease) both; }
  .msg.sent{ align-self:flex-end; }
  .msg .avatar{ width:40px; height:40px; border-radius:50%; flex-shrink:0; }
  .msg .mc{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .msg .meta{ display:flex; align-items:baseline; gap:8px; }
  .msg.sent .meta{ justify-content:space-between; }
  .msg .name{ font-size:14px; font-weight:500; color:var(--text-strong); }
  .msg .when{ font-size:12px; color:var(--text-secondary); }
  .msg .bubble{ padding:10px 14px; font-size:15px; line-height:1.55; background:var(--surface-raised); border-radius:0 var(--radius-lg) var(--radius-lg) var(--radius-lg); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.sent .bubble{ background:var(--action-primary-soft); border-radius:var(--radius-lg) 0 var(--radius-lg) var(--radius-lg); }
  .rate{ display:flex; align-items:center; gap:2px; font-size:12px; color:var(--text-tertiary); }
  .rate span{ margin-right:4px; }
  .rate .ib{ width:28px; height:28px; }
  .rate .ib svg{ width:15px; height:15px; }
  .typing{ display:inline-flex; gap:4px; padding:12px 10px; background:var(--surface-raised); border-radius:0 var(--radius-lg) var(--radius-lg) var(--radius-lg); width:max-content; }
  .typing i{ width:4px; height:4px; border-radius:50%; background:#737373; animation:blink 1s infinite; }
  .typing i:nth-child(2){ background:#a3a3a3; animation-delay:.15s; }
  .typing i:nth-child(3){ animation-delay:.3s; }

  .fc-empty p{ margin:0; font-size:14px; color:var(--text-secondary); line-height:1.5; }
  @media (prefers-reduced-motion:reduce){ .gsteps li.active .d{ animation:none; } }

      '<ol class="gsteps" id="fcSteps">' + steps.map(function(t){ return '<li><span class="d"></span>' + t + '</li>'; }).join('') + '</ol>';
    var lis = $('fcSteps').children, i = 0;
    (function tick(){
      if (run !== fcRun) return;
      if (i > 0){ lis[i - 1].className = 'done'; lis[i - 1].firstChild.innerHTML = SI.ok; }
      if (fcFail && i === 1){
        lis[i].className = 'failed'; lis[i].firstChild.innerHTML = SI.x;
        box.insertAdjacentHTML('beforeend', '<div class="fc-err" role="alert"><b>Couldn\'t generate this right now.</b><p>Nothing was saved. Try again in a moment.</p><div class="fc-acts"><button class="btn btn-primary" type="button" id="fcRetry">Try again</button><button class="btn btn-secondary" type="button" id="fcBack">Cancel</button></div></div>');
        $('fcRetry').onclick = function(){ fcFail = false; fcGenerate(count, focus); };
        $('fcBack').onclick = renderFlashcards;
        return;
      }
      if (i === lis.length) return setTimeout(function(){
        if (run !== fcRun) return;
        var words = focus.toLowerCase().split(/[^a-z0-9]+/).filter(function(w){ return w.length > 3; }).map(function(w){ return w.replace(/(es|s)$/, ''); });
        var all = CARD_SOURCE[id].map(function(k){ return { f:k[0], b:k[1] }; });
        if (words.length){ var hit = function(k){ var t = (k.f + ' ' + k.b).toLowerCase(); return words.some(function(w){ return t.indexOf(w) > -1; }); }; all = all.filter(hit).concat(all.filter(function(k){ return !hit(k); })); }
        var s = study();
        s.decks[id] = { course:c.title, createdAt:Date.now(), focus:focus, short:all.length < count, cards:all.slice(0, count) };
        save(STUDY_KEY, s); renderFlashcards(); syncFcEntry();
      }, 250);
      lis[i].className = 'active'; i++;
      setTimeout(tick, 800);
    })();
  }

  /* ---------------- Resolve course ---------------- */
  var id = new URLSearchParams(location.search).get('id') || 'CS-301';
  var c = COURSES[id];
  if (!c){
    $('root').innerHTML = '<div class="not-found"><h1>Course not found</h1><p>This course may have been removed, or you no longer have access to it.</p><a class="btn btn-primary" href="my-courses.html">Back to My Courses</a></div>';
  } else {
    render();
    syncFcEntry();
  }

  function render(){
    var outline = OUTLINES[id] || genericOutline(c);
    var allLessons = [].concat.apply([], outline.map(function(m){ return m.lessons; }));
    var totalMin = allLessons.reduce(function(s, l){ return s + l[3]; }, 0);
    var lastLessonId = c.lastLesson || (allLessons.find(function(l){ return l[4] === 'p'; }) || [])[0];
    var lastLesson = allLessons.find(function(l){ return l[0] === lastLessonId; });
    var unmet = (c.prereqs || []).filter(function(p){ return COURSES[p] && COURSES[p].status !== 'completed'; });
    var futureStart = c.startDate && daysUntil(c.startDate) > 0;
    var overdue = c.deadline && c.status !== 'completed' && daysUntil(c.deadline) < 0;
    document.title = c.title + ' — Course Overview';

    /* Head (FR-01, FR-03) */
    $('crumbTitle').textContent = c.title;
    $('title').textContent = c.title;
    $('desc').textContent = c.desc || 'No description available.';
    $('desc').classList.toggle('muted', !c.desc);
    $('instructor').textContent = c.instructor;
    $('avatar').textContent = c.instructor.replace(/^(Prof\.|Dr\.)\s*/, '').slice(0, 2).toUpperCase();
    var badges = ['<span class="badge brand">' + esc(c.tag) + '</span>'];
    if (c.status === 'completed') badges.push('<span class="badge success"><span class="dot"></span>Completed</span>');
    else badges.push(c.mandatory ? '<span class="badge warning">Mandatory</span>' : '<span class="badge gray">Optional</span>');
    if (c.status === 'in-progress') badges.push('<span class="badge brand"><span class="dot"></span>In progress</span>');
    if (overdue) badges.push('<span class="badge error"><span class="dot"></span>Overdue</span>');
    $('badges').innerHTML = badges.join('');
    $('stats').innerHTML = [[I.clock, hm(totalMin), 'Total duration'], [I.list, allLessons.length, 'Lessons'], [I.layers, outline.length, 'Modules']]
      .map(function(s){ return '<div class="stat">' + s[0] + '<div><b>' + s[1] + '</b><small>' + s[2] + '</small></div></div>'; }).join('');

    /* Outline accordion (FR-02) */
    $('outlineSub').textContent = outline.length + ' modules · ' + allLessons.length + ' lessons · ' + hm(totalMin);
    $('outline').innerHTML = outline.map(function(m, mi){
      var done = m.lessons.filter(function(l){ return l[4] === 'c'; }).length;
      var mins = m.lessons.reduce(function(s, l){ return s + l[3]; }, 0);
      var isCurrent = c.status === 'in-progress' && m.lessons.some(function(l){ return l[0] === lastLessonId; });
      var allDone = done === m.lessons.length;
      var open = isCurrent || (c.status !== 'in-progress' && mi === 0);
      return '<div class="acc' + (allDone ? ' done' : isCurrent ? ' current' : '') + '">' +
        '<button class="acc-btn" type="button" aria-expanded="' + open + '" aria-controls="m' + mi + '">' +
          '<span class="num">' + (allDone ? '✓' : mi + 1) + '</span>' +
          '<span class="txt"><span class="t">' + esc(m.title) + '</span>' +
            '<span class="m"><span>' + m.lessons.length + ' lessons</span><span class="sep"></span><span>' + hm(mins) + '</span>' +
            (c.status !== 'not-started' ? '<span class="sep"></span><span>' + done + '/' + m.lessons.length + ' done</span>' : '') + '</span></span>' + I.chev +
        '</button>' +
        '<div class="acc-panel" id="m' + mi + '"><div><div class="acc-body">' +
          (m.desc ? '<p class="acc-desc">' + esc(m.desc) + '</p>' : '') +
          '<ul class="lessons">' + m.lessons.map(function(l){
            var st = l[4] === 'c' ? I.check : l[4] === 'p' ? I.progress : I.todo;
            return '<li class="lesson">' +
              '<span class="st" role="img" aria-label="' + (l[4] === 'c' ? 'Completed' : l[4] === 'p' ? 'In progress' : 'Not started') + '">' + st + '</span>' +
              '<div class="body"><div class="row"><span class="lt">' + esc(l[1]) + (l[0] === lastLessonId && c.status === 'in-progress' ? '<span class="last-tag">Last accessed</span>' : '') + '</span><span class="dur">' + l[3] + ' min</span></div>' +
                '<div class="lm">' + I[l[2]] + TYPE_LABEL[l[2]] + '</div>' +
                (l[5] ? '<p class="ld">' + esc(l[5]) + '</p>' : '') +
              '</div></li>';
          }).join('') + '</ul>' + notesRow(mi, allDone, m) +
        '</div></div></div>' +
      '</div>';
    }).join('');
    function syncToggleAll(){
      var allOpen = Array.prototype.every.call(document.querySelectorAll('.acc-btn'), function(b){ return b.getAttribute('aria-expanded') === 'true'; });
      $('toggleAll').textContent = allOpen ? 'Collapse all' : 'Expand all';
    }
    $('outline').addEventListener('click', function(e){
      var b = e.target.closest('.acc-btn'); if (!b) return;
      b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') !== 'true');
      syncToggleAll();
    });
    $('toggleAll').addEventListener('click', function(){
      var open = this.textContent === 'Expand all';
      document.querySelectorAll('.acc-btn').forEach(function(b){ b.setAttribute('aria-expanded', open); });
      syncToggleAll();
    });
    syncToggleAll();

    /* Side card: CTA (FR-04, FR-06, FR-07 + completed edge case) */
    var thumb = $('thumb');
    thumb.setAttribute('aria-label', c.title + ' thumbnail');
    if (c.photo) thumb.style.backgroundImage = 'url(' + c.photo + ')';
    else { thumb.classList.add('placeholder'); thumb.innerHTML = I.image; }
    thumb.classList.toggle('completed', c.status === 'completed');

    var playerHref = 'course-player.html?id=' + encodeURIComponent(id);
    var cta = '', blockMsg = '';
    if (c.status !== 'not-started')
      cta += '<div class="prog-row"><span>Your progress</span><b>' + c.progress + '%</b></div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + c.progress + '%"></div></div>';
    if (c.status === 'in-progress'){
      cta += '<p class="last">' + (lastLesson ? 'Last accessed: <b>' + esc(lastLesson[1]) + '</b>' : '') + '</p>';
      cta += '<a class="btn btn-primary btn-block" href="' + playerHref + '">Continue' + I.arrow + '</a>';
    } else if (c.status === 'completed'){
      cta += '<p class="last">Completed on <b>' + esc(c.completedDate) + '</b></p>';
      cta += '<a class="btn btn-secondary btn-block" href="' + playerHref + '">Review course</a>';
      if (c.cert) cta += '<a class="cert" href="certificates.html">' + I.award + 'View certificate</a>';
    } else {
      blockMsg = unmet.length ? 'Complete ' + unmet.map(function(p){ return COURSES[p].title; }).join(' and ') + ' to unlock this course.'
                   : futureStart ? 'This course opens on ' + longDate(c.startDate) + '.' : '';
      cta += blockMsg
        ? '<span class="btn btn-primary btn-block" aria-disabled="true">' + I.lock + 'Start course</span><div class="block-note">' + I.info + '<span>' + esc(blockMsg) + '</span></div>'
        : '<a class="btn btn-primary btn-block" href="' + playerHref + '">Start course' + I.arrow + '</a>';
    }
    if (!(c.status === 'not-started' && blockMsg)) cta += '<button class="btn btn-secondary btn-block fc-open" id="fcOpen" type="button" aria-haspopup="dialog"></button>';
    $('cta').innerHTML = cta;
    if ($('fcOpen')) $('fcOpen').onclick = openFlashcards;

    /* Assignment details (FR-05) */
    var rows = [['Type', c.mandatory ? 'Mandatory' : 'Optional'], ['Assigned by', c.mandatory ? ASSIGNER : 'Self-enrolled']];
    if (c.deadline) rows.push(['Deadline', longDate(c.deadline) + (overdue ? ' · overdue' : ''), overdue ? 'overdue' : '']);
    if (c.startDate) rows.push(['Starts', longDate(c.startDate)]);
    $('assign').innerHTML = rows.map(function(r){ return '<dt>' + r[0] + '</dt><dd class="' + (r[2] || '') + '">' + esc(r[1]) + '</dd>'; }).join('');

    /* Prerequisites (FR-04) */
    if (c.prereqs && c.prereqs.length){
      $('prereq').hidden = false;
      $('prereqList').innerHTML = c.prereqs.map(function(p){
        var pc = COURSES[p], met = pc.status === 'completed';
        return '<li class="' + (met ? 'met' : '') + '">' + (met ? I.check : I.todo) + '<a href="course-overview.html?id=' + p + '">' + esc(pc.title) + '</a></li>';
      }).join('');
    }

    initAsk(outline, allLessons, totalMin, overdue);
  }

  /* ---------------- Ask AI about this course (undocumented — see header) ----------------
     One conversation, two surfaces: the floating bottom bar (latest answer only) and the
     side sheet (full thread). ⋮ menu → Switch to side panel / Turn off bottom bar.
     When off, the sparkle pill stays and its only action is opening the side panel. */
  function initAsk(outline, allLessons, totalMin, overdue){
    var CHAT_KEY = 'upspace-course-ai-' + id, OFF_KEY = 'upspace-ai-bar-off';
    var log = load(CHAT_KEY) || [];
    var barOff = !!load(OFF_KEY);
    var DECLINE = 'I can only help with content from this course. Try rephrasing your question about the topic';
    var STOP = /^(what|does|this|that|with|about|course|have|will|from|your|when|where|which|there|they|would|could|should|like|tell|know|explain|much|many)$/;
    var corpus = (c.title + ' ' + c.tag + ' ' + outline.map(function(m){ return m.title + ' ' + m.desc + ' ' + m.lessons.map(function(l){ return l[1] + ' ' + l[5]; }).join(' '); }).join(' ')).toLowerCase();
    var modMins = function(m){ return m.lessons.reduce(function(x, l){ return x + l[3]; }, 0); };
    var SUGGEST = ['What will I learn?', 'How long does it take?', 'Are there prerequisites?'];

    function reply(q){
      var s = q.toLowerCase();
      if (/\b(answers?|solutions?|correct option)\b/.test(s)) return 'I can’t share assessment answers. Review the lessons before the “' + outline[outline.length - 1].title + '” module — that’s where the final check sits.';
      if (/how long|duration|hours|minutes|time (does|will)/.test(s)) return 'About ' + hm(totalMin) + ' in total, across ' + allLessons.length + ' lessons. The longest module is “' + outline.slice().sort(function(a, b){ return modMins(b) - modMins(a); })[0].title + '”.';
      if (/prereq|before i start|need to know|required/.test(s)) return c.prereqs && c.prereqs.length ? 'You need: ' + c.prereqs.map(function(p){ return COURSES[p].title + (COURSES[p].status === 'completed' ? ' (done)' : ' (not done yet)'); }).join(', ') + '.' : 'This course has no prerequisites — you can start any time.';
      if (/deadline|due|finish by/.test(s)) return c.deadline ? 'It’s due ' + longDate(c.deadline) + (overdue ? ' — that date has passed, but you can still take it.' : '.') : 'There’s no deadline on this course.';
      if (/cover|learn|topics?|modules?|syllabus|outline|what.*(in|inside)/.test(s)) return 'It has ' + outline.length + ' modules:\n' + outline.map(function(m, i){ return (i + 1) + '. ' + m.title + (m.desc ? ' — ' + m.desc : ''); }).join('\n');
      var hit = (s.match(/[a-z]{4,}/g) || []).find(function(w){ return !STOP.test(w) && corpus.indexOf(w) !== -1; });
      if (!hit) return DECLINE;
      var where = [];
      outline.forEach(function(m, mi){ m.lessons.forEach(function(l){ if ((l[1] + ' ' + l[5]).toLowerCase().indexOf(hit) !== -1) where.push('Module ' + (mi + 1) + ' · ' + l[1]); }); });
      return where.length ? '“' + hit + '” is covered in:\n' + where.slice(0, 4).map(function(w){ return '• ' + w; }).join('\n') + '\n\nOpen the lesson in the player to ask the AI Tutor about it in detail.' : DECLINE;
    }

    var dock = $('aiDock'), barInput = $('aiInput'), sheetInput = $('sheetInput');
    var pending = null, sheetOpen = false;
    function setState(st){ dock.dataset.state = st; }
    function lastAi(){ for (var i = log.length - 1; i >= 0; i--) if (log[i].role === 'ai') return i; return -1; }

    /* ---- Bottom bar ---- */
    function renderBar(){
      var i = lastAi(), show = i !== -1 && dock.dataset.state === 'answer';
      $('aiAnswer').hidden = !show;
      if (show){
        var q = log[i - 1] && log[i - 1].role === 'user' ? log[i - 1].text : '';
        $('aiQ').textContent = q ? '“' + q + '”' : '';
        $('aiA').textContent = log[i].text;
        $('aiUp').setAttribute('aria-pressed', log[i].rating === 'up');
        $('aiDown').setAttribute('aria-pressed', log[i].rating === 'down');
        $('aiAnswer').scrollTop = 0;
      }
      barInput.placeholder = show ? 'Ask a follow-up…' : 'Ask anything about this course…';
      $('aiSuggest').innerHTML = dock.dataset.state === 'input' && !log.length ? SUGGEST.map(function(s){ return '<button type="button">' + s + '</button>'; }).join('') : '';
    }
    function openBar(){
      if (barOff){ openSheet(); return; }          // off: pill only opens the side panel
      setState(lastAi() !== -1 ? 'answer' : 'input');
      renderBar();
      barInput.focus();
    }
    function collapseBar(){ if (pending) return; closeMenu(); setState(barOff ? 'off' : 'pill'); renderBar(); }
    $('aiPill').addEventListener('click', openBar);
    $('aiPill').setAttribute('aria-label', barOff ? 'Open AI side panel' : 'Ask AI about this course');
    $('aiClose').addEventListener('click', collapseBar);
    $('aiToPanel').addEventListener('click', openSheet);
    // Empty + click away → shrink back to the sparkle pill (answer card stays until closed)
    dock.addEventListener('focusout', function(){
      setTimeout(function(){
        if (dock.contains(document.activeElement) || pending || !$('aiMenu').hidden) return;
        if (dock.dataset.state === 'input' && !barInput.value.trim()) collapseBar();
      }, 120);
    });
    ['aiUp', 'aiDown'].forEach(function(bid){
      $(bid).addEventListener('click', function(){
        var i = lastAi(); if (i === -1) return;
        var v = bid === 'aiUp' ? 'up' : 'down';
        log[i].rating = log[i].rating === v ? null : v; save(CHAT_KEY, log); render();
      });
    });

    /* ---- ⋮ menu ---- */
    function closeMenu(){ $('aiMenu').hidden = true; $('aiMore').setAttribute('aria-expanded', 'false'); }
    $('aiMore').addEventListener('click', function(){
      var open = $('aiMenu').hidden;
      $('aiMenu').hidden = !open; this.setAttribute('aria-expanded', open);
      if (open) $('aiMenu').querySelector('button').focus();
    });
    $('aiMenu').addEventListener('click', function(e){
      var b = e.target.closest('[data-act]'); if (!b) return;
      closeMenu();
      if (b.dataset.act === 'panel') openSheet();
      if (b.dataset.act === 'off'){ barOff = true; save(OFF_KEY, true); $('aiPill').setAttribute('aria-label', 'Open AI side panel'); setState('off'); renderBar(); }
    });
    document.addEventListener('click', function(e){ if (!e.target.closest('.menu-wrap')) closeMenu(); });

    /* ---- Side sheet ---- */
    function openSheet(){
      closeMenu();
      sheetOpen = true;
      document.body.classList.add('sheet-open');
      dock.hidden = true;
      renderSheet();
      setTimeout(function(){ sheetInput.focus(); }, 50);
    }
    function closeSheet(){
      sheetOpen = false;
      document.body.classList.remove('sheet-open');
      dock.hidden = false;
      setState(barOff ? 'off' : 'pill');
      renderBar();
      $('aiPill').focus();
    }
    $('sheetClose').addEventListener('click', closeSheet);
    $('sheetBackdrop').addEventListener('click', closeSheet);
    $('sheetToBar').addEventListener('click', function(){
      barOff = false; save(OFF_KEY, false);
      $('aiPill').setAttribute('aria-label', 'Ask AI about this course');
      closeSheet(); openBar();
    });
    $('sheetClear').addEventListener('click', function(){ log = []; save(CHAT_KEY, log); render(); });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (!$('aiMenu').hidden) closeMenu(); else if (sheetOpen) closeSheet(); else if (dock.dataset.state !== 'pill' && dock.dataset.state !== 'off') collapseBar();
    });

    function msgHtml(m, i){
      if (m.role === 'user') return '<div class="msg sent"><div class="mc"><div class="meta"><span class="name">You</span><span class="when">' + esc(m.when) + '</span></div><div class="bubble">' + esc(m.text) + '</div></div></div>';
      return '<div class="msg"><img class="avatar" src="' + AI_AVATAR + '" alt=""><div class="mc"><div class="meta"><span class="name">UpSpace AI</span><span class="when">' + esc(m.when) + '</span></div><div class="bubble">' + esc(m.text) + '</div>' +
        '<div class="rate"><span>Helpful?</span><button class="ib" type="button" data-rate="up" data-i="' + i + '" aria-label="Helpful" aria-pressed="' + (m.rating === 'up') + '">' + I.up + '</button><button class="ib" type="button" data-rate="down" data-i="' + i + '" aria-label="Not helpful" aria-pressed="' + (m.rating === 'down') + '">' + I.down + '</button></div></div></div>';
    }
    function renderSheet(){
      var t = $('thread');
      t.innerHTML = log.length ? log.map(msgHtml).join('')
        : '<div class="sheet-empty"><p>Ask about what this course covers, how long it takes, prerequisites or deadlines.</p><div class="suggest">' + SUGGEST.map(function(s){ return '<button type="button">' + s + '</button>'; }).join('') + '</div></div>';
      if (pending) t.insertAdjacentHTML('beforeend', '<div class="msg"><img class="avatar" src="' + AI_AVATAR + '" alt=""><div class="mc"><div class="meta"><span class="name">UpSpace AI</span></div><div class="typing" role="status" aria-label="AI is writing"><i></i><i></i><i></i></div></div></div>');
      t.scrollTop = t.scrollHeight;
      $('sheetClear').hidden = !log.length;
    }
    $('thread').addEventListener('click', function(e){
      var s = e.target.closest('.suggest button'); if (s){ ask(s.textContent); return; }
      var r = e.target.closest('[data-rate]'); if (!r) return;
      var m = log[r.dataset.i]; m.rating = m.rating === r.dataset.rate ? null : r.dataset.rate; save(CHAT_KEY, log); render();
    });
    $('aiSuggest').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) ask(b.textContent); });

    function render(){ renderBar(); if (sheetOpen) renderSheet(); }

    /* ---- Ask / stop ---- */
    function ask(q){
      q = q.trim(); if (!q || pending) return;
      log.push({ role:'user', text:q, when:clockNow() }); save(CHAT_KEY, log);
      if (!sheetOpen) setState('thinking');
      pending = setTimeout(function(){
        pending = null;
        log.push({ role:'ai', text:reply(q), when:clockNow() }); save(CHAT_KEY, log);
        if (!sheetOpen){ setState('answer'); barInput.focus(); }
        render();
      }, 900 + Math.random() * 700);
      render();
    }
    $('aiStop').addEventListener('click', function(){
      clearTimeout(pending); pending = null;
      var last = log.pop();                       // put the question back so it can be edited
      save(CHAT_KEY, log);
      barInput.value = last ? last.text : '';
      barInput.dispatchEvent(new Event('input'));
      setState(lastAi() !== -1 ? 'answer' : 'input'); render(); barInput.focus();
    });

    function wire(input, form, send){
      input.addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 140) + 'px'; $(send).disabled = !this.value.trim(); });
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $(form).requestSubmit(); } });
      $(form).addEventListener('submit', function(e){
        e.preventDefault(); if (pending || !input.value.trim()) return;
        ask(input.value); input.value = ''; input.style.height = 'auto'; $(send).disabled = true;
      });
    }
    wire(barInput, 'aiForm', 'aiSend');
    wire(sheetInput, 'sheetForm', 'sheetSend');

    setState(barOff ? 'off' : 'pill');
    renderBar();
  }
</script>

<!-- Modal (library) — course flashcards: form → generating → set / errors -->
<div class="fc-overlay" id="fcDialog" hidden>
  <div class="fc-modal fc-dialog" role="dialog" aria-modal="true" aria-labelledby="fcDlgTitle">
    <div class="fc-dlg-head">
      <div><h3 id="fcDlgTitle">Flashcards</h3><p>Question-and-answer cards made from this course's lessons.</p></div>
      <button class="fc-x" type="button" id="fcDlgClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="fc-dlg-body" id="fc" aria-live="polite"></div>
  </div>
</div>

<!-- Modal (library) — delete flashcards -->
<div class="fc-overlay" id="fcModal" style="z-index:95" hidden>
  <div class="fc-modal" role="dialog" aria-modal="true" aria-labelledby="fcModalTitle">
    <h3 id="fcModalTitle">Delete this course's flashcards?</h3>
    <p>You can generate them again at any time.</p>
    <div class="fc-acts" style="justify-content:flex-end;margin-top:20px"><button class="btn btn-secondary" type="button" id="fcModalCancel">Cancel</button><button class="btn btn-primary" type="button" id="fcModalOk" style="background:var(--error)">Delete</button></div>
  </div>
</div>
<script>
  (function(){
    var m = document.getElementById('fcModal');
    function close(){ m.hidden = true; }
    document.getElementById('fcModalCancel').onclick = close;
    m.addEventListener('click', function(e){ if (e.target === m) close(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !m.hidden){ e.stopImmediatePropagation(); close(); } }, true);
    var d = document.getElementById('fcDialog');
    document.getElementById('fcDlgClose').onclick = closeFlashcards;
    d.addEventListener('click', function(e){ if (e.target === d) closeFlashcards(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !d.hidden) closeFlashcards(); });
    if (location.hash === '#flashcards' && document.getElementById('fcOpen')) openFlashcards();
    document.getElementById('fcModalOk').onclick = function(){ var s = study(); delete s.decks[id]; save(STUDY_KEY, s); close(); renderFlashcards(); syncFcEntry(); };
  })();
</script>
</body>
</html>
